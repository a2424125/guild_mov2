<!-- ==========================================
     [길드 메신저] 보스타임 좌측 서랍 전용 모듈 (원본 스타일 복원)
     경로: pages/PageTimer.html
     ========================================== -->
<style>
  .drawer-boss-list-wrap {
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #ffffff;
    height: 100%;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .drawer-boss-list-wrap::-webkit-scrollbar { width: 4px; }
  .drawer-boss-list-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  .drawer-boss-card {
    padding: 10px 12px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: all 0.15s ease;
  }
  .drawer-boss-card:hover {
    border-color: #38bdf8;
    background-color: #f0f9ff;
  }
  .drawer-boss-card.spawned {
    background: #fff8f8;
    border-color: #fca5a5;
  }

  .drawer-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .drawer-boss-name {
    font-size: 0.85rem;
    font-weight: 800;
    color: #1e293b;
  }
  .drawer-card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: #64748b;
  }

  .badge-boss-state {
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .badge-boss-state.state-wait { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
  .badge-boss-state.state-spawn { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; animation: pulseBlink 1.4s infinite; }
  .badge-boss-state.state-imminent { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
  .badge-boss-state.state-normal { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

  @keyframes pulseBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .btn-drawer-cut {
    background: #ef4444; color: #ffffff; border: none; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; cursor: pointer;
  }
  .btn-drawer-cut:hover { background: #dc2626; }

  .btn-drawer-reserve {
    background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; font-size: 0.7rem; font-weight: 700; padding: 3px 7px; border-radius: 5px; cursor: pointer;
  }
  .btn-drawer-reserve:hover { background: #e2e8f0; color: #0f172a; }

  .drawer-modal-backdrop {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); z-index: 9999999; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .drawer-modal-card {
    background: #ffffff; border-radius: 14px; width: 100%; max-width: 310px; padding: 18px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
  }
</style>

<div class="drawer-boss-list-wrap" id="drawerBossListInner">
  <div class="text-secondary small text-center py-4">보스타임을 불러오는 중...</div>
</div>

<!-- 컷 예약 모달 -->
<div id="drawerModalReserve" class="drawer-modal-backdrop" style="display: none;">
  <div class="drawer-modal-card">
    <h6 class="fw-bold mb-1" style="font-size: 0.95rem;"><i class="fa-solid fa-clock-rotate-left text-primary me-1"></i>보스 컷 시간 입력</h6>
    <p class="text-secondary small mb-2" style="font-size: 0.72rem;">시간을 입력하면 다음 젠이 자동 계산됩니다.</p>
    
    <div class="p-2 rounded mb-2" style="background:#f8fafc; border:1px solid #e2e8f0; font-size:0.78rem;">
      <strong class="text-dark" id="drawerReserveBossName">보스명</strong>
    </div>

    <input type="text" id="drawerReserveTimeInput" class="form-control form-control-sm text-center mb-3" placeholder="예: 1427" maxlength="5" style="font-size:1.1rem; font-weight:800; letter-spacing:2px;">

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-light btn-sm flex-fill py-1" onclick="closeDrawerReserveModal()">취소</button>
      <button type="button" class="btn btn-warning btn-sm flex-fill fw-bold py-1" style="background:#fee500; border:none;" onclick="confirmDrawerReserveAction()">저장</button>
    </div>
  </div>
</div>

<script>
  var drawerModuleBossList = [];
  var drawerModuleInterval = null;
  var drawerTargetingBoss = null;

  window.__currentModuleCleanup = function() {
    if (drawerModuleInterval) {
      clearInterval(drawerModuleInterval);
      drawerModuleInterval = null;
    }
  };

  async function loadDrawerBossData() {
    const container = document.getElementById('drawerBossListInner');
    if (!container) return;

    try {
      const data = await apiRequest("boss_timers?select=*&order=id.asc");
      drawerModuleBossList = data || [];
      renderDrawerBossCards();
    } catch (err) {
      container.innerHTML = `<div class="text-danger small text-center py-3">조회 실패: ${err.message}</div>`;
    }
  }

  function renderDrawerBossCards() {
    const container = document.getElementById('drawerBossListInner');
    if (!container) return;

    if (drawerModuleBossList.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-4">등록된 보스가 없습니다.</div>';
      return;
    }

    const now = Date.now();
    const sorted = [...drawerModuleBossList].sort((a, b) => {
      const tA = a.next_spawn_time ? new Date(a.next_spawn_time).getTime() : 9999999999999;
      const tB = b.next_spawn_time ? new Date(b.next_spawn_time).getTime() : 9999999999999;
      return tA - tB;
    });

    container.innerHTML = sorted.map(b => {
      let badgeHtml = "";
      let itemClass = "";

      if (!b.next_spawn_time) {
        badgeHtml = `<span class="badge-boss-state state-wait" id="dBadge_${b.id}">컷 대기</span>`;
      } else {
        const nextDate = new Date(b.next_spawn_time);
        const diffSec = Math.floor((nextDate.getTime() - now) / 1000);
        if (diffSec <= 0) {
          itemClass = "spawned";
          const passM = Math.floor(Math.abs(diffSec) / 60);
          badgeHtml = `<span class="badge-boss-state state-spawn" id="dBadge_${b.id}">🚨 젠 완료 (+${passM}분)</span>`;
        } else if (diffSec <= 3600) {
          const m = Math.floor(diffSec / 60);
          badgeHtml = `<span class="badge-boss-state state-imminent" id="dBadge_${b.id}">⏳ ${m}분 남음</span>`;
        } else {
          const h = Math.floor(diffSec / 3600);
          const m = Math.floor((diffSec % 3600) / 60);
          badgeHtml = `<span class="badge-boss-state state-normal" id="dBadge_${b.id}">💤 ${h}시간 ${m}분</span>`;
        }
      }

      const nextTimeStr = b.next_spawn_time ? formatTime24Hour(new Date(b.next_spawn_time)) : "-";

      return `
        <div class="drawer-boss-card ${itemClass}" id="dCard_${b.id}">
          <div class="drawer-card-top">
            <span class="drawer-boss-name">${escapeHtmlText(b.boss_name)}</span>
            ${badgeHtml}
          </div>
          <div class="drawer-card-bottom">
            <span>젠 예정: <strong id="dTime_${b.id}" style="color:#0284c7;">${nextTimeStr}</strong></span>
            <div class="d-flex gap-1">
              <button type="button" class="btn-drawer-cut" onclick="recordDrawerCutNow(${b.id}, '${escapeHtmlText(b.boss_name)}', ${b.cycle_min})">컷</button>
              <button type="button" class="btn-drawer-reserve" onclick="openDrawerReserveModal(${b.id}, '${escapeHtmlText(b.boss_name)}', ${b.cycle_min})">예약</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateDrawerTimerValuesOnly() {
    const now = Date.now();
    (drawerModuleBossList || []).forEach(b => {
      const badgeElem = document.getElementById(`dBadge_${b.id}`);
      const cardElem = document.getElementById(`dCard_${b.id}`);
      const timeElem = document.getElementById(`dTime_${b.id}`);
      if (!badgeElem || !cardElem) return;

      if (!b.next_spawn_time) {
        badgeElem.className = "badge-boss-state state-wait";
        badgeElem.innerText = "컷 대기";
        cardElem.classList.remove("spawned");
        if (timeElem) timeElem.innerText = "-";
      } else {
        const nextDate = new Date(b.next_spawn_time);
        const diffSec = Math.floor((nextDate.getTime() - now) / 1000);
        if (diffSec <= 0) {
          const passM = Math.floor(Math.abs(diffSec) / 60);
          badgeElem.className = "badge-boss-state state-spawn";
          badgeElem.innerText = `🚨 젠 완료 (+${passM}분)`;
          cardElem.classList.add("spawned");
        } else if (diffSec <= 3600) {
          const m = Math.floor(diffSec / 60);
          badgeElem.className = "badge-boss-state state-imminent";
          badgeElem.innerText = `⏳ ${m}분 남음`;
          cardElem.classList.remove("spawned");
        } else {
          const h = Math.floor(diffSec / 3600);
          const m = Math.floor((diffSec % 3600) / 60);
          badgeElem.className = "badge-boss-state state-normal";
          badgeElem.innerText = `💤 ${h}시간 ${m}분`;
          cardElem.classList.remove("spawned");
        }
        if (timeElem) timeElem.innerText = formatTime24Hour(nextDate);
      }
    });
  }

  async function recordDrawerCutNow(id, bossName, cycleMin) {
    const cutDate = new Date();
    const nextSpawn = new Date(cutDate.getTime() + (cycleMin * 60 * 1000));

    try {
      await apiRequest(`boss_timers?id=eq.${id}`, "PATCH", {
        last_cut_time: cutDate.toISOString(),
        next_spawn_time: nextSpawn.toISOString()
      });

      await apiRequest("guild_chats", "POST", [{
        sender_name: "보스알리미",
        message: `⚔️ [${bossName}] 서랍에서 컷 처리되었습니다! (다음 젠: ${formatTime24Hour(nextSpawn)})`,
        msg_type: "boss_alert",
        mentions: []
      }]);

      if (typeof showKakaoToast === 'function') showKakaoToast(`[${bossName}] 컷 완료!`, "🎉");
      await loadDrawerBossData();
    } catch (e) {
      alert("컷 실패: " + e.message);
    }
  }

  function openDrawerReserveModal(id, bossName, cycleMin) {
    drawerTargetingBoss = { id, bossName, cycleMin };
    document.getElementById("drawerReserveBossName").innerText = bossName;
    document.getElementById("drawerReserveTimeInput").value = "";
    document.getElementById("drawerModalReserve").style.display = "flex";
    setTimeout(() => document.getElementById("drawerReserveTimeInput").focus(), 100);
  }

  function closeDrawerReserveModal() {
    document.getElementById("drawerModalReserve").style.display = "none";
    drawerTargetingBoss = null;
  }

  async function confirmDrawerReserveAction() {
    if (!drawerTargetingBoss) return;
    const timeVal = document.getElementById("drawerReserveTimeInput").value.trim();
    const clean = timeVal.replace(/[^0-9]/g, '');

    if (clean.length !== 4 && clean.length !== 3) {
      return alert("4자리 숫자로 입력하세요 (예: 1427)");
    }

    const padded = clean.length === 3 ? '0' + clean : clean;
    const h = parseInt(padded.slice(0, 2), 10);
    const m = parseInt(padded.slice(2, 4), 10);

    const cutDate = new Date();
    cutDate.setHours(h, m, 0, 0);

    const nextSpawn = new Date(cutDate.getTime() + (drawerTargetingBoss.cycleMin * 60 * 1000));

    try {
      await apiRequest(`boss_timers?id=eq.${drawerTargetingBoss.id}`, "PATCH", {
        last_cut_time: cutDate.toISOString(),
        next_spawn_time: nextSpawn.toISOString()
      });

      closeDrawerReserveModal();
      if (typeof showKakaoToast === 'function') showKakaoToast(`[${drawerTargetingBoss.bossName}] 예약 완료!`, "✅");
      await loadDrawerBossData();
    } catch (e) {
      alert("저장 실패: " + e.message);
    }
  }

  (function initDrawerPageTimer() {
    loadDrawerBossData();
    if (drawerModuleInterval) clearInterval(drawerModuleInterval);
    drawerModuleInterval = setInterval(updateDrawerTimerValuesOnly, 1000);
  })();
</script>
