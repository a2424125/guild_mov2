<!-- ==========================================
     [ECLIPSE 길드관리] 길드 비용 및 금고 현황 (날짜 입력창 ID 완벽 일치화 및 데이터 로드 정상화)
     ========================================== -->
<style>
  .finance-card {
    background: rgba(18, 26, 45, 0.9);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .finance-box {
    background: var(--drawer-card-bg);
    border: 1px solid var(--drawer-card-border);
    border-radius: 16px;
    padding: 16px;
    transition: all 0.2s ease;
  }

  .fin-date-btn {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--drawer-card-border);
    background: var(--modal-input-bg);
    color: var(--modal-text);
    cursor: pointer;
  }
  .fin-date-btn.active {
    background: #0284c7 !important;
    color: #ffffff !important;
    border-color: #0284c7 !important;
  }

  .badge-income {
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.3);
    font-weight: 700;
  }

  .badge-expense {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    font-weight: 700;
  }
</style>

<div class="container-fluid px-2 py-3">
  <!-- 상단 요약 카드 -->
  <div class="row g-2 mb-3">
    <div class="col-12">
      <div class="finance-box shadow-sm">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="small fw-bold text-secondary"><i class="fa-solid fa-vault text-warning me-1"></i>현재 길드 금고 잔액</span>
          <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.72rem;" onclick="openVaultEditModal()">
            <i class="fa-solid fa-pen-to-string me-1"></i>금고 잔액 수정
          </button>
        </div>
        <div class="d-flex align-items-baseline justify-content-between">
          <h3 class="fw-black mb-0 text-warning" id="finCurrentVaultTotal">0 D</h3>
          <span class="small text-muted" id="finVaultUpdatedTime">마지막 갱신: -</span>
        </div>
        <div class="mt-2 pt-2 border-top d-flex gap-3" style="font-size: 0.75rem;">
          <div><span class="text-secondary">누적 입금:</span> <strong class="text-success" id="finTotalIncomeSum">+0</strong></div>
          <div><span class="text-secondary">누적 지출:</span> <strong class="text-danger" id="finTotalExpenseSum">-0</strong></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 기간 필터 박스 -->
  <div class="finance-box mb-3 shadow-sm">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="small fw-bold text-secondary"><i class="fa-solid fa-filter me-1 text-info"></i>기간 필터</span>
      <span class="small fw-bold text-primary" id="finPeriodNetProfit">기간 순수익: 0 D</span>
    </div>
    <div class="d-flex gap-1 mb-2">
      <button type="button" class="fin-date-btn flex-fill active" id="btnRangeWeek" onclick="setFinanceQuickRange('thisWeek')">이번 주</button>
      <button type="button" class="fin-date-btn flex-fill" id="btnRangeLastWeek" onclick="setFinanceQuickRange('lastWeek')">지난 주</button>
      <button type="button" class="fin-date-btn flex-fill" id="btnRangeMonth" onclick="setFinanceQuickRange('thisMonth')">이번 달</button>
      <button type="button" class="fin-date-btn flex-fill" id="btnRangeAll" onclick="setFinanceQuickRange('all')">전체</button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <input type="date" id="finFilterStart" class="form-control form-control-sm text-center" style="font-size: 0.75rem;" onchange="loadFinanceData()">
      <span class="small text-muted">~</span>
      <input type="date" id="finFilterEnd" class="form-control form-control-sm text-center" style="font-size: 0.75rem;" onchange="loadFinanceData()">
    </div>
  </div>

  <!-- 액션 버튼 영역 -->
  <div class="d-flex gap-2 mb-3">
    <button type="button" class="btn btn-success flex-fill fw-bold py-2 shadow-sm" style="font-size: 0.8rem;" onclick="openIncomeModal()">
      <i class="fa-solid fa-circle-plus me-1"></i> 수익금 입금
    </button>
    <button type="button" class="btn btn-danger flex-fill fw-bold py-2 shadow-sm" style="font-size: 0.8rem;" onclick="openExpenseModal()">
      <i class="fa-solid fa-circle-minus me-1"></i> 길드 지출
    </button>
  </div>

  <!-- 수입금 입금 폼 영역 -->
  <div class="finance-box mb-3 shadow-sm" id="incomeFormCard">
    <div class="d-flex gap-2 mb-2">
      <button type="button" class="btn btn-sm btn-success flex-fill active" id="btnIncModeTotal" onclick="setIncomeCalcMode('total')">게임 금고 총액 입력</button>
      <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" id="btnIncModeDirect" onclick="setIncomeCalcMode('direct')">추가 입금 직접 입력</button>
    </div>

    <div class="mb-2">
      <label class="form-label text-secondary mb-1" style="font-size: 0.72rem; font-weight: 700;">입금 일자</label>
      <input type="date" id="incomeDate" class="form-control form-control-sm">
    </div>

    <div id="incomeBoxTotalMode" class="mb-2">
      <label class="form-label text-secondary mb-1" style="font-size: 0.72rem; font-weight: 700;">인게임 금고 총 보유액 (다이아)</label>
      <input type="text" id="incomeTotalInput" class="form-control form-control-sm" placeholder="금고 총액 입력" onkeyup="window.formatCommaInput(this); calculateIncomeDiff()">
      <div class="d-flex justify-content-between text-muted mt-1" style="font-size: 0.68rem;">
        <span id="incomePrevVaultText">직전 금고 잔액: 0 D</span>
        <span id="incomeInputSumText">입력 총액: 0 D</span>
      </div>
      <div class="mt-1 fw-bold text-primary" style="font-size: 0.72rem;" id="incomeRealDiffText">👉 실제 반영 입금액: +0 다이아</div>
    </div>

    <div id="incomeBoxDirectMode" class="mb-2" style="display: none;">
      <label class="form-label text-secondary mb-1" style="font-size: 0.72rem; font-weight: 700;">추가 입금할 금액 (다이아)</label>
      <input type="text" id="incomeDirectInput" class="form-control form-control-sm" placeholder="예: 5,000" onkeyup="window.formatCommaInput(this)">
    </div>

    <div class="mb-2">
      <label class="form-label text-secondary mb-1" style="font-size: 0.72rem; font-weight: 700;">수익 내역 / 사유</label>
      <input type="text" id="incomeReason" class="form-control form-control-sm" placeholder="예: 보스 토벌 누적 수익금, 길드 후원">
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary mb-1" style="font-size: 0.72rem; font-weight: 700;">비고 / 전달자 닉네임 (선택 사항)</label>
      <input type="text" id="incomeMemo" class="form-control form-control-sm" placeholder="비고 / 전달자 닉네임 (선택 사항)">
    </div>

    <button type="button" class="btn btn-success w-100 fw-bold py-2 shadow-sm" style="font-size: 0.82rem;" onclick="executeAddIncome()">
      <i class="fa-solid fa-circle-plus me-1"></i>금고에 수익 입금 처리
    </button>
  </div>

  <!-- 입출금 내역 리스트 -->
  <div class="finance-box shadow-sm mb-3">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="small fw-bold text-secondary"><i class="fa-solid fa-list-check me-1 text-warning"></i>입출금 내역 <span class="text-muted" style="font-size:0.68rem;">(클릭 시 수정/삭제)</span></span>
      <div class="d-flex gap-1">
        <button type="button" class="btn btn-sm btn-outline-info py-0 px-2" style="font-size: 0.72rem;" onclick="shareFinanceReportToChat()">
          <i class="fa-solid fa-comment me-1"></i> 대화방 공유
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.72rem;" onclick="loadFinanceData()">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>
    </div>

    <div id="financeLogsList" style="max-height: 380px; overflow-y: auto;">
      <div class="text-secondary small text-center py-4">내역을 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 금고 잔액 수정 모달 -->
<div id="modalVaultEdit" class="kakao-modal-backdrop" style="display: none;">
  <div class="kakao-modal-card">
    <h6 class="fw-bold mb-3"><i class="fa-solid fa-vault text-warning me-1"></i>길드 금고 잔액 직접 설정</h6>
    <div class="small text-secondary mb-2">현재 인게임 금고 총 보유액(다이아)을 입력하세요.</div>
    <input type="text" id="inputVaultNewTotal" class="form-control form-control-sm mb-3" placeholder="예: 1,500,000" onkeyup="window.formatCommaInput(this)">
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="closeVaultEditModal()">취소</button>
      <button type="button" class="btn btn-sm btn-warning flex-fill fw-bold text-dark" onclick="saveVaultNewTotal()">저장</button>
    </div>
  </div>
</div>

<!-- 지출 등록 모달 -->
<div id="modalExpenseAdd" class="kakao-modal-backdrop" style="display: none;">
  <div class="kakao-modal-card" style="max-width: 340px;">
    <h6 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-circle-minus me-1"></i>길드 금고 지출</h6>

    <div class="text-start small fw-bold text-secondary mb-1">지출 일자</div>
    <input type="date" id="expenseDate" class="form-control form-control-sm mb-2">

    <div class="text-start small fw-bold text-secondary mb-1">지출 금액 (다이아)</div>
    <input type="text" id="expenseAmount" class="form-control form-control-sm mb-2" placeholder="예: 10,000" onkeyup="window.formatCommaInput(this)">

    <div class="text-start small fw-bold text-secondary mb-1">지출 사유 / 용도</div>
    <input type="text" id="expenseReason" class="form-control form-control-sm mb-2" placeholder="예: 공용 쟁 포션비 지원, 이벤트 보상">

    <div class="text-start small fw-bold text-secondary mb-1">수령자 / 담당자 닉네임 (선택)</div>
    <input type="text" id="expenseReceiver" class="form-control form-control-sm mb-3" placeholder="예: OOO 캐릭터">

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="closeExpenseModal()">취소</button>
      <button type="button" class="btn btn-sm btn-danger flex-fill fw-bold" onclick="executeAddExpense()">지출 처리</button>
    </div>
  </div>
</div>

<!-- 내역 상세/수정 모달 -->
<div id="modalFinanceEdit" class="kakao-modal-backdrop" style="display: none;">
  <div class="kakao-modal-card" style="max-width: 340px;">
    <h6 class="fw-bold mb-3 text-info"><i class="fa-solid fa-pen-to-square me-1"></i>입출금 내역 수정 / 삭제</h6>
    <input type="hidden" id="editLogId">

    <div class="text-start small fw-bold text-secondary mb-1">일자</div>
    <input type="date" id="editLogDate" class="form-control form-control-sm mb-2">

    <div class="text-start small fw-bold text-secondary mb-1">구분</div>
    <select id="editLogType" class="form-select form-select-sm mb-2">
      <option value="입금">입금</option>
      <option value="출금">출금</option>
    </select>

    <div class="text-start small fw-bold text-secondary mb-1">금액 (다이아)</div>
    <input type="text" id="editLogAmount" class="form-control form-control-sm mb-2" onkeyup="window.formatCommaInput(this)">

    <div class="text-start small fw-bold text-secondary mb-1">내역 / 사유</div>
    <input type="text" id="editLogReason" class="form-control form-control-sm mb-2">

    <div class="text-start small fw-bold text-secondary mb-1">비고 / 전달자</div>
    <input type="text" id="editLogMemo" class="form-control form-control-sm mb-3">

    <div class="d-flex gap-2 mb-2">
      <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="closeEditFinanceModal()">취소</button>
      <button type="button" class="btn btn-sm btn-primary flex-fill fw-bold" onclick="executeEditFinanceLog()">수정 저장</button>
    </div>
    <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="executeDeleteFinanceLog()"><i class="fa-solid fa-trash-can me-1"></i>내역 삭제</button>
  </div>
</div>

<script>
  let rawFinanceLogs = [];
  let currentBalance = 0;
  let currentVaultBalance = 0;
  let incomeCalcMode = 'total';
  let lastFetchedPrevVault = 0;

  window.formatCommaInput = function(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (!val) {
      input.value = '';
      return;
    }
    input.value = Number(val).toLocaleString();
  };

  window.parseCommaNumber = function(str) {
    if (!str) return 0;
    let clean = String(str).replace(/[^0-9]/g, '');
    return parseInt(clean, 10) || 0;
  };

  async function initFinanceModule() {
    await loadConfiguredGuildName();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('incomeDate').value = today;
    document.getElementById('expenseDate').value = today;

    window.setFinanceQuickRange('thisWeek');
    window.setIncomeCalcMode('total');
  }

  async function loadConfiguredGuildName() {
    try {
      const res = await apiRequest("guild_settings?key=eq.guild_name");
      if (res && res.length > 0 && res[0].value) {
        window.activeGuildNameForFinance = res[0].value;
      } else {
        window.activeGuildNameForFinance = "길드";
      }
    } catch(e) {
      window.activeGuildNameForFinance = "길드";
    }
  }

  window.setFinanceQuickRange = function(rangeType) {
    const today = new Date();
    let startD = new Date();
    let endD = new Date();

    document.getElementById('btnRangeWeek').classList.remove('active');
    document.getElementById('btnRangeLastWeek').classList.remove('active');
    document.getElementById('btnRangeMonth').classList.remove('active');
    document.getElementById('btnRangeAll').classList.remove('active');

    if (rangeType === 'thisWeek') {
      document.getElementById('btnRangeWeek').classList.add('active');
      const day = today.getDay();
      const diffToMonday = today.getDate() - day + (day === 0 ? -6 : 1);
      startD = new Date(today.setDate(diffToMonday));
      endD = new Date();
    } else if (rangeType === 'lastWeek') {
      document.getElementById('btnRangeLastWeek').classList.add('active');
      const day = today.getDay();
      const diffToLastMon = today.getDate() - day - 6 + (day === 0 ? -6 : 1);
      startD = new Date(today.setDate(diffToLastMon));
      endD = new Date(today.setDate(startD.getDate() + 6));
    } else if (rangeType === 'thisMonth') {
      document.getElementById('btnRangeMonth').classList.add('active');
      startD = new Date(today.getFullYear(), today.getMonth(), 1);
      endD = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (rangeType === 'all') {
      document.getElementById('btnRangeAll').classList.add('active');
      startD = new Date(2025, 0, 1);
      endD = new Date(2035, 11, 31);
    }

    document.getElementById('finFilterStart').value = startD.toISOString().split('T')[0];
    document.getElementById('finFilterEnd').value = endD.toISOString().split('T')[0];

    loadFinanceData();
  };

  window.loadFinanceData = async function() {
    const container = document.getElementById('financeLogsList');
    if (container) {
      container.innerHTML = `<div class="text-secondary small text-center py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>내역을 불러오는 중...</div>`;
    }

    const start = document.getElementById('finFilterStart').value;
    const end = document.getElementById('finFilterEnd').value;

    try {
      const rows = await apiRequest("guild_finances?select=*&order=created_at.desc,id.desc");
      const rawRows = rows || [];

      const logs = rawRows.map(r => {
        const typeStr = (r.tx_type === '출금' || r.tx_type === '지출') ? '출금' : '입금';
        let dateStr = new Date().toISOString().split('T')[0];
        if (r.created_at) {
          dateStr = new Date(r.created_at).toISOString().split('T')[0];
        }
        const reasonStr = r.reason || '사유 없음';
        const categoryStr = r.category || '';

        const inFilter = (!start || dateStr >= start) && (!end || dateStr <= end);

        return {
          id: r.id,
          log_date: dateStr,
          tx_type: typeStr,
          amount: Number(r.amount || 0),
          reason: reasonStr,
          category: categoryStr,
          created_at: r.created_at,
          inFilter: inFilter
        };
      });

      let totalInc = 0;
      let totalExp = 0;
      let filteredInc = 0;
      let filteredExp = 0;

      logs.forEach(l => {
        const amt = Number(l.amount || 0);
        if (l.tx_type === '입금') {
          totalInc += amt;
          if (l.inFilter) filteredInc += amt;
        } else if (l.tx_type === '출금') {
          totalExp += amt;
          if (l.inFilter) filteredExp += amt;
        }
      });

      currentBalance = totalInc - totalExp;
      currentVaultBalance = currentBalance;

      document.getElementById('finCurrentVaultTotal').innerText = currentBalance.toLocaleString() + " D";
      document.getElementById('finTotalIncomeSum').innerText = "+" + totalInc.toLocaleString();
      document.getElementById('finTotalExpenseSum').innerText = "-" + totalExp.toLocaleString();

      if (logs.length > 0) {
        const lastDt = logs[0].created_at ? new Date(logs[0].created_at) : new Date();
        document.getElementById('finVaultUpdatedTime').innerText = `마지막 갱신: ${formatTime24Hour(lastDt)}`;
      } else {
        document.getElementById('finVaultUpdatedTime').innerText = `마지막 갱신: -`;
      }

      const periodNet = filteredInc - filteredExp;
      document.getElementById('finPeriodNetProfit').innerText = `기간 순수익: ${periodNet.toLocaleString()} D`;

      lastFetchedPrevVault = currentBalance;
      document.getElementById('incomePrevVaultText').innerText = `직전 금고 잔액: ${lastFetchedPrevVault.toLocaleString()} D`;

      window.lastFinanceData = {
        logs: logs,
        currentBalance: currentBalance,
        totalIncome: totalInc,
        totalExpense: totalExp,
        filteredIncome: periodNet
      };

      const filteredLogs = logs.filter(l => l.inFilter);

      if (filteredLogs.length === 0) {
        container.innerHTML = `<div class="text-secondary small text-center py-4">조회된 입출금 내역이 없습니다.</div>`;
        return;
      }

      container.innerHTML = filteredLogs.map(l => {
        const isInc = (l.tx_type === '입금');
        const badgeClass = isInc ? 'badge-income' : 'badge-expense';
        const signStr = isInc ? '+' : '-';
        const amtStr = Number(l.amount || 0).toLocaleString();
        const catBadge = l.category ? `<span class="badge ${badgeClass}" style="font-size: 0.68rem; padding: 2px 5px;">${escapeHtmlText(l.category)}</span>` : '';

        return `
          <div class="p-2 mb-2 rounded border bg-white shadow-sm d-flex align-items-center justify-content-between" 
               style="cursor: pointer; transition: background 0.12s;" 
               onclick="openFinanceEditModal('${l.id}')">
            <div style="min-width: 0; flex: 1; padding-right: 6px;">
              <div class="d-flex align-items-center gap-2 mb-1">
                ${catBadge}
                <span class="small fw-bold text-dark text-truncate">${escapeHtmlText(l.reason)}</span>
              </div>
              <div class="text-muted" style="font-size: 0.68rem;">
                ${escapeHtmlText(l.log_date)} • ${escapeHtmlText(l.category || l.tx_type)}
              </div>
            </div>
            <div class="text-end fw-black ${isInc ? 'text-success' : 'text-danger'}" style="font-size: 0.88rem; white-space: nowrap;">
              ${signStr}${amtStr} D
            </div>
          </div>
        `;
      }).join('');

    } catch (e) {
      if (container) {
        container.innerHTML = `<div class="text-danger small text-center py-4">데이터 로드 실패: ${e.message}</div>`;
      }
    }
  };

  window.openVaultEditModal = function() {
    document.getElementById('inputVaultNewTotal').value = currentBalance.toLocaleString();
    document.getElementById('modalVaultEdit').style.display = 'flex';
  };
  window.closeVaultEditModal = function() {
    document.getElementById('modalVaultEdit').style.display = 'none';
  };
  window.saveVaultNewTotal = async function() {
    const val = window.parseCommaNumber(document.getElementById('inputVaultNewTotal').value);
    if (isNaN(val)) return showKakaoToast("올바른 금액을 입력하세요.", "⚠️");

    const diff = val - currentBalance;
    if (diff === 0) {
      closeVaultEditModal();
      return;
    }

    const customCreatedAt = new Date().toISOString();
    try {
      await apiRequest("guild_finances", "POST", [{
        tx_type: diff > 0 ? "입금" : "출금",
        amount: Math.abs(diff),
        category: "금고 잔액 보정",
        reason: "관리자 직접 수정",
        created_at: customCreatedAt
      }]);
      closeVaultEditModal();
      showKakaoToast("금고 잔액이 보정되었습니다.", "🎉");
      loadFinanceData();
    } catch(err) {
      showKakaoToast("수정 실패: " + err.message, "❌");
    }
  };

  window.setIncomeCalcMode = function(mode) {
    incomeCalcMode = mode;
    const btnTot = document.getElementById('btnIncModeTotal');
    const btnDir = document.getElementById('btnIncModeDirect');
    const boxTot = document.getElementById('incomeBoxTotalMode');
    const boxDir = document.getElementById('incomeBoxDirectMode');

    if (mode === 'total') {
      btnTot.className = "btn btn-sm btn-success flex-fill active";
      btnDir.className = "btn btn-sm btn-outline-secondary flex-fill";
      boxTot.style.display = 'block';
      boxDir.style.display = 'none';
    } else {
      btnTot.className = "btn btn-sm btn-outline-secondary flex-fill";
      btnDir.className = "btn btn-sm btn-success flex-fill active";
      boxTot.style.display = 'none';
      boxDir.style.display = 'block';
    }
  };

  window.calculateIncomeDiff = function() {
    if (incomeCalcMode === 'total') {
      const val = window.parseCommaNumber(document.getElementById('incomeTotalInput').value);
      const diff = val - lastFetchedPrevVault;
      document.getElementById('incomeInputSumText').innerText = `입력 총액: ${val.toLocaleString()} D`;
      const sign = diff >= 0 ? "+" : "";
      document.getElementById('incomeRealDiffText').innerText = `👉 실제 반영 입금액: ${sign}${diff.toLocaleString()} 다이아`;
    }
  };

  window.executeAddIncome = async function() {
    const dt = document.getElementById('incomeDate').value;
    const reason = document.getElementById('incomeReason').value.trim() || "수익금 입금";
    const memo = document.getElementById('incomeMemo').value.trim();

    let amount = 0;
    if (incomeCalcMode === 'total') {
      const totalVal = window.parseCommaNumber(document.getElementById('incomeTotalInput').value);
      if (isNaN(totalVal)) return showKakaoToast("금고 총액을 올바르게 입력하세요.", "⚠️");
      amount = totalVal - lastFetchedPrevVault;
      if (amount <= 0) return showKakaoToast("입력한 총액이 직전 잔액보다 적거나 같습니다.", "⚠️");
    } else {
      amount = window.parseCommaNumber(document.getElementById('incomeDirectInput').value);
      if (isNaN(amount) || amount <= 0) return showKakaoToast("유효한 입금 금액을 입력하세요.", "⚠️");
    }

    const customCreatedAt = dt ? new Date(`${dt}T12:00:00`).toISOString() : new Date().toISOString();

    try {
      await apiRequest("guild_finances", "POST", [{
        tx_type: "입금",
        amount: amount,
        category: "수익금입금",
        reason: memo ? `${reason} (${memo})` : reason,
        created_at: customCreatedAt
      }]);
      showKakaoToast(`+${amount.toLocaleString()} D 수익금 입금 완료!`, "🎉");
      document.getElementById('incomeTotalInput').value = '';
      document.getElementById('incomeDirectInput').value = '';
      document.getElementById('incomeReason').value = '';
      document.getElementById('incomeMemo').value = '';
      loadFinanceData();
    } catch(err) {
      showKakaoToast("입금 처리 실패: " + err.message, "❌");
    }
  };

  window.openExpenseModal = function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('expenseDate').value = today;
    document.getElementById('expenseAmount').value = '';
    document.getElementById('expenseReason').value = '';
    document.getElementById('expenseReceiver').value = '';
    document.getElementById('modalExpenseAdd').style.display = 'flex';
  };
  window.closeExpenseModal = function() {
    document.getElementById('modalExpenseAdd').style.display = 'none';
  };

  window.executeAddExpense = async function() {
    const dt = document.getElementById('expenseDate').value;
    const amount = window.parseCommaNumber(document.getElementById('expenseAmount').value);
    const reason = document.getElementById('expenseReason').value.trim() || "길드 지출";
    const receiver = document.getElementById('expenseReceiver').value.trim();

    if (isNaN(amount) || amount <= 0) return showKakaoToast("지출 금액을 올바르게 입력하세요.", "⚠️");

    const customCreatedAt = dt ? new Date(`${dt}T12:00:00`).toISOString() : new Date().toISOString();

    try {
      await apiRequest("guild_finances", "POST", [{
        tx_type: "출금",
        amount: amount,
        category: "길드지출",
        reason: receiver ? `${reason} (${receiver})` : reason,
        created_at: customCreatedAt
      }]);
      closeExpenseModal();
      showKakaoToast(`-${amount.toLocaleString()} D 길드 지출 완료!`, "💸");
      loadFinanceData();
    } catch(err) {
      showKakaoToast("지출 처리 실패: " + err.message, "❌");
    }
  };

  window.openFinanceEditModal = function(id) {
    const log = (window.lastFinanceData.logs || []).find(l => String(l.id) === String(id));
    if (!log) return;

    document.getElementById('editLogId').value = log.id;
    document.getElementById('editLogDate').value = log.log_date;
    document.getElementById('editLogType').value = log.tx_type;
    document.getElementById('editLogAmount').value = Number(log.amount).toLocaleString();
    document.getElementById('editLogReason').value = log.reason;
    document.getElementById('editLogMemo').value = log.category;

    document.getElementById('modalFinanceEdit').style.display = 'flex';
  };
  window.closeEditFinanceModal = function() {
    document.getElementById('modalFinanceEdit').style.display = 'none';
  };

  window.executeEditFinanceLog = async function() {
    const id = document.getElementById('editLogId').value;
    const dt = document.getElementById('editLogDate').value;
    const logType = document.getElementById('editLogType').value;
    const amount = window.parseCommaNumber(document.getElementById('editLogAmount').value);
    const reason = document.getElementById('editLogReason').value.trim();
    const category = document.getElementById('editLogMemo').value.trim();

    if (isNaN(amount) || amount <= 0) return showKakaoToast("올바른 금액을 입력하세요.", "⚠️");
    const customCreatedAt = dt ? new Date(`${dt}T12:00:00`).toISOString() : new Date().toISOString();

    try {
      await apiRequest(`guild_finances?id=eq.${id}`, "PATCH", {
        tx_type: logType,
        amount: amount,
        category: category || (logType === '입금' ? '수익금입금' : '길드지출'),
        reason: reason,
        created_at: customCreatedAt
      });
      closeEditFinanceModal();
      showKakaoToast("내역이 수정되었습니다.", "✏️");
      loadFinanceData();
    } catch(err) {
      showKakaoToast("수정 실패: " + err.message, "❌");
    }
  };

  window.executeDeleteFinanceLog = async function() {
    if (!confirm("정말 이 내역을 삭제하시겠습니까?")) return;
    const id = document.getElementById('editLogId').value;

    try {
      await apiRequest(`guild_finances?id=eq.${id}`, "DELETE");
      closeEditFinanceModal();
      showKakaoToast("내역이 삭제되었습니다.", "🗑️");
      loadFinanceData();
    } catch(err) {
      showKakaoToast("삭제 실패: " + err.message, "❌");
    }
  };

  window.shareFinanceReportToChat = async function() {
    const sDate = document.getElementById('finFilterStart').value;
    const eDate = document.getElementById('finFilterEnd').value;

    const filtered = (window.lastFinanceData.logs || []).filter(l => l.inFilter);

    if (filtered.length === 0) return showKakaoToast("공유할 비용 현황 내역이 없습니다.", "⚠️");

    let incSum = 0;
    let expSum = 0;
    filtered.forEach(l => {
      const amt = Number(l.amount || 0);
      if (l.tx_type === '입금') incSum += amt;
      else if (l.tx_type === '출금') expSum += amt;
    });
    const netSum = incSum - expSum;

    const reportHtml = `
      <div class="finance-report-card">
        <div class="fin-card-header">
          <div class="fin-card-title">
            <i class="fa-solid fa-landmark text-warning"></i>
            <span class="text-truncate">길드금고 결산 보고서</span>
          </div>
          <span class="fin-date-badge">${sDate} ~ ${eDate}</span>
        </div>

        <div class="fin-vault-hero">
          <div>
            <div class="fin-vault-label">현재 금고 총 잔액</div>
            <div class="fin-vault-val">${currentBalance.toLocaleString()} D</div>
          </div>
          <div style="font-size: 1.5rem;">🏛️</div>
        </div>

        <div class="fin-period-box">
          <div class="d-flex justify-content-between mb-1">
            <span class="text-muted">기간 총 수입:</span>
            <strong class="text-success">+${incSum.toLocaleString()} D</strong>
          </div>
          <div class="d-flex justify-content-between mb-1">
            <span class="text-muted">기간 총 지출:</span>
            <strong class="text-danger">-${expSum.toLocaleString()} D</strong>
          </div>
          <div class="d-flex justify-content-between pt-1 border-top">
            <span class="fw-bold text-dark">기간 순수익:</span>
            <strong class="fw-bold ${netSum >= 0 ? 'text-primary' : 'text-danger'}">${netSum >= 0 ? '+' : ''}${netSum.toLocaleString()} D</strong>
          </div>
        </div>

        <div class="text-muted text-center" style="font-size: 10px;">
          조회 내역 총 ${filtered.length}건 결산 완료
        </div>
      </div>
    `;

    try {
      await apiRequest("guild_chats", "POST", [{
        sender_name: "금고알리미",
        message: reportHtml,
        msg_type: "finance_report",
        mentions: []
      }]);
      showKakaoToast("대화방에 길드비용 현황이 공유되었습니다!", "🏛️");
      if (typeof closeModuleOverlay === 'function') closeModuleOverlay();
    } catch (err) {
      showKakaoToast("공유 실패: " + err.message, "❌");
    }
  };

  initFinanceModule();
</script>
