<style>
  .finance-card {
    background: rgba(18, 26, 45, 0.9);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
  }

  .finance-box {
    background: var(--drawer-card-bg);
    border: 1px solid var(--drawer-card-border);
    border-radius: 16px;
    padding: 16px;
    transition: all 0.2s ease;
  }

  .input-custom-finance {
    background: var(--modal-input-bg) !important;
    border: 1px solid var(--modal-input-border) !important;
    color: var(--modal-input-text) !important;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.85rem;
    outline: none;
    transition: all 0.2s ease;
  }
  .input-custom-finance:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }
  .input-custom-finance::-webkit-calendar-picker-indicator {
    filter: invert(0.7);

  }
  .input-custom-finance::placeholder {
    color: var(--kakao-input-placeholder);
  }

  .quick-filter-btn {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid var(--drawer-card-border);
    background: var(--modal-input-bg);
    color: var(--modal-text);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .quick-filter-btn:hover {
    background: var(--drawer-item-hover-bg);
  }
  .quick-filter-btn.active {
    background: #0284c7 !important;
    color: #ffffff !important;
    border-color: #0284c7 !important;
  }

  .finance-type-btn {
    flex: 1;
    padding: 10px;
    font-size: 0.82rem;
    font-weight: 800;
    border-radius: 12px;
    border: 1px solid var(--drawer-card-border);
    background: var(--modal-input-bg);
    color: var(--modal-text);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .finance-type-btn.active.btn-type-income {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
    color: #ffffff !important;
    border-color: #059669 !important;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
  }
  .finance-type-btn.active.btn-type-expense {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
    color: #ffffff !important;
    border-color: #dc2626 !important;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
  }

  .finance-log-item {
    background: var(--drawer-card-bg);
    border: 1px solid var(--drawer-card-border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .finance-log-item:hover {
    border-color: #38bdf8;
    transform: translateY(-1px);
  }

  #financeLogsList::-webkit-scrollbar { width: 6px; }
  #financeLogsList::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
  #financeLogsList::-webkit-scrollbar-thumb { background: var(--drawer-card-border); border-radius: 8px; }
  #financeLogsList::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

  .fin-modal-bg {

    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.6);

  .fin-modal-card {

    color: var(--modal-text);

<script>
  window.lastFinanceData = { logs: [], currentBalance: 0, filteredIncome: 0, totalIncome: 0, totalExpense: 0 };

  window.formatCommaInput = function(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (!val) {
      input.value = '';
      return;
    }
    input.value = Number(val).toLocaleString();
  };

  window.parseCommaNumber = function(str) {
    if (!str) return 0;
    let clean = String(str).replace(/[^0-9]/g, '');
    return parseInt(clean, 10) || 0;
  };

  window.formatDateToYYYYMMDD = function(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  };

  window.togglePayoutBox = function() {
    const box = document.getElementById('payoutCalcBox');
    const txt = document.getElementById('payoutToggleText');
    if (box.style.display === 'none') {
      box.style.display = 'block';
      txt.innerText = '닫기';
      window.fetchIncomeForCalc();
    } else {
      box.style.display = 'none';
      txt.innerText = '열기';
    }
  };

  window.fetchIncomeForCalc = async function() {
    const start = document.getElementById('calcStartDate').value;
    const end = document.getElementById('calcEndDate').value;
    const logs = window.lastFinanceData.logs || [];

    let sum = 0;
    logs.forEach(l => {
      if (l.type === '입금') {
        if (start && l.date < start) return;
        if (end && l.date > end) return;
        sum += Number(l.amount || 0);
      }
    });

    document.getElementById('calcBaseAmount').value = sum.toLocaleString();
    window.runPayoutSimulation();
  };

  window.runPayoutSimulation = function() {
    const baseAmt = window.parseCommaNumber(document.getElementById('calcBaseAmount').value);
    const taxRate = parseFloat(document.getElementById('calcMasterTaxRate').value) || 0;
    const memCnt = parseInt(document.getElementById('calcMemberCount').value, 10) || 1;

    const masterTax = Math.floor(baseAmt * (taxRate / 100));
    const payoutPool = Math.max(0, baseAmt - masterTax);
    const perMember = memCnt > 0 ? Math.floor(payoutPool / memCnt) : 0;

    document.getElementById('resultMasterTaxAmt').innerText = masterTax.toLocaleString() + " 다이아";
    document.getElementById('resultPayoutPool').innerText = payoutPool.toLocaleString() + " 다이아";
    document.getElementById('resultPerMemberAmt').innerText = perMember.toLocaleString() + " 다이아 / 1인";
  };

  window.setFinanceQuickRange = function(type) {
    const today = new Date();
    let start = null;
    let end = new Date();

    document.getElementById('fBtnThisWeek').classList.remove('active');
    document.getElementById('fBtnLastWeek').classList.remove('active');
    document.getElementById('fBtnThisMonth').classList.remove('active');
    document.getElementById('fBtnAll').classList.remove('active');

    if (type === 'thisWeek') {
      document.getElementById('fBtnThisWeek').classList.add('active');
      const day = today.getDay();
      const diff = today.getDate() - day + (day === 0 ? -6 : 1);
      start = new Date(today.setDate(diff));
      end = new Date();
    } else if (type === 'lastWeek') {
      document.getElementById('fBtnLastWeek').classList.add('active');
      const day = today.getDay();
      const diffToLastMon = today.getDate() - day - 6 + (day === 0 ? -6 : 1);
      start = new Date(today.setDate(diffToLastMon));
      end = new Date(today.setDate(start.getDate() + 6));
    } else if (type === 'thisMonth') {
      document.getElementById('fBtnThisMonth').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (type === 'all') {
      document.getElementById('fBtnAll').classList.add('active');
      start = null;
      end = null;
    }

    document.getElementById('financeStartDate').value = start ? window.formatDateToYYYYMMDD(start) : '';
    document.getElementById('financeEndDate').value = end ? window.formatDateToYYYYMMDD(end) : '';

    window.loadFinanceData();
  };

  window.switchFinanceMode = function(mode) {
    const bInc = document.getElementById('btnModeIncome');
    const bExp = document.getElementById('btnModeExpense');
    const fInc = document.getElementById('formSectionIncome');
    const fExp = document.getElementById('formSectionExpense');

    if (mode === 'income') {
      bInc.classList.add('active');
      bExp.classList.remove('active');
      fInc.style.display = 'block';
      fExp.style.display = 'none';
    } else {
      bExp.classList.add('active');
      bInc.classList.remove('active');
      fInc.style.display = 'none';
      fExp.style.display = 'block';
    }
  };

  window.loadFinanceData = async function() {
    const start = document.getElementById('financeStartDate').value;
    const end = document.getElementById('financeEndDate').value;
    const list = document.getElementById('financeLogsList');

    list.innerHTML = `<div class="text-secondary small text-center py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>내역을 불러오는 중...</div>`;

    try {
      // 🎯 기존 원본 테이블 명 'guild_finances' 정상 호출
      const rows = await apiRequest("guild_finances?select=*&order=created_at.desc,id.desc");
      const logs = rows || [];

      let totalInc = 0;
      let totalExp = 0;

      logs.forEach(l => {
        const amt = Number(l.amount || 0);
        if (l.type === '입금') totalInc += amt;
        else if (l.type === '지출') totalExp += amt;
      });

      const currentBalance = totalInc - totalExp;
      document.getElementById('finCurrentBalanceText').innerText = currentBalance.toLocaleString() + " 다이아";
      document.getElementById('finTotalIncomeText').innerText = "+" + totalInc.toLocaleString();
      document.getElementById('finTotalExpenseText').innerText = "-" + totalExp.toLocaleString();

      let filteredInc = 0;
      let filteredExp = 0;
      const processedLogs = logs.map(l => {
        let inFilter = true;
        if (start && l.date < start) inFilter = false;
        if (end && l.date > end) inFilter = false;

        if (inFilter) {
          const amt = Number(l.amount || 0);
          if (l.type === '입금') filteredInc += amt;
          else if (l.type === '지출') filteredExp += amt;
        }

        return { ...l, inFilter };
      });

      const netProfit = filteredInc - filteredExp;
      document.getElementById('filterSummaryText').innerText = `순수익: ${netProfit >= 0 ? '+' : ''}${netProfit.toLocaleString()} 다이아`;

      window.lastFinanceData = {
        logs: processedLogs,
        currentBalance: currentBalance,
        filteredIncome: filteredInc,
        totalIncome: totalInc,
        totalExpense: totalExp
      };

      window.renderFinanceLogs(processedLogs);

      const todayStr = window.formatDateToYYYYMMDD(new Date());
      if (!document.getElementById('incomeDate').value) document.getElementById('incomeDate').value = todayStr;
      if (!document.getElementById('expenseDate').value) document.getElementById('expenseDate').value = todayStr;
      if (!document.getElementById('calcStartDate').value) document.getElementById('calcStartDate').value = start || todayStr;
      if (!document.getElementById('calcEndDate').value) document.getElementById('calcEndDate').value = end || todayStr;

      if (document.getElementById('payoutCalcBox').style.display !== 'none') {
        window.fetchIncomeForCalc();
      }

    } catch (err) {
      list.innerHTML = `<div class="text-danger small text-center py-4">데이터 로드 실패: ${err.message}</div>`;
    }
  };

  window.renderFinanceLogs = function(logs) {
    const container = document.getElementById('financeLogsList');
    if (!logs || logs.length === 0) {
      container.innerHTML = `<div class="text-secondary small text-center py-4">조회된 입출금 내역이 없습니다.</div>`;
      return;
    }

    container.innerHTML = logs.map(l => {
      const isInc = (l.type === '입금');
      const badgeBg = isInc ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
      const badgeColor = isInc ? '#10b981' : '#ef4444';
      const sign = isInc ? '+' : '-';
      const noteStr = l.note ? `<span class="text-muted ms-1">(${escapeHtmlText(l.note)})</span>` : '';

      return `
        <div class="finance-log-item" onclick="window.openEditFinanceModal(${l.id})" title="클릭하여 수정 또는 삭제">
          <div style="min-width: 0; flex: 1; padding-right: 8px;">
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="badge" style="background: ${badgeBg}; color: ${badgeColor}; font-size: 0.68rem; padding: 2px 6px;">${escapeHtmlText(l.type)}</span>
              <span class="small fw-bold text-truncate" style="color: var(--drawer-item-text);">${escapeHtmlText(l.reason || '사유 없음')}</span>
            </div>
            <div class="text-muted" style="font-size: 0.68rem;">
              ${escapeHtmlText(l.date)} ${noteStr}
            </div>
          </div>
          <div class="text-end fw-black" style="font-size: 0.88rem; color: ${badgeColor}; white-space: nowrap;">
            ${sign}${Number(l.amount || 0).toLocaleString()} 다이아
          </div>
        </div>
      `;
    }).join('');
  };

  window.openEditFinanceModal = function(id) {
    const item = (window.lastFinanceData.logs || []).find(l => l.id === id);
    if (!item) return;

    document.getElementById('modalEditId').value = item.id;
    document.getElementById('modalEditDate').value = item.date || '';
    document.getElementById('modalEditType').value = item.type || '입금';
    document.getElementById('modalEditAmount').value = Number(item.amount || 0).toLocaleString();
    document.getElementById('modalEditCategory').value = item.reason || '';
    document.getElementById('modalEditReason').value = item.note || '';

    document.getElementById('financeEditModal').style.display = 'flex';
  };

  window.closeEditFinanceModal = function() {
    document.getElementById('financeEditModal').style.display = 'none';
  };

  window.updateFinanceRecord = async function() {
    const id = document.getElementById('modalEditId').value;
    const date = document.getElementById('modalEditDate').value;
    const type = document.getElementById('modalEditType').value;
    const amount = window.parseCommaNumber(document.getElementById('modalEditAmount').value);
    const reason = document.getElementById('modalEditCategory').value.trim();
    const note = document.getElementById('modalEditReason').value.trim();

    if (!date) return showKakaoToast("일자를 선택해주세요.", "⚠️");
    if (amount <= 0) return showKakaoToast("유효한 금액을 입력해주세요.", "⚠️");

    try {
      await apiRequest(`guild_finances?id=eq.${id}`, "PATCH", {
        date: date,
        type: type,
        amount: amount,
        reason: reason,
        note: note
      });
      showKakaoToast("내역이 수정되었습니다.", "✏️");
      window.closeEditFinanceModal();
      await window.loadFinanceData();
    } catch (err) {
      showKakaoToast("수정 실패: " + err.message, "❌");
    }
  };

  window.deleteFinanceRecord = async function() {
    if (!confirm("정말로 이 내역을 삭제하시겠습니까?")) return;
    const id = document.getElementById('modalEditId').value;

    try {
      await apiRequest(`guild_finances?id=eq.${id}`, "DELETE");
      showKakaoToast("내역이 삭제되었습니다.", "🗑️");
      window.closeEditFinanceModal();
      await window.loadFinanceData();
    } catch (err) {
      showKakaoToast("삭제 실패: " + err.message, "❌");
    }
  };

  window.calculateIncomeDiff = function() {
    const amt = window.parseCommaNumber(document.getElementById('incomeAmount').value);
    const hint = document.getElementById('incomeDiffHint');
    if (amt > 0) {
      hint.innerText = `현재 금고 잔액에서 +${amt.toLocaleString()} 다이아 증가합니다.`;
      hint.className = "text-success mt-1";
    } else {
      hint.innerText = `현재 금고 잔액에 더해집니다.`;
      hint.className = "text-muted mt-1";
    }
  };

  window.submitIncomeRecord = async function() {
    const date = document.getElementById('incomeDate').value;
    const amount = window.parseCommaNumber(document.getElementById('incomeAmount').value);
    const reason = document.getElementById('incomeReason').value.trim() || "수익금 입금";
    const note = document.getElementById('incomeNote').value.trim();

    if (!date) return showKakaoToast("입금 일자를 선택해주세요.", "⚠️");
    if (amount <= 0) return showKakaoToast("유효한 입금 금액을 입력해주세요.", "⚠️");

    try {
      await apiRequest("guild_finances", "POST", [{
        date: date,
        type: "입금",
        amount: amount,
        reason: reason,
        note: note
      }]);
      showKakaoToast(`+${amount.toLocaleString()} 다이아 입금 완료!`, "🎉");
      document.getElementById('incomeAmount').value = '';
      document.getElementById('incomeReason').value = '';
      document.getElementById('incomeNote').value = '';
      await window.loadFinanceData();
    } catch (err) {
      showKakaoToast("입금 처리 실패: " + err.message, "❌");
    }
  };

  window.submitExpenseRecord = async function() {
    const date = document.getElementById('expenseDate').value;
    const amount = window.parseCommaNumber(document.getElementById('expenseAmount').value);
    const reason = document.getElementById('expenseReason').value.trim() || "길드 지출";
    const note = document.getElementById('expenseNote').value.trim();

    if (!date) return showKakaoToast("지출 일자를 선택해주세요.", "⚠️");
    if (amount <= 0) return showKakaoToast("유효한 지출 금액을 입력해주세요.", "⚠️");

    const currentBal = window.lastFinanceData.currentBalance || 0;
    if (amount > currentBal) {
      if (!confirm("현재 금고 잔액보다 지출 금액이 큽니다. 계속 진행하시겠습니까?")) return;
    }

    try {
      await apiRequest("guild_finances", "POST", [{
        date: date,
        type: "지출",
        amount: amount,
        reason: reason,
        note: note
      });
      showKakaoToast(`-${amount.toLocaleString()} 다이아 지출 처리 완료!`, "💸");
      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseReason').value = '';
      document.getElementById('expenseNote').value = '';
      await window.loadFinanceData();
    } catch (err) {
      showKakaoToast("지출 처리 실패: " + err.message, "❌");
    }
  };

  window.copyFinanceReportForKakao = function() {
    const start = document.getElementById('financeStartDate').value || '시작';
    const end = document.getElementById('financeEndDate').value || '현재';
    const incomeLogs = (window.lastFinanceData.logs || []).filter(l => l.inFilter && l.type === '입금');
    const expenseLogs = (window.lastFinanceData.logs || []).filter(l => l.inFilter && l.type === '지출');

    const totalInc = incomeLogs.reduce((acc, l) => acc + Number(l.amount || 0), 0);
    const totalExp = expenseLogs.reduce((acc, l) => acc + Number(l.amount || 0), 0);
    const netProfit = totalInc - totalExp;

    const guildName = "불편한사람들";

    const reportHtml = `
      <div class="finance-report-card">
        <div class="fin-card-header">
          <div class="fin-card-title">
            <i class="fa-solid fa-landmark text-warning"></i>
            <span class="text-truncate">길드금고 결산 보고서</span>
          </div>
          <span class="fin-date-badge">${start} ~ ${end}</span>
        </div>

        <div class="fin-vault-hero">
          <div>
            <div class="fin-vault-label">현재 금고 총 잔액</div>
            <div class="fin-vault-val">${(window.lastFinanceData.currentBalance || 0).toLocaleString()} 다이아</div>
          </div>
          <div style="font-size: 1.5rem;">🏛️</div>
        </div>

        <div class="fin-period-box">
          <div class="d-flex justify-content-between mb-1">
            <span class="text-muted">기간 총 수입:</span>
            <strong class="text-success">+${totalInc.toLocaleString()} 다이아</strong>
          </div>
          <div class="d-flex justify-content-between mb-1">
            <span class="text-muted">기간 총 지출:</span>
            <strong class="text-danger">-${totalExp.toLocaleString()} 다이아</strong>
          </div>
          <div class="d-flex justify-content-between pt-1 border-top border-secondary border-opacity-25">
            <span class="fw-bold text-dark">기간 순수익:</span>
            <strong class="fw-bold ${netProfit >= 0 ? 'text-primary' : 'text-danger'}">${netProfit >= 0 ? '+' : ''}${netProfit.toLocaleString()} 다이아</strong>
          </div>
        </div>

        <div class="text-muted text-center" style="font-size: 10px;">
          조회 내역 총 ${(incomeLogs.length + expenseLogs.length)}건 결산 완료
        </div>
      </div>
    `;

    (async () => {
      try {
        await apiRequest("guild_chats", "POST", [{
          sender_name: "금고알리미",
          message: reportHtml,
          msg_type: "finance_report",
          mentions: []
        }]);
        showKakaoToast("대화방에 길드금고 현황이 공유되었습니다!", "🏛️");
        if (typeof window.closeModuleOverlay === 'function') window.closeModuleOverlay();
      } catch (err) {
        showKakaoToast("공유 실패: " + err.message, "❌");
      }
    })();
  };

  (async function initFinanceModule() {
    window.setFinanceQuickRange('thisWeek');
  })();
</script>
