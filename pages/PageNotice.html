<script>
  // ⚡ 재호출 시 식별자 충돌 방지: 모든 최상위 변수 var 선언
  var rawNoticesList = [];
  var activeNoticeFilterCat = 'all';
  var canUserWriteNotice = false;
  var currentPinnedNoticeItem = null;

  function getNoticeCurrentGuildId() {
    if (typeof getCurrentGuildId === "function") {
      return getCurrentGuildId();
    }
    var gid = localStorage.getItem("current_guild_id");
    return (gid && gid !== "null" && gid !== "undefined") ? gid : "default";
  }

  // 🎯 초기화 진입점
  async function initNoticeModule() {
    if (typeof window.applyAppTheme === 'function') {
      window.applyAppTheme();
    }

    // 1. 설정창 권한 정책 동기화 확인
    await syncNoticePermissions();

    // 2. 공지사항 데이터 로드
    await loadNoticesFeedData();
  }

  // 🔒 설정창 권한(perm_notice_write) 및 관리자 역할 검증 (길드 격리 적용)
  async function syncNoticePermissions() {
    var adminRole = sessionStorage.getItem("admin_role") || "";
    var myRole = localStorage.getItem("guild_my_role") || "일반";
    var isSuper = (adminRole === "super");
    var isAdmin = isSuper || (adminRole === "admin") || (myRole === "길드장" || myRole === "길마" || myRole === "부길드장" || myRole === "부길마");

    if (isSuper) {
      canUserWriteNotice = true;
    } else if (isAdmin) {
      var curGid = getNoticeCurrentGuildId();
      var permVal = (window.currentSettingsMap && window.currentSettingsMap['perm_notice_write'] !== undefined)
        ? window.currentSettingsMap['perm_notice_write']
        : null;

      if (permVal === null) {
        try {
          // ⚡ [길드 격리]: 현재 접속 중인 길드의 공지 작성 권한 설정만 조회
          var rows = await apiRequest("guild_settings?guild_id=eq." + encodeURIComponent(curGid) + "&key=eq.perm_notice_write");
          if (rows && rows.length > 0) {
            permVal = rows[0].value;
            if (!window.currentSettingsMap) window.currentSettingsMap = {};
            window.currentSettingsMap['perm_notice_write'] = permVal;
          }
        } catch (e) {}
      }
      canUserWriteNotice = (permVal === null || permVal === 'true' || permVal === true);
    } else {
      canUserWriteNotice = false;
    }

    // UI에 작성 버튼 노출 여부 반영
    var btnToggle = document.getElementById('btnToggleNoticeForm');
    if (btnToggle) {
      btnToggle.style.display = canUserWriteNotice ? 'inline-flex' : 'none';
    }
  }

  // 📂 커튼형 작성 폼 열기/닫기 토글
  function toggleNoticeFormCard(forceState, isEditMode) {
    var card = document.getElementById('noticeFormCard');
    var btn = document.getElementById('btnToggleNoticeForm');
    var txt = document.getElementById('txtToggleNoticeBtn');
    var formTitle = document.getElementById('noticeFormTitle');
    var submitBtn = document.getElementById('btnSaveNoticeSubmit');
    if (!card) return;

    var isOpening = (forceState !== undefined) ? forceState : (card.style.display === 'none' || !card.style.display);

    if (isOpening) {
      card.style.display = 'block';
      if (btn) btn.classList.add('active');
      if (txt) txt.innerText = '▲ 작성창 닫기';

      if (!isEditMode) {
        // 새 공지 모드 리셋
        document.getElementById('noticeEditId').value = "";
        document.getElementById('inputNoticeTitle').value = "";
        document.getElementById('inputNoticeContent').value = "";
        document.getElementById('noticeCategorySelect').value = "일반";
        document.getElementById('noticeIsPinned').checked = false;
        if (formTitle) formTitle.innerHTML = '<i class="fa-solid fa-pen-nib me-1"></i>새 공지사항 등록';
        if (submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i>공지 등록 확정';
      }

      setTimeout(function() {
        var input = document.getElementById('inputNoticeTitle');
        if (input) input.focus();
      }, 100);
    } else {
      card.style.display = 'none';
      if (btn) btn.classList.remove('active');
      if (txt) txt.innerText = '새 공지 작성';
    }
  }

  // 📊 공지사항 목록 로드 (길드 격리 적용)
  async function loadNoticesFeedData() {
    var container = document.getElementById('noticeFeedContainer');
    if (container) {
      container.innerHTML = '<div class="text-secondary small text-center py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>공지사항을 불러오는 중...</div>';
    }

    try {
      var curGid = getNoticeCurrentGuildId();
      // ⚡ [길드 격리]: 현재 길드 공지만 조회
      var list = await apiRequest("guild_notices?guild_id=eq." + encodeURIComponent(curGid) + "&select=*&order=id.desc");
      rawNoticesList = list || [];

      // 총 건수 배지
      var countBadge = document.getElementById('noticeTotalCountBadge');
      if (countBadge) countBadge.innerText = rawNoticesList.length + "건";

      // 최상단 고정 공지 추출 (is_pinned === true 인 것 중 최신, 없으면 null)
      currentPinnedNoticeItem = rawNoticesList.find(function(n) {
        return (n.is_pinned === true || n.is_pinned === 'true' || (n.category === '중요' && !n.is_pinned));
      }) || (rawNoticesList.length > 0 ? rawNoticesList[0] : null);

      renderPinnedHeroCard();
      renderNoticesFeed();
    } catch (err) {
      if (container) {
        container.innerHTML = '<div class="text-danger small text-center py-5"><i class="fa-solid fa-circle-exclamation me-1"></i>공지 조회 실패: ' + escapeHtmlNotice(err.message) + '</div>';
      }
    }
  }

  // 📌 고정 공지 배너 렌더링
  function renderPinnedHeroCard() {
    var heroBox = document.getElementById('noticePinnedHero');
    if (!heroBox) return;

    if (!currentPinnedNoticeItem) {
      heroBox.style.display = 'none';
      return;
    }

    heroBox.style.display = 'block';
    var dateStr = (currentPinnedNoticeItem.created_at || '').slice(0, 10);
    var dateElem = document.getElementById('pinnedNoticeDateText');
    var titleElem = document.getElementById('pinnedNoticeTitleText');
    var previewElem = document.getElementById('pinnedNoticeContentPreview');

    if (dateElem) dateElem.innerText = dateStr;
    if (titleElem) titleElem.innerText = currentPinnedNoticeItem.title || '제목 없음';
    if (previewElem) previewElem.innerText = (currentPinnedNoticeItem.content || '').replace(/\n/g, ' ');
  }

  function openPinnedNoticeDetail() {
    if (!currentPinnedNoticeItem) return;
    toggleNoticeAccordion(currentPinnedNoticeItem.id, true);
  }

  // 🏷️ 카테고리 필터 변경
  function setNoticeFilterCategory(cat) {
    activeNoticeFilterCat = cat;
    document.querySelectorAll('.btn-notice-cat-filter').forEach(function(b) {
      b.classList.remove('active');
      if ((cat === 'all' && b.innerText.includes('전체')) || b.innerText.includes(cat)) {
        b.classList.add('active');
      }
    });
    renderNoticesFeed();
  }

  function filterNoticesFeed() {
    renderNoticesFeed();
  }

  // 📋 공지 피드 렌더링
  function renderNoticesFeed() {
    var container = document.getElementById('noticeFeedContainer');
    if (!container) return;

    var q = document.getElementById('noticeSearchInput') ? document.getElementById('noticeSearchInput').value.trim().toLowerCase() : '';

    var filtered = rawNoticesList.filter(function(n) {
      // 카테고리 필터
      var cat = n.category || parseNoticeCatFromTitle(n.title);
      if (activeNoticeFilterCat !== 'all' && cat !== activeNoticeFilterCat) {
        return false;
      }
      // 검색어 필터
      if (!q) return true;
      var text = ((n.title || '') + ' ' + (n.content || '') + ' ' + (n.author || '')).toLowerCase();
      return text.includes(q);
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-5"><i class="fa-regular fa-folder-open me-2"></i>해당 조건의 공지사항이 없습니다.</div>';
      return;
    }

    container.innerHTML = filtered.map(function(n) {
      var cat = n.category || parseNoticeCatFromTitle(n.title);
      var badgeCls = getNoticeCatBadgeClass(cat);
      var cleanTitle = (n.title || '제목 없음').replace(/^\[[^\]]+\]\s*/, '');
      var dateStr = (n.created_at || '').slice(0, 10);
      var authorStr = n.author ? (' • ' + escapeHtmlNotice(n.author)) : '';
      var pinIcon = (n.is_pinned === true || n.is_pinned === 'true') ? '<i class="fa-solid fa-thumbtack text-warning me-1" title="상단 고정 공지"></i>' : '';

      // 관리 액션 버튼 (권한자 전용)
      var adminActions = '';
      if (canUserWriteNotice) {
        adminActions = '<button type="button" class="btn-notice-act" onclick="startEditNotice(' + n.id + ')"><i class="fa-solid fa-pen-to-square"></i>수정</button>' +
                       '<button type="button" class="btn-notice-act text-danger" onclick="executeDeleteNotice(' + n.id + ')"><i class="fa-solid fa-trash-can"></i>삭제</button>';
      }

      return '<div class="notice-item-card" id="noticeCard_' + n.id + '">' +
        '<div class="notice-header-row" onclick="toggleNoticeAccordion(' + n.id + ')">' +
          '<div style="min-width: 0; flex: 1; padding-right: 8px;">' +
            '<div class="d-flex align-items-center gap-1 mb-1 flex-wrap">' +
              '<span class="badge-notice-cat ' + badgeCls + '">' + escapeHtmlNotice(cat) + '</span>' +
              pinIcon +
              '<span class="notice-title-text">' + escapeHtmlNotice(cleanTitle) + '</span>' +
            '</div>' +
            '<div class="notice-meta-text">' +
              escapeHtmlNotice(dateStr) + authorStr +
            '</div>' +
          '</div>' +
          '<i class="fa-solid fa-chevron-down text-secondary" id="noticeChevron_' + n.id + '" style="font-size: 0.72rem; transition: transform 0.2s ease;"></i>' +
        '</div>' +

        '<div class="notice-body-content" id="noticeBody_' + n.id + '">' +
          '<div>' + escapeHtmlNotice(n.content || '') + '</div>' +
          '<div class="notice-action-bar">' +
            '<button type="button" class="btn-notice-act btn-notice-share" onclick="shareNoticeToChat(' + n.id + ')">' +
              '<i class="fa-solid fa-comment-dots"></i>대화방 공유' +
            '</button>' +
            adminActions +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // 🎯 아코디언 본문 펼침/접힘
  function toggleNoticeAccordion(id, forceOpen) {
    var body = document.getElementById('noticeBody_' + id);
    var chevron = document.getElementById('noticeChevron_' + id);
    if (!body) return;

    var isOpen = (body.style.display === 'block');
    var shouldOpen = (forceOpen !== undefined) ? forceOpen : !isOpen;

    if (shouldOpen) {
      body.style.display = 'block';
      if (chevron) chevron.style.transform = 'rotate(180deg)';
      var card = document.getElementById('noticeCard_' + id);
      if (card && forceOpen) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      body.style.display = 'none';
      if (chevron) chevron.style.transform = 'rotate(0deg)';
    }
  }

  // ✏️ 공지 수정 시작 (커튼 폼으로 로드)
  function startEditNotice(id) {
    var item = rawNoticesList.find(function(n) { return n.id === id; });
    if (!item) return;

    toggleNoticeFormCard(true, true);

    document.getElementById('noticeEditId').value = item.id;
    var cleanTitle = (item.title || '').replace(/^\[[^\]]+\]\s*/, '');
    document.getElementById('inputNoticeTitle').value = cleanTitle;
    document.getElementById('inputNoticeContent').value = item.content || '';
    document.getElementById('noticeCategorySelect').value = item.category || parseNoticeCatFromTitle(item.title);
    document.getElementById('noticeIsPinned').checked = (item.is_pinned === true || item.is_pinned === 'true');

    var formTitle = document.getElementById('noticeFormTitle');
    var submitBtn = document.getElementById('btnSaveNoticeSubmit');
    if (formTitle) formTitle.innerHTML = '<i class="fa-solid fa-pen-to-square me-1 text-warning"></i>공지사항 수정';
    if (submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i>수정 내용 저장';

    var card = document.getElementById('noticeFormCard');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 💾 공지 저장 (등록 및 수정 - 길드 격리 적용)
  async function executeSaveNotice() {
    if (!canUserWriteNotice) {
      return alert("공지사항 작성 권한이 없습니다.");
    }

    var editId = document.getElementById('noticeEditId').value;
    var cat = document.getElementById('noticeCategorySelect').value || '일반';
    var isPinned = document.getElementById('noticeIsPinned').checked;
    var titleRaw = document.getElementById('inputNoticeTitle').value.trim();
    var contentRaw = document.getElementById('inputNoticeContent').value.trim();

    if (!titleRaw) {
      return alert("공지사항 제목을 입력하세요.");
    }
    if (!contentRaw) {
      return alert("공지사항 내용을 입력하세요.");
    }

    // 제목에 [태그] 규격 자동 부착
    var fullTitle = '[' + cat + '] ' + titleRaw;
    var authorNick = localStorage.getItem("guild_my_nickname") || "관리자";
    var curGid = getNoticeCurrentGuildId();

    var submitBtn = document.getElementById('btnSaveNoticeSubmit');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>저장 중...';
    }

    try {
      if (editId) {
        // ⚡ [길드 격리]: 내 길드의 공지만 수정 (PATCH)
        try {
          await apiRequest("guild_notices?id=eq." + editId + "&guild_id=eq." + encodeURIComponent(curGid), "PATCH", {
            title: fullTitle,
            content: contentRaw,
            category: cat,
            author: authorNick,
            is_pinned: isPinned
          });
        } catch (colErr) {
          await apiRequest("guild_notices?id=eq." + editId + "&guild_id=eq." + encodeURIComponent(curGid), "PATCH", {
            title: fullTitle,
            content: contentRaw
          });
        }
        showToastNoticeMsg("공지사항이 성공적으로 수정되었습니다!", "✏️");
      } else {
        // ⚡ [길드 격리]: 내 길드 ID를 포함하여 새 공지 등록 (POST)
        try {
          await apiRequest("guild_notices", "POST", [{
            guild_id: curGid,
            title: fullTitle,
            content: contentRaw,
            category: cat,
            author: authorNick,
            is_pinned: isPinned,
            created_at: new Date().toISOString()
          }]);
        } catch (colErr) {
          await apiRequest("guild_notices", "POST", [{
            guild_id: curGid,
            title: fullTitle,
            content: contentRaw,
            created_at: new Date().toISOString()
          }]);
        }
        showToastNoticeMsg("새 공지사항이 성공적으로 등록되었습니다!", "📢");
      }

      // 입력폼 닫기 및 피드 새로고침
      toggleNoticeFormCard(false);
      await loadNoticesFeedData();

      // 홈 화면 상단 배너 동기화
      if (typeof window.loadTopNoticeHeader === 'function') {
        window.loadTopNoticeHeader();
      }
    } catch (e) {
      alert("공지 저장 실패: " + e.message);
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i>공지 등록 확정';
      }
    }
  }

  // 🗑️ 공지 삭제 (길드 격리 적용)
  async function executeDeleteNotice(id) {
    if (!canUserWriteNotice) {
      return alert("공지사항 삭제 권한이 없습니다.");
    }

    if (!confirm("이 공지사항을 정말 삭제하시겠습니까?")) return;

    try {
      var curGid = getNoticeCurrentGuildId();
      // ⚡ [길드 격리]: 내 길드의 공지만 삭제
      await apiRequest("guild_notices?id=eq." + id + "&guild_id=eq." + encodeURIComponent(curGid), "DELETE");
      showToastNoticeMsg("공지사항이 삭제되었습니다.", "🗑️");
      await loadNoticesFeedData();

      // 홈 화면 상단 배너 동기화
      if (typeof window.loadTopNoticeHeader === 'function') {
        window.loadTopNoticeHeader();
      }
    } catch (e) {
      alert("공지 삭제 실패: " + e.message);
    }
  }

  // 💬 카카오톡 말풍선 최적화 대화방 공유 (길드 격리 및 대화방 주소 보강)
  async function shareNoticeToChat(id) {
    var item = rawNoticesList.find(function(n) { return n.id === id; });
    if (!item) return;

    var cat = item.category || parseNoticeCatFromTitle(item.title);
    var cleanTitle = (item.title || '공지사항').replace(/^\[[^\]]+\]\s*/, '');
    var authorStr = item.author || '길드 관리자';
    var dateStr = (item.created_at || '').slice(0, 10);
    var curGid = getNoticeCurrentGuildId();
    var activeRoom = window.currentActiveRoomId || "default_public";

    // 💬 카카오톡 말풍선 최적화 텍스트 포맷 (줄바꿈 서식 지원)
    var chatMsg = '📢 [' + cat + ' 공지] ' + cleanTitle + '\n' +
      '📅 ' + dateStr + ' • 작성자: ' + authorStr + '\n' +
      '──────────────────\n' +
      (item.content || '');

    try {
      // ⚡ [길드 격리]: 현재 길드(guild_id)와 현재 대화방(room_id)으로 전송
      await apiRequest("guild_chats", "POST", [{
        guild_id: curGid,
        room_id: activeRoom,
        sender_name: "공지알리미",
        message: chatMsg,
        msg_type: "chat",
        mentions: []
      }]);

      showToastNoticeMsg("공지사항이 대화방에 공유되었습니다!", "📢");
      if (typeof window.closeModuleOverlay === 'function') {
        window.closeModuleOverlay();
      }
    } catch (e) {
      alert("대화방 공유 실패: " + e.message);
    }
  }

  // 헬퍼: 태그 자동 파싱
  function parseNoticeCatFromTitle(title) {
    if (!title) return "일반";
    var m = title.match(/^\[([^\]]+)\]/);
    if (m && m[1]) return m[1];
    return "일반";
  }

  function getNoticeCatBadgeClass(cat) {
    if (cat === '중요') return 'cat-important';
    if (cat === '보스토벌') return 'cat-boss';
    if (cat === '길드규칙') return 'cat-rule';
    if (cat === '금고분배') return 'cat-finance';
    return 'cat-general';
  }

  function showToastNoticeMsg(msg, icon) {
    if (typeof showKakaoToast === 'function') {
      showKakaoToast(msg, icon || "✅");
    } else {
      alert(msg);
    }
  }

  function escapeHtmlNotice(t) {
    return (t || '').replace(/[&<>"']/g, function(m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m];
    });
  }

  // 🚀 자동 기동
  (function initNotc() {
    initNoticeModule();
  })();
</script>
