<!-- ==========================================
     [ECLIPSE 길드관리] 보스참여 등록 모듈
     경로: pages/PageRegister.html
     ========================================== -->
<style>
  :root {
    --reg-card-bg: #181d24;
    --reg-card-border: #282f3a;
    --reg-text-main: #f3f4f6;
    --reg-text-sub: #9ca3af;
    --reg-section-bg: #1e2530;
    --reg-section-border: #2c3545;
    --reg-input-bg: #141922;
    --reg-input-border: #2c3545;
    --reg-input-text: #ffffff;
    --reg-member-bg: #0d1527;
    --reg-member-border: #1e293b;
    --reg-member-text: #f1f5f9;
    --reg-yellow: #fee500;
  }

  /* ☀️ 라이트 모드 스타일 자동 전환 */
  html.theme-light .register-card,
  body.theme-light .register-card,
  .register-card.light-mode {
    --reg-card-bg: #ffffff;
    --reg-card-border: #e2e8f0;
    --reg-text-main: #191919;
    --reg-text-sub: #64748b;
    --reg-section-bg: #f8fafc;
    --reg-section-border: #e2e8f0;
    --reg-input-bg: #ffffff;
    --reg-input-border: #cbd5e1;
    --reg-input-text: #0f172a;
    --reg-member-bg: #ffffff;
    --reg-member-border: #e2e8f0;
    --reg-member-text: #1e293b;
    --reg-yellow: #fee500;
  }

  .register-card {
    background: var(--reg-card-bg);
    border: 1px solid var(--reg-card-border);
    border-radius: 14px;
    padding: 10px 12px;
    color: var(--reg-text-main);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    letter-spacing: -0.2px;
  }

  .reg-section-box {
    background: var(--reg-section-bg);
    border: 1px solid var(--reg-section-border);
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 6px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .reg-section-title {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--reg-text-main);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
  }

  .reg-input-custom {
    background-color: var(--reg-input-bg) !important;
    border: 1px solid var(--reg-input-border) !important;
    color: var(--reg-input-text) !important;
    border-radius: 6px !important;
    padding: 4px 8px !important;
    font-size: 0.76rem !important;
    height: 30px;
    outline: none !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .reg-input-custom:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important;
  }

  /* 💛 카카오톡 감성 액션 버튼 */
  .btn-kakao-yellow {
    background-color: #fee500 !important;
    color: #191919 !important;
    border: none !important;
    font-weight: 800 !important;
    border-radius: 9px !important;
    transition: all 0.15s ease-in-out !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    cursor: pointer !important;
  }
  .btn-kakao-yellow:hover:not(:disabled) {
    background-color: #fada0a !important;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(254, 229, 0, 0.35) !important;
  }
  .btn-kakao-yellow:active:not(:disabled) {
    transform: translateY(0);
  }
  .btn-kakao-yellow:disabled {
    background-color: #94a3b8 !important;
    color: #ffffff !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
  }

  /* 1. 상단 토벌현장기록 고대비 선명 뱃지 */
  .reg-status-badge {
    background: #0f172a !important;
    border: 1px solid #38bdf8 !important;
    color: #38bdf8 !important;
    font-size: 0.68rem !important;
    font-weight: 700 !important;
    padding: 3px 8px !important;
    border-radius: 6px !important;
    letter-spacing: -0.2px;
  }
  body.theme-light .reg-status-badge,
  html.theme-light .reg-status-badge {
    background: #e0f2fe !important;
    border-color: #0284c7 !important;
    color: #0369a1 !important;
  }

  /* ========================================================
     API OCR 및 이미지 등록 박스 (초슬림 컴팩트)
     ======================================================== */
  .ocr-compact-dropzone {
    border: 1.5px dashed rgba(168, 85, 247, 0.4);
    border-radius: 8px;
    padding: 7px 10px;
    text-align: center;
    background: rgba(0, 0, 0, 0.12);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .ocr-compact-dropzone:hover {
    border-color: #a855f7;
    background: rgba(168, 85, 247, 0.08);
  }

  .ocr-registered-card {
    border: 1.5px dashed #6366f1;
    border-radius: 10px;
    padding: 6px 10px;
    background: #0d1222;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ocr-img-thumb {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    object-fit: cover;
    border: 1.5px solid #334155;
    flex-shrink: 0;
  }
  .btn-ocr-analyze {
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    color: #ffffff;
    border: none;
    font-weight: 800;
    font-size: 0.74rem;
    padding: 5px 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(168, 85, 247, 0.35);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .btn-ocr-analyze:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .btn-ocr-reupload {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.4);
    font-weight: 700;
    font-size: 0.72rem;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: all 0.15s ease;
  }
  .btn-ocr-reupload:hover {
    background: rgba(239, 68, 68, 0.22);
  }

  /* ========================================================
     전쟁 구분 축소 버튼 [일반] [내전] [인터]
     ======================================================== */
  .war-badge-group {
    display: inline-flex;
    gap: 4px;
  }
  .war-badge-btn {
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--reg-section-border);
    background: var(--reg-input-bg);
    color: var(--reg-text-sub);
    font-size: 0.72rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    white-space: nowrap;
    line-height: 1.2;
  }
  .war-badge-btn.active.normal {
    background: rgba(56, 189, 248, 0.25);
    border-color: #38bdf8;
    color: #38bdf8;
  }
  .war-badge-btn.active.internal {
    background: rgba(245, 158, 11, 0.25);
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .war-badge-btn.active.inter {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    color: #ff6b6b;
  }

  /* 1인당 배점 안내 고대비 가독성 뱃지 */
  .score-info-badge {
    background: #0f172a;
    border: 1px solid #eab308;
    color: #f8fafc;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  body.theme-light .score-info-badge,
  html.theme-light .score-info-badge {
    background: #fefce8;
    border-color: #ca8a04;
    color: #1e293b;
  }

  /* ========================================================
     길드원 선택 버튼 그리드 (모바일 반응형 & 글자 잘림 완전 방지)
     ======================================================== */
  .member-grid-box-wrap {
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 6px 4px;
    background: #090e1c;
    max-height: 340px;
    overflow-y: auto;
  }
  body.theme-light .member-grid-box-wrap,
  html.theme-light .member-grid-box-wrap {
    background: #f8fafc;
    border-color: #cbd5e1;
  }

  /* 5열 모바일 반응형 그리드 */
  .member-grid-5col {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
  }

  .btn-member-cell {
    background: var(--reg-member-bg);
    border: 1px solid var(--reg-member-border);
    border-radius: 6px;
    padding: 5px 1px;
    color: var(--reg-member-text);
    font-size: 0.67rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    cursor: pointer;
    text-align: center;
    white-space: normal;
    word-break: break-all;
    line-height: 1.15;
    transition: all 0.12s ease;
    user-select: none;
    min-height: 33px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-member-cell:hover {
    border-color: #38bdf8;
    transform: translateY(-1px);
  }
  .btn-member-cell.master {
    color: #f87171 !important;
  }
  .btn-member-cell.selected {
    background: #1d4ed8 !important;
    border-color: #60a5fa !important;
    color: #ffffff !important;
    box-shadow: 0 0 6px rgba(59, 130, 246, 0.4) !important;
  }
  body.theme-light .btn-member-cell.selected {
    background: #0284c7 !important;
    border-color: #0284c7 !important;
    color: #ffffff !important;
  }

  /* 초소형 모바일 기기 대응 */
  @media (max-width: 350px) {
    .btn-member-cell {
      font-size: 0.61rem;
      letter-spacing: -0.7px;
      padding: 4px 1px;
      min-height: 30px;
    }
  }

  .btn-grid-tool {
    background: #111827;
    border: 1px solid #374151;
    color: #cbd5e1;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-grid-tool:hover {
    background: #1f2937;
    color: #ffffff;
    border-color: #4b5563;
  }
  body.theme-light .btn-grid-tool {
    background: #ffffff;
    border-color: #cbd5e1;
    color: #334155;
  }
  body.theme-light .btn-grid-tool:hover {
    background: #f1f5f9;
  }
</style>

<div class="register-card mb-4" id="registerRootCard">
  <!-- 상단 헤더: 제목 + 고대비 토벌 현장 기록 뱃지 -->
  <div class="d-flex align-items-center justify-content-between mb-2 gap-2 flex-wrap">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.1rem;">⚔️</span>
      <div>
        <h6 class="fw-bold mb-0" style="font-size: 0.88rem;">보스참여 등록</h6>
        <span class="small text-secondary" style="font-size: 0.65rem;">스크린샷 자동인식 및 토벌 결과 대화방 즉시 공유</span>
      </div>
    </div>
    <span class="badge reg-status-badge">
      ⚔️ 토벌 현장 기록
    </span>
  </div>

  <!-- ========================================================
       1. 스크린샷 AI 자동인식 (축소 및 2번 스크린샷 가로형 바)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <div class="reg-section-title mb-0">
        <i class="fa-solid fa-camera text-warning"></i>
        <span>스크린샷 AI 인식</span>
      </div>
      <span id="regGeminiKeyBadge" class="badge bg-secondary bg-opacity-25 text-secondary border border-secondary border-opacity-50" style="font-size: 0.58rem; padding: 2px 5px;">
        키 확인 중
      </span>
    </div>

    <!-- 숨겨진 파일 인풋 -->
    <input type="file" id="ocrFileInput" accept="image/*" style="display: none;" onchange="handleImageFileSelected(this.files[0])">

    <!-- 1) 업로드 전: 컴팩트 드롭존 -->
    <div class="ocr-compact-dropzone" id="ocrDropArea" onclick="document.getElementById('ocrFileInput').click()">
      <i class="fa-solid fa-cloud-arrow-up text-primary" style="font-size: 1rem;"></i>
      <span class="text-white" style="font-size: 0.74rem; font-weight: 700;">클릭하여 스크린샷 업로드 또는 붙여넣기 (Ctrl+V)</span>
    </div>

    <!-- 2) 업로드 후 (2번 스크린샷 가로형 배치) -->
    <div class="ocr-registered-card" id="ocrRegisteredCard">
      <div class="d-flex align-items-center gap-2" style="min-width: 0; flex: 1;">
        <img id="ocrThumbImg" class="ocr-img-thumb" src="" alt="썸네일">
        <div style="min-width: 0; flex: 1;">
          <div id="ocrFileName" class="fw-bold text-truncate" style="font-size: 0.78rem; color: #c084fc;">스크린샷.png</div>
          <div class="text-secondary" style="font-size: 0.65rem;">준비 완료 (분석 시작 버튼 클릭)</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <button type="button" class="btn-ocr-analyze" id="btnRunAiOcr" onclick="executeGeminiOcrAnalysis()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 분석 시작
        </button>
        <button type="button" class="btn-ocr-reupload" onclick="triggerReupload()" title="다른 이미지로 교체">
          <i class="fa-solid fa-rotate"></i> 재업로드
        </button>
      </div>
    </div>

    <div id="ocrStatusMsg" class="mt-1 text-center small text-secondary" style="font-size: 0.68rem; display: none;"></div>
  </div>

  <!-- ========================================================
       2. 토벌 정보 입력창 (전체적으로 축소 & [일반][내전][인터] 초소형화)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="row g-1 mb-1">
      <!-- 컬럼 1: 토벌 일시 (KST) -->
      <div class="col-6">
        <label class="small text-secondary mb-0" style="font-size: 0.65rem;">토벌 일시 (KST)</label>
        <input type="datetime-local" id="regRaidDateTime" class="form-control reg-input-custom w-100">
      </div>

      <!-- 컬럼 2: 보스 선택 -->
      <div class="col-6">
        <label class="small text-secondary mb-0" style="font-size: 0.65rem;">보스 선택</label>
        <select id="regBossSelect" class="form-select reg-input-custom w-100" onchange="onBossSelectChange(this.value)">
          <option value="">보스를 선택하세요...</option>
        </select>
      </div>
    </div>

    <!-- 전쟁 구분 [일반][내전][인터] 축소 버튼 & 배점 안내 (한 줄 인라인 압축) -->
    <div class="d-flex justify-content-between align-items-center mt-1 pt-1 border-top border-secondary border-opacity-10 gap-1 flex-wrap">
      <div class="d-flex align-items-center gap-1">
        <span class="small text-secondary fw-bold" style="font-size: 0.66rem;">전쟁:</span>
        <div class="war-badge-group">
          <div class="war-badge-btn normal active" id="badgeWarNormal" onclick="selectWarType('일반')">
            일반
          </div>
          <div class="war-badge-btn internal" id="badgeWarInternal" onclick="selectWarType('내전')">
            내전
          </div>
          <div class="war-badge-btn inter" id="badgeWarInter" onclick="selectWarType('인터')">
            인터
          </div>
        </div>
      </div>

      <div class="score-info-badge" id="regScoreBadge">
        🏆 배점: <strong style="color: #facc15;">1점</strong> <span style="font-size: 0.62rem; opacity: 0.85;">(기본 1점)</span>
      </div>
    </div>
  </div>

  <!-- ========================================================
       3. 획득 드랍 아이템 (예시 버튼 삭제 완료 & 슬림화)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="d-flex align-items-center justify-content-between mb-1">
      <div class="reg-section-title mb-0">
        <i class="fa-solid fa-gift text-danger"></i>
        <span>획득 드랍 아이템</span>
      </div>
    </div>
    <input type="text" id="regDropItemsInput" class="form-control reg-input-custom w-100" placeholder="드랍 아이템 입력 (예: 영웅 도안, 축복받은 주문서)">
  </div>

  <!-- ========================================================
       4. 참여 길드원 선택 (글자 잘림 없이 전체 닉네임 표출 & 5열 반응형)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-1">
      <div class="reg-section-title mb-0">
        <i class="fa-solid fa-users text-primary"></i>
        <span>참여 길드원 (<span id="regSelectedCountText" style="color: #38bdf8; font-weight: 800;">0</span>명 선택됨)</span>
      </div>
      <div class="d-flex gap-1">
        <button type="button" class="btn-grid-tool" onclick="selectAllMembers(true)">
          전체선택
        </button>
        <button type="button" class="btn-grid-tool" onclick="selectAllMembers(false)">
          초기화
        </button>
      </div>
    </div>

    <!-- 5열 직사각형 버튼 그리드 (전체 닉네임 100% 온전 표기) -->
    <div class="member-grid-box-wrap">
      <div class="member-grid-5col" id="regMemberGridContainer">
        <div class="text-secondary small text-center py-3 w-100" style="grid-column: 1 / -1;">길드원 목록을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- ========================================================
       토벌 등록 및 대화방 공유 버튼
       ======================================================== -->
  <button type="button" class="btn btn-kakao-yellow w-100 py-2 fw-bold" id="btnSubmitRaidRegister" style="font-size: 0.88rem; border-radius: 9px;" onclick="executeBossRaidRegistration()">
    <i class="fa-solid fa-paper-plane me-1"></i> 토벌 등록 및 대화방 공유
  </button>
</div>

<script>
  window.regCachedMembers = window.regCachedMembers || [];
  window.regCachedBosses = window.regCachedBosses || [];
  window.regSelectedMemberSet = window.regSelectedMemberSet || new Set();
  window.regCurrentWarType = '일반';
  window.regCurrentOcrBase64 = null;
  window.regGeminiApiKey = '';
  window.regScoreBase = 1;
  window.regScoreWarInternal = 1;
  window.regScoreWarInter = 2;

  // 기본 49명 길드원 비상 백업 데이터 (DB 로드 지연 또는 실패 시 즉각 표출)
  const DEFAULT_FALLBACK_MEMBERS = [
    { name: '불편한용이', role: '길드장' },
    { name: '심기불편', role: '부길드장' },
    { name: '불편한형진', role: '정예' },
    { name: '야옹은고양이', role: '정예' },
    { name: '가두리', role: '일반' },
    { name: '까끼', role: '일반' },
    { name: '꿍꿍', role: '일반' },
    { name: '나의바램', role: '일반' },
    { name: '단비잉어', role: '일반' },
    { name: '뚤라딸라리', role: '일반' },
    { name: '뜸이', role: '일반' },
    { name: '라이프유', role: '일반' },
    { name: '레인아레인', role: '일반' },
    { name: '력비공', role: '일반' },
    { name: '류줌마', role: '일반' },
    { name: '만두국', role: '일반' },
    { name: '물냉', role: '일반' },
    { name: '북파공작', role: '일반' },
    { name: '불편러쑈당', role: '일반' },

  // 2. KST 현재 시각 기본 세팅
  function setDefaultKstDateTime() {
    const input = document.getElementById("regRaidDateTime");
    if (!input) return;

    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    input.value = `${year}-${month}-${day}T${hours}:${minutes}`;
  }

  // 3. 설정 및 배점 규칙 불러오기
  async function loadSettingsAndPointRules() {
    try {
      if (typeof apiRequest === "function") {
        const res = await apiRequest("guild_settings?select=key,value");
        if (res && res.length > 0) {
          res.forEach(item => {
            if (item.key === 'gemini_api_key' && item.value) {
              window.regGeminiApiKey = item.value;
            }
            if (item.key === 'score_base') window.regScoreBase = parseInt(item.value, 10) || 1;
            if (item.key === 'score_war_internal') window.regScoreWarInternal = parseInt(item.value, 10) || 1;
            if (item.key === 'score_war_inter') window.regScoreWarInter = parseInt(item.value, 10) || 2;
          });
        }
      }

      const keyBadge = document.getElementById("regGeminiKeyBadge");
      if (keyBadge) {
        if (window.regGeminiApiKey) {
          keyBadge.className = "badge bg-success bg-opacity-25 text-success border border-success border-opacity-50";
          keyBadge.innerText = "API 키 준비완료";
        } else {
          keyBadge.className = "badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50";
          keyBadge.innerText = "API 키 미설정";
        }
      }

      updateCalculatedScore();
    } catch (e) {}
  }

  function renderBossOptions() {

  // 5. 길드원 목록 로드
  async function loadRegisterMembers() {
    if (window.cachedMemberList && window.cachedMemberList.length > 0) {
      window.regCachedMembers = [...window.cachedMemberList];
      sortAndRenderMembers();
      return;
    }

    try {
      if (typeof apiRequest === "function") {
        const members = await apiRequest("guild_members?select=id,name,role,job_class&order=name.asc");
        if (members && members.length > 0) {
          window.regCachedMembers = members;
          sortAndRenderMembers();
          return;
        }
      }
    } catch (e) {}

    window.regCachedMembers = [...DEFAULT_FALLBACK_MEMBERS];
    sortAndRenderMembers();
  }

  function sortAndRenderMembers() {
    window.regCachedMembers.sort((a, b) => {
      const pA = getRolePriority(a.role);
      const pB = getRolePriority(b.role);
      if (pA !== pB) return pA - pB;
      return a.name.localeCompare(b.name, 'ko');
    });

    renderMemberSelectionGrid();
  }

  function getRolePriority(role) {
    const r = String(role || '').trim();
    if (r === '길드장' || r === '길마') return 1;
    if (r === '부길드장' || r === '부길마') return 2;
    if (r === '정예') return 3;
    return 4;
  }

  // 6. 길드원 5열 직사각형 선택 버튼 그리드 (글자 잘림 없이 전체 닉네임 표출)
  function renderMemberSelectionGrid() {
    const container = document.getElementById("regMemberGridContainer");
    if (!container) return;

    if (!window.regCachedMembers || window.regCachedMembers.length === 0) {
      window.regCachedMembers = [...DEFAULT_FALLBACK_MEMBERS];
    }

    container.innerHTML = window.regCachedMembers.map(m => {
      const isSelected = window.regSelectedMemberSet.has(m.name);
      const isMaster = (m.role === '길드장' || m.role === '길마');

      return `
        <div class="btn-member-cell ${isSelected ? 'selected' : ''} ${isMaster ? 'master' : ''}" 
             onclick="toggleMemberSelection('${m.name}')" 
             title="${m.name} (${m.role || '일반'})">
          ${m.name}
        </div>
      `;
    }).join('');

    updateSelectedCountUI();
  }

  function toggleMemberSelection(name) {
    if (window.regSelectedMemberSet.has(name)) {
      window.regSelectedMemberSet.delete(name);
    } else {
      window.regSelectedMemberSet.add(name);
    }
    renderMemberSelectionGrid();
  }

  function selectAllMembers(isSelectAll) {
    if (isSelectAll) {
      window.regCachedMembers.forEach(m => window.regSelectedMemberSet.add(m.name));
    } else {
      window.regSelectedMemberSet.clear();
    }
    renderMemberSelectionGrid();
  }

  function updateSelectedCountUI() {
    const el = document.getElementById("regSelectedCountText");
    if (el) el.innerText = window.regSelectedMemberSet.size;

  // 7. 전쟁 구분 뱃지 및 점수 계산 [일반][내전][인터]
  function selectWarType(type) {

  function updateCalculatedScore() {
    let score = window.regScoreBase || 1;
    let detail = `기본 ${score}점`;

    if (window.regCurrentWarType === '내전') {
      const add = window.regScoreWarInternal || 1;
      score += add;
      detail += ` + 내전 ${add}점`;
    } else if (window.regCurrentWarType === '인터') {
      const add = window.regScoreWarInter || 2;
      score += add;
      detail += ` + 인터 ${add}점`;
    }

    const badge = document.getElementById("regScoreBadge");
    if (badge) {
      badge.innerHTML = `🏆 배점: <strong style="color: #facc15;">${score}점</strong> <span style="font-size: 0.62rem; opacity: 0.85;">(${detail})</span>`;

  // 8. 클립보드 붙여넣기 & 스크린샷 이미지 처리
  function bindClipboardPasteEvent() {
    window.__pasteHandler = function(e) {
      if (!e.clipboardData || !e.clipboardData.items) return;
      for (let i = 0; i < e.clipboardData.items.length; i++) {
        const item = e.clipboardData.items[i];
        if (item.type.indexOf("image") !== -1) {
          const file = item.getAsFile();
          handleImageFileSelected(file);
          break;
        }
      }
    };
    window.addEventListener("paste", window.__pasteHandler);

    const dropArea = document.getElementById("ocrDropArea");
    if (dropArea) {
      ['dragenter', 'dragover'].forEach(name => {
        dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = '#a855f7'; }, false);
      });
      ['dragleave', 'drop'].forEach(name => {
        dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = 'rgba(168, 85, 247, 0.4)'; }, false);
      });
      dropArea.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleImageFileSelected(e.dataTransfer.files[0]);
        }
      });
    }

    window.__currentModuleCleanup = function() {
      if (window.__pasteHandler) {
        window.removeEventListener("paste", window.__pasteHandler);
      }
    };
  }

  function handleImageFileSelected(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      window.regCurrentOcrBase64 = e.target.result;
      
      const thumb = document.getElementById("ocrThumbImg");
      const nameElem = document.getElementById("ocrFileName");
      const regCard = document.getElementById("ocrRegisteredCard");
      const dropArea = document.getElementById("ocrDropArea");

      if (thumb) thumb.src = window.regCurrentOcrBase64;
      if (nameElem) nameElem.innerText = file.name || "스크린샷.png";
      
      if (regCard) regCard.style.display = "flex";
      if (dropArea) dropArea.style.display = "none";

      showOcrStatus("📷 이미지가 준비되었습니다. [분석 시작] 버튼을 눌러주세요.", "info");
    };
    reader.readAsDataURL(file);
  }

  function triggerReupload() {
    window.regCurrentOcrBase64 = null;
    const regCard = document.getElementById("ocrRegisteredCard");
    const dropArea = document.getElementById("ocrDropArea");
    const thumb = document.getElementById("ocrThumbImg");
    const fileInput = document.getElementById("ocrFileInput");

    if (regCard) regCard.style.display = "none";
    if (dropArea) dropArea.style.display = "flex";
    if (thumb) thumb.src = "";
    if (fileInput) fileInput.value = "";
    showOcrStatus("", "");
    document.getElementById('ocrFileInput').click();
  }

  function showOcrStatus(msg, type = "info") {
    const el = document.getElementById("ocrStatusMsg");
    if (!el) return;
    if (!msg) {
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    el.innerText = msg;
    if (type === "error") el.className = "mt-1 text-center small text-danger fw-bold";
    else if (type === "success") el.className = "mt-1 text-center small text-success fw-bold";
    else el.className = "mt-1 text-center small text-secondary";
  }

  // 9. Gemini Flash AI OCR 분석 실행
  async function executeGeminiOcrAnalysis() {
    if (!window.regCurrentOcrBase64) {
      alert("⚠️ 먼저 스크린샷 이미지를 붙여넣기(Ctrl+V)하거나 업로드하세요!");
      return;
    }

    if (!window.regGeminiApiKey && typeof apiRequest === "function") {
      try {
        const res = await apiRequest("guild_settings?key=eq.gemini_api_key");
        if (res && res.length > 0 && res[0].value) {
          window.regGeminiApiKey = res[0].value;
        }
      } catch (e) {}
    }

    if (!window.regGeminiApiKey) {
      alert("⚠️ Gemini API 키가 등록되지 않았습니다!\n[설정] > [보안] 탭에서 Gemini AI OCR API 키를 먼저 등록해주세요.");
      return;
    }

    const btn = document.getElementById("btnRunAiOcr");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 분석 중...`;
    }

    showOcrStatus("🔍 AI가 스크린샷 속 길드원 닉네임을 분석하고 있습니다...", "info");

    try {
      const commaIdx = window.regCurrentOcrBase64.indexOf(",");
      const rawBase64 = (commaIdx !== -1) ? window.regCurrentOcrBase64.slice(commaIdx + 1) : window.regCurrentOcrBase64;
      const mimeType = window.regCurrentOcrBase64.substring(5, commaIdx).split(';')[0] || "image/jpeg";

      const promptText = `이 이미지는 모바일/PC 게임의 파티/토벌/기여도 참여자 목록 스크린샷입니다. 
화면에 나타난 모든 플레이어/길드원 캐릭터 닉네임을 정확히 추출하세요. 
출력은 다른 설명 없이 오직 순수한 JSON 문자열 배열 형태만 출력하세요. 
예시: ["홍길동", "이순신", "강감찬"]`;

      const requestUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${window.regGeminiApiKey}`;
      
      const response = await fetch(requestUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: mimeType, data: rawBase64 } }
            ]
          }],
          generationConfig: {
            temperature: 0.1,
            response_mime_type: "application/json"
          }
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `API 요청 실패 (${response.status})`);
      }

      const resData = await response.json();
      const rawContent = resData.candidates?.[0]?.content?.parts?.[0]?.text || "[]";

      let extractedNames = [];
      try {
        extractedNames = JSON.parse(rawContent);
      } catch (e) {
        const match = rawContent.match(/\[[\s\S]*\]/);
        if (match) extractedNames = JSON.parse(match[0]);
      }

      if (!Array.isArray(extractedNames) || extractedNames.length === 0) {
        showOcrStatus("⚠️ 이미지에서 인식된 닉네임이 없습니다. 버튼을 직접 클릭해 선택해주세요.", "error");
        return;
      }

      let matchedCount = 0;
      extractedNames.forEach(name => {
        if (!name) return;
        const cleanName = String(name).trim();
        const matched = window.regCachedMembers.find(m => 
          m.name.toLowerCase() === cleanName.toLowerCase() ||
          cleanName.includes(m.name) ||
          m.name.includes(cleanName)
        );

        if (matched) {
          window.regSelectedMemberSet.add(matched.name);
          matchedCount++;
        }
      });

      renderMemberSelectionGrid();

      showOcrStatus(`🎉 인식 완료! 길드원 ${matchedCount}명이 자동 선택되었습니다.`, "success");
      if (typeof showKakaoToast === "function") {
        showKakaoToast(`[AI 인식] 길드원 ${matchedCount}명 자동 선택!`, "🎯");
      }
    } catch (err) {
      showOcrStatus(`❌ AI 분석 실패: ${err.message}`, "error");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> 분석 시작`;
      }
    }
  }

  // 10. 토벌 완료 등록 및 현재 대화방 공유
  async function executeBossRaidRegistration() {
    const bossSelect = document.getElementById("regBossSelect");
    const selectedBoss = bossSelect ? bossSelect.value.trim() : "";
    const raidTimeVal = document.getElementById("regRaidDateTime")?.value;
    const dropItemsVal = document.getElementById("regDropItemsInput")?.value.trim() || "";
    const btnSubmit = document.getElementById("btnSubmitRaidRegister");

    if (!selectedBoss) {
      alert("⚠️ 토벌한 보스를 선택해주세요!");
      bossSelect.focus();
      return;
    }

    if (window.regSelectedMemberSet.size === 0) {
      alert("⚠️ 참여한 길드원을 최소 1명 이상 선택해주세요!");
      return;
    }

    const myNick = localStorage.getItem("guild_my_nickname") || "길드원";
    const selectedMembersArray = Array.from(window.regSelectedMemberSet);

    let calculatedScore = window.regScoreBase || 1;
    if (window.regCurrentWarType === '내전') calculatedScore += (window.regScoreWarInternal || 1);
    else if (window.regCurrentWarType === '인터') calculatedScore += (window.regScoreWarInter || 2);

    let raidTimeIso = new Date().toISOString();
    if (raidTimeVal) {
      const parsedTime = new Date(raidTimeVal);
      if (!isNaN(parsedTime.getTime())) raidTimeIso = parsedTime.toISOString();
    }

    if (!confirm(`[${selectedBoss}] 토벌 참여자 총 ${selectedMembersArray.length}명을 등록하고 현재 대화방에 공유하시겠습니까?`)) {
      return;
    }

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> 등록 및 대화방 공유 중...`;
    }

    try {
      let insertedRaidId = Date.now();
      if (typeof apiRequest === "function") {
        const insertRaidRes = await apiRequest("boss_participations", "POST", [{
          boss_name: selectedBoss,
          raid_time: raidTimeIso,
          war_type: window.regCurrentWarType,
          score: calculatedScore,
          members: selectedMembersArray,
          member_count: selectedMembersArray.length,
          drop_items: dropItemsVal,
          created_at: new Date().toISOString(),
          created_by: myNick
        }]);

        if (insertRaidRes && insertRaidRes.length > 0 && insertRaidRes[0].id) {
          insertedRaidId = insertRaidRes[0].id;
        }

        const raidPayload = {
          raid_id: insertedRaidId,
          boss_name: selectedBoss,
          raid_time: formatTimeForChat(raidTimeIso),
          war_type: window.regCurrentWarType,
          score: calculatedScore,
          drop_items: dropItemsVal,
          members: selectedMembersArray,
          member_count: selectedMembersArray.length,
          created_at: new Date().toISOString()
        };

        await apiRequest("guild_chats", "POST", [{
          sender_name: "토벌알리미",
          message: JSON.stringify(raidPayload),
          msg_type: "raid_report",
          mentions: []
        }]);
      }

      if (typeof showKakaoToast === "function") {
        showKakaoToast(`[${selectedBoss}] 토벌이 등록되어 대화방에 공유되었습니다!`, "🎉");
      } else {
        alert(`🎉 [${selectedBoss}] 토벌이 등록되어 대화방에 공유되었습니다!`);
      }

      if (typeof closeModuleOverlay === "function") {
        closeModuleOverlay();
      }
    } catch (err) {
      alert("❌ 토벌 등록 실패: " + err.message);
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> 토벌 등록 및 대화방 공유`;
      }
    }
  }

  function formatTimeForChat(isoString) {
    try {
      const d = new Date(isoString);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${m}/${day} ${h}:${min}`;
    } catch (e) {
      return "";
    }
  }
