<!-- ==========================================
     [ECLIPSE 길드관리] 보스참여 등록 모듈
     경로: pages/PageRegister.html
     ========================================== -->
<style>
  :root {
    --reg-card-bg: #181d24;
    --reg-card-border: #282f3a;
    --reg-text-main: #f3f4f6;
    --reg-text-sub: #9ca3af;
    --reg-section-bg: #1e2530;
    --reg-section-border: #2c3545;
    --reg-input-bg: #141922;
    --reg-input-border: #2c3545;
    --reg-input-text: #ffffff;
    --reg-member-bg: #0d1527;
    --reg-member-border: #1e293b;
    --reg-member-text: #f1f5f9;
    --reg-member-hover: #1e293b;
    --reg-grid-wrap-bg: #090e1c;
    --reg-grid-wrap-border: #1e293b;
    --reg-chip-bg: #141922;
    --reg-chip-border: #2c3545;
    --reg-chip-text: #cbd5e1;
    --reg-chip-hover: #1e293b;
    --reg-score-text: #facc15;
    --reg-score-badge-bg: #0f172a;
    --reg-score-badge-border: #eab308;
    --reg-score-badge-text: #f8fafc;
    --reg-dropzone-bg: rgba(0, 0, 0, 0.16);
    --reg-dropzone-border: rgba(168, 85, 247, 0.4);
    --reg-dropzone-text: #e2e8f0;
    --reg-yellow: #fee500;
  }

  /* ☀️ 라이트 모드 고대비(High-Contrast) 스타일 완벽 일치 */
  html.theme-light .register-card,
  body.theme-light .register-card,
  .register-card.light-mode {
    --reg-card-bg: #ffffff;
    --reg-card-border: #e2e8f0;
    --reg-text-main: #0f172a;
    --reg-text-sub: #475569;
    --reg-section-bg: #f8fafc;
    --reg-section-border: #e2e8f0;
    --reg-input-bg: #ffffff;
    --reg-input-border: #cbd5e1;
    --reg-input-text: #0f172a;
    --reg-member-bg: #ffffff;
    --reg-member-border: #cbd5e1;
    --reg-member-text: #1e293b;
    --reg-member-hover: #f1f5f9;
    --reg-grid-wrap-bg: #ffffff;
    --reg-grid-wrap-border: #cbd5e1;
    --reg-chip-bg: #f1f5f9;
    --reg-chip-border: #cbd5e1;
    --reg-chip-text: #334155;
    --reg-chip-hover: #e2e8f0;
    --reg-score-text: #b45309;
    --reg-score-badge-bg: #fffbeb;
    --reg-score-badge-border: #f59e0b;
    --reg-score-badge-text: #92400e;
    --reg-dropzone-bg: #f8fafc;
    --reg-dropzone-border: #c084fc;
    --reg-dropzone-text: #334155;
    --reg-yellow: #fee500;
  }

  .register-card {
    background: var(--reg-card-bg);
    border: 1px solid var(--reg-card-border);
    border-radius: 14px;
    padding: 11px 13px;
    color: var(--reg-text-main);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    letter-spacing: -0.2px;
  }

  .reg-section-box {
    background: var(--reg-section-bg);
    border: 1px solid var(--reg-section-border);
    border-radius: 9px;
    padding: 8px 10px;
    margin-bottom: 7px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .reg-section-title {
    font-size: 0.79rem;
    font-weight: 800;
    color: var(--reg-text-main);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
  }

  .reg-input-custom {
    background-color: var(--reg-input-bg) !important;
    border: 1px solid var(--reg-input-border) !important;
    color: var(--reg-input-text) !important;
    border-radius: 7px !important;
    padding: 4px 9px !important;
    font-size: 0.77rem !important;
    height: 32px;
    outline: none !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .reg-input-custom:focus {
    border-color: #0284c7 !important;
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2) !important;
  }

  /* 💛 카카오톡 감성 고대비 액션 버튼 */
  .btn-kakao-yellow {
    background-color: #fee500 !important;
    color: #191919 !important;
    border: 1px solid #e5cf00 !important;
    font-weight: 800 !important;
    border-radius: 9px !important;
    transition: all 0.15s ease-in-out !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    height: 38px;
  }
  .btn-kakao-yellow:hover:not(:disabled) {
    background-color: #fada0a !important;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(254, 229, 0, 0.35) !important;
  }
  .btn-kakao-yellow:active:not(:disabled) {
    transform: translateY(0);
  }
  .btn-kakao-yellow:disabled {
    background-color: #94a3b8 !important;
    color: #ffffff !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
    border-color: #94a3b8 !important;
  }

  /* 1. 상단 토벌현장기록 고대비 선명 뱃지 */
  .reg-status-badge {
    background: #0f172a !important;
    border: 1px solid #38bdf8 !important;
    color: #38bdf8 !important;
    font-size: 0.68rem !important;
    font-weight: 700 !important;
    padding: 3px 8px !important;
    border-radius: 6px !important;
    letter-spacing: -0.2px;
  }
  body.theme-light .reg-status-badge,
  html.theme-light .reg-status-badge {
    background: #e0f2fe !important;
    border-color: #0284c7 !important;
    color: #0369a1 !important;
  }

  /* ========================================================
     API OCR 및 이미지 등록 박스
     ======================================================== */
  .ocr-compact-dropzone {
    border: 1.5px dashed var(--reg-dropzone-border);
    border-radius: 8px;
    padding: 8px 12px;
    text-align: center;
    background: var(--reg-dropzone-bg);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .ocr-compact-dropzone:hover {
    border-color: #a855f7;
    background: rgba(168, 85, 247, 0.08);
  }
  .ocr-dropzone-text {
    color: var(--reg-dropzone-text);
    font-size: 0.75rem;
    font-weight: 700;
  }

  .ocr-registered-card {
    border: 1.5px dashed #6366f1;
    border-radius: 9px;
    padding: 6px 10px;
    background: var(--reg-input-bg);
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ocr-img-thumb {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    object-fit: cover;
    border: 1.5px solid var(--reg-input-border);
    flex-shrink: 0;
  }
  .btn-ocr-analyze {
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    color: #ffffff;
    border: none;
    font-weight: 800;
    font-size: 0.74rem;
    padding: 5px 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(168, 85, 247, 0.35);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .btn-ocr-analyze:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .btn-ocr-reupload {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.4);
    font-weight: 700;
    font-size: 0.72rem;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: all 0.15s ease;
  }
  body.theme-light .btn-ocr-reupload {
    background: #fef2f2;
    color: #dc2626;
    border-color: #fca5a5;
  }
  .btn-ocr-reupload:hover {
    background: rgba(239, 68, 68, 0.22);
  }

  /* ========================================================
     ⚡ 보스 원터치 빠른 선택 칩
     ======================================================== */
  .quick-boss-chips-row {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    padding: 2px 1px 4px 1px;
    margin-top: 4px;
    scrollbar-width: thin;
  }
  .btn-quick-boss-chip {
    background: var(--reg-chip-bg);
    border: 1px solid var(--reg-chip-border);
    color: var(--reg-chip-text);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 12px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    line-height: 1.2;
    flex-shrink: 0;
  }
  .btn-quick-boss-chip:hover {
    border-color: #0284c7;
    background: var(--reg-chip-hover);
    color: var(--reg-text-main);
  }
  .btn-quick-boss-chip.active {
    background: #0284c7 !important;
    border-color: #0284c7 !important;
    color: #ffffff !important;
    box-shadow: 0 1px 4px rgba(2, 132, 199, 0.35);
  }
  .btn-quick-boss-chip.spawned {
    border-color: #ef4444;
    color: #f87171;
  }
  body.theme-light .btn-quick-boss-chip.spawned {
    border-color: #dc2626;
    color: #dc2626;
    background: #fef2f2;
  }

  /* ========================================================
     5개 일체형 단일행 컨트롤 바 [일반][내전][인터][추가][총점]
     ======================================================== */
  .raid-score-control-bar {
    display: flex;
    align-items: center;
    gap: 3px;
    width: 100%;
    margin-top: 5px;
    padding-top: 6px;
    border-top: 1px solid var(--reg-section-border);
    flex-wrap: nowrap !important;
  }

  .war-badge-btn {
    flex: 1 1 0;
    min-width: 0;
    height: 29px;
    padding: 0 2px;
    border-radius: 6px;
    border: 1px solid var(--reg-section-border);
    background: var(--reg-input-bg);
    color: var(--reg-text-sub);
    font-size: 0.69rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    white-space: nowrap;
    line-height: 1.15;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    letter-spacing: -0.3px;
  }
  .war-badge-btn:hover {
    border-color: #94a3b8;
  }
  .war-badge-btn.active.normal {
    background: rgba(56, 189, 248, 0.22);
    border-color: #0284c7;
    color: #0284c7;
  }
  body.theme-dark .war-badge-btn.active.normal {
    background: rgba(56, 189, 248, 0.25);
    border-color: #38bdf8;
    color: #38bdf8;
  }
  .war-badge-btn.active.internal {
    background: rgba(245, 158, 11, 0.2);
    border-color: #d97706;
    color: #d97706;
  }
  body.theme-dark .war-badge-btn.active.internal {
    background: rgba(245, 158, 11, 0.25);
    border-color: #f59e0b;
    color: #fbbf24;
  }
  .war-badge-btn.active.inter {
    background: rgba(239, 68, 68, 0.18);
    border-color: #dc2626;
    color: #dc2626;
  }
  body.theme-dark .war-badge-btn.active.inter {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    color: #ff6b6b;
  }

  /* ⭐ 추가점수 선택 드롭다운 (단일행 5분할 일체형 & 화살표 겹침 방지) */
  .reg-extra-select {
    flex: 1 1 0;
    min-width: 0;
    background-color: var(--reg-input-bg) !important;
    border: 1px solid var(--reg-input-border) !important;
    color: var(--reg-input-text) !important;
    border-radius: 6px !important;
    padding: 0 14px 0 3px !important;
    background-position: right 3px center !important;
    background-size: 8px 6px !important;
    font-size: 0.69rem !important;
    font-weight: 700 !important;
    height: 29px !important;
    cursor: pointer;
    outline: none !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    text-align: center;
    letter-spacing: -0.3px;
  }
  .reg-extra-select:focus {
    border-color: #0284c7 !important;
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2) !important;
  }

  /* 1인당 최종 배점 안내 고대비 뱃지 (단일행 5분할 일체형) */
  .score-info-badge {
    flex: 1 1 0;
    min-width: 0;
    height: 29px;
    background: var(--reg-score-badge-bg);
    border: 1px solid var(--reg-score-badge-border);
    color: var(--reg-score-badge-text);
    font-size: 0.69rem;
    font-weight: 700;
    padding: 0 2px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }
  .score-val-highlight {
    color: var(--reg-score-text) !important;
    font-weight: 800;
    font-size: 0.77rem;
  }

  @media (max-width: 350px) {
    .raid-score-control-bar {
      gap: 2px;
    }
    .war-badge-btn,
    .reg-extra-select,
    .score-info-badge {
      font-size: 0.62rem !important;
      letter-spacing: -0.5px;
    }
    .score-val-highlight {
      font-size: 0.7rem !important;
    }
    .btn-member-cell {
      font-size: 0.61rem;
      letter-spacing: -0.7px;
      padding: 4px 1px;
      min-height: 30px;
    }
  }

  /* ========================================================
     길드원 실시간 검색 및 도구 모음
     ======================================================== */
  .member-tools-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    margin-bottom: 5px;
    flex-wrap: wrap;
  }
  .member-search-box {
    position: relative;
    flex: 1;
    min-width: 130px;
  }
  .member-search-icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem;
    color: var(--reg-text-sub);
    pointer-events: none;
  }
  .member-search-input {
    padding-left: 24px !important;
    padding-right: 22px !important;
    height: 28px !important;
    font-size: 0.73rem !important;
    border-radius: 6px !important;
  }
  .member-search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem;
    color: var(--reg-text-sub);
    cursor: pointer;
    display: none;
    line-height: 1;
  }
  .member-search-clear:hover {
    color: #ef4444;
  }

  .btn-grid-tool {
    background: var(--reg-chip-bg);
    border: 1px solid var(--reg-chip-border);
    color: var(--reg-chip-text);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    height: 28px;
  }
  .btn-grid-tool:hover {
    border-color: #0284c7;
    color: #0284c7;
    background: var(--reg-chip-hover);
  }
  .btn-grid-tool.btn-tool-last {
    background: rgba(16, 185, 129, 0.12);
    border-color: rgba(16, 185, 129, 0.4);
    color: #10b981;
  }
  body.theme-light .btn-grid-tool.btn-tool-last {
    background: #ecfdf5;
    border-color: #10b981;
    color: #047857;
  }
  .btn-grid-tool.btn-tool-last:hover {
    background: #10b981;
    color: #ffffff;
    border-color: #10b981;
  }

  /* ========================================================
     길드원 선택 버튼 그리드 (모바일 5열 반응형 & 고대비 선택 상태)
     ======================================================== */
  .member-grid-box-wrap {
    border: 1px solid var(--reg-grid-wrap-border);
    border-radius: 8px;
    padding: 6px 4px;
    background: var(--reg-grid-wrap-bg);
    max-height: 320px;
    overflow-y: auto;
  }

  /* 5열 모바일 반응형 그리드 */
  .member-grid-5col {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
  }

  .btn-member-cell {
    background: var(--reg-member-bg);
    border: 1px solid var(--reg-member-border);
    border-radius: 6px;
    padding: 5px 1px;
    color: var(--reg-member-text);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    cursor: pointer;
    text-align: center;
    white-space: normal;
    word-break: break-all;
    line-height: 1.15;
    transition: all 0.12s ease;
    user-select: none;
    min-height: 33px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-member-cell:hover {
    border-color: #0284c7;
    background: var(--reg-member-hover);
    transform: translateY(-1px);
  }
  /* 선택 상태 (다크/라이트 모두 최고 대비 블루) */
  .btn-member-cell.selected {
    background: #0284c7 !important;
    border-color: #0284c7 !important;
    color: #ffffff !important;
    font-weight: 800 !important;
    box-shadow: 0 0 6px rgba(2, 132, 199, 0.45) !important;
  }

  /* ========================================================
     카카오톡 스타일 인앱 커스텀 모달 알림창
     ======================================================== */
  .reg-modal-backdrop {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    z-index: 9999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeInRegModal 0.15s ease-out;
  }
  @keyframes fadeInRegModal {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .reg-modal-card {
    background: var(--reg-card-bg);
    border: 1px solid var(--reg-card-border);
    border-radius: 14px;
    width: 100%;
    max-width: 320px;
    padding: 20px 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color: var(--reg-text-main);
  }
  .reg-modal-icon {
    font-size: 2rem;
    margin-bottom: 8px;
    line-height: 1;
  }
  .reg-modal-title {
    font-size: 0.95rem;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--reg-text-main);
  }
  .reg-modal-msg {
    font-size: 0.78rem;
    color: var(--reg-text-sub);
    line-height: 1.45;
    word-break: keep-all;
    white-space: pre-line;
    margin-bottom: 14px;
  }
  .btn-modal-cancel {
    background: var(--reg-section-bg);
    border: 1px solid var(--reg-section-border);
    color: var(--reg-text-sub);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    flex: 1;
    transition: all 0.15s ease;
  }
  .btn-modal-cancel:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--reg-text-main);
  }
  .btn-modal-confirm {
    background: #fee500;
    border: 1px solid #e5cf00;
    color: #191919;
    font-size: 0.78rem;
    font-weight: 800;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    flex: 1;
    transition: all 0.15s ease;
  }
  .btn-modal-confirm:hover {
    background: #fada0a;
  }
</style>

<div class="register-card mb-4" id="registerRootCard">
  <!-- 상단 헤더: 제목 + 고대비 토벌 현장 기록 뱃지 -->
  <div class="d-flex align-items-center justify-content-between mb-2 gap-2 flex-wrap">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.1rem;">⚔️</span>
      <div>
        <h6 class="fw-bold mb-0" style="font-size: 0.88rem;">보스참여 등록</h6>
        <span class="small text-secondary" style="font-size: 0.65rem;">스크린샷 자동인식 및 토벌 결과 대화방 즉시 공유</span>
      </div>
    </div>
    <span class="badge reg-status-badge">
      ⚔️ 토벌 현장 기록
    </span>
  </div>

  <!-- ========================================================
       1. 스크린샷 AI 자동인식
       ======================================================== -->
  <div class="reg-section-box">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <div class="reg-section-title mb-0">
        <i class="fa-solid fa-camera text-warning"></i>
        <span>스크린샷 AI 인식</span>
      </div>
      <span id="regGeminiKeyBadge" class="badge bg-secondary bg-opacity-25 text-secondary border border-secondary border-opacity-50" style="font-size: 0.58rem; padding: 2px 5px;">
        키 확인 중
      </span>
    </div>

    <!-- 숨겨진 파일 인풋 -->
    <input type="file" id="ocrFileInput" accept="image/*" style="display: none;" onchange="handleImageFileSelected(this.files[0])">

    <!-- 1) 업로드 전: 컴팩트 드롭존 -->
    <div class="ocr-compact-dropzone" id="ocrDropArea" onclick="document.getElementById('ocrFileInput').click()">
      <i class="fa-solid fa-cloud-arrow-up text-primary" style="font-size: 1rem;"></i>
      <span class="ocr-dropzone-text">클릭하여 스크린샷 업로드 또는 붙여넣기 (Ctrl+V)</span>
    </div>

    <!-- 2) 업로드 후 (가로형 배치) -->
    <div class="ocr-registered-card" id="ocrRegisteredCard">
      <div class="d-flex align-items-center gap-2" style="min-width: 0; flex: 1;">
        <img id="ocrThumbImg" class="ocr-img-thumb" src="" alt="썸네일">
        <div style="min-width: 0; flex: 1;">
          <div id="ocrFileName" class="fw-bold text-truncate" style="font-size: 0.78rem; color: #a855f7;">스크린샷.png</div>
          <div class="text-secondary" style="font-size: 0.65rem;">준비 완료 (분석 시작 버튼 클릭)</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <button type="button" class="btn-ocr-analyze" id="btnRunAiOcr" onclick="executeGeminiOcrAnalysis()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 분석 시작
        </button>
        <button type="button" class="btn-ocr-reupload" onclick="triggerReupload()" title="다른 이미지로 교체">
          <i class="fa-solid fa-rotate"></i> 재업로드
        </button>
      </div>
    </div>

    <div id="ocrStatusMsg" class="mt-1 text-center small text-secondary" style="font-size: 0.68rem; display: none;"></div>
  </div>

  <!-- ========================================================
       2. 토벌 정보 입력창 (보스 빠른 선택 칩 & 전쟁-배점 일체형)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="row g-1 mb-1">
      <!-- 컬럼 1: 토벌 일시 (KST) -->
      <div class="col-6">
        <label class="small text-secondary mb-0" style="font-size: 0.65rem;">토벌 일시 (KST)</label>
        <input type="datetime-local" id="regRaidDateTime" class="form-control reg-input-custom w-100">
      </div>

      <!-- 컬럼 2: 보스 선택 -->
      <div class="col-6">
        <label class="small text-secondary mb-0" style="font-size: 0.65rem;">보스 선택</label>
        <select id="regBossSelect" class="form-select reg-input-custom w-100" onchange="onBossSelectChange(this.value)">
          <option value="">보스를 선택하세요...</option>
        </select>
      </div>
    </div>

    <!-- ⚡ 보스 빠른 원터치 선택 칩 바 (최근 출현/임박 보스) -->
    <div class="d-flex align-items-center gap-1 mt-1">
      <span class="text-secondary" style="font-size: 0.65rem; font-weight: 700; white-space: nowrap;"><i class="fa-solid fa-bolt text-warning me-1"></i>빠른선택:</span>
      <div class="quick-boss-chips-row" id="quickBossChipsContainer">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>

    <!-- 5개 일체형 단일행 컨트롤 바: [일반], [내전], [인터], [추가], [총점] -->
    <div class="raid-score-control-bar">
      <!-- 1) [일반] -->
      <div class="war-badge-btn normal active" id="badgeWarNormal" onclick="selectWarType('일반')">
        <span class="war-name">일반</span>
        <span class="small opacity-75" id="labelWarScoreNormal">(1점)</span>
      </div>

      <!-- 2) [내전] -->
      <div class="war-badge-btn internal" id="badgeWarInternal" onclick="selectWarType('내전')">
        <span class="war-name">내전</span>
        <span class="small opacity-75" id="labelWarScoreInternal">(+1점)</span>
      </div>

      <!-- 3) [인터] -->
      <div class="war-badge-btn inter" id="badgeWarInter" onclick="selectWarType('인터')">
        <span class="war-name">인터</span>
        <span class="small opacity-75" id="labelWarScoreInter">(+2점)</span>
      </div>

      <!-- 4) [추가] -->
      <select id="regExtraScoreSelect" class="form-select reg-extra-select" onchange="onExtraScoreChange(this.value)">
        <option value="0">추가 0점</option>
        <option value="1">추가 +1점</option>
        <option value="2">추가 +2점</option>
        <option value="3">추가 +3점</option>
        <option value="4">추가 +4점</option>
        <option value="5">추가 +5점</option>
        <option value="6">추가 +6점</option>
        <option value="7">추가 +7점</option>
        <option value="8">추가 +8점</option>
        <option value="9">추가 +9점</option>
        <option value="10">추가 +10점</option>
      </select>

      <!-- 5) [총점] -->
      <div class="score-info-badge" id="regScoreBadge">
        <span>총점:</span>
        <strong class="score-val-highlight" id="regScoreValueText">1점</strong>
      </div>
    </div>
  </div>

  <!-- ========================================================
       3. 획득 드랍 아이템 (심플하고 깔끔한 직접 입력창 유지)
       ======================================================== -->
  <div class="reg-section-box">
    <div class="d-flex align-items-center justify-content-between mb-1">
      <div class="reg-section-title mb-0">
        <i class="fa-solid fa-gift text-danger"></i>
        <span>획득 드랍 아이템</span>
      </div>
    </div>
    <input type="text" id="regDropItemsInput" class="form-control reg-input-custom w-100" placeholder="획득한 드랍 아이템을 입력하세요 (예: 영웅 도안, 축복받은 무기 마법서)">
  </div>

  <!-- ========================================================
       4. 참여 길드원 선택 (실시간 검색 + [직전참여자] + 5열 반응형)
       ======================================================== -->
  <div class="reg-section-box">
    <!-- 검색창 및 빠른 도구 바 -->
    <div class="member-tools-bar">
      <!-- 실시간 닉네임 검색 인풋 -->
      <div class="member-search-box">
        <i class="fa-solid fa-magnifying-glass member-search-icon"></i>
        <input type="text" id="regMemberSearchInput" class="form-control reg-input-custom member-search-input" placeholder="길드원 닉네임 검색..." oninput="onMemberSearchInput(this.value)">
        <i class="fa-solid fa-circle-xmark member-search-clear" id="memberSearchClearBtn" onclick="clearMemberSearch()" title="검색 초기화"></i>
      </div>

      <!-- 액션 도구: [직전참여자] [전체선택] [초기화] -->
      <div class="d-flex gap-1 flex-shrink-0">
        <button type="button" class="btn-grid-tool btn-tool-last" onclick="loadLastRaidMembers()" title="가장 최근 토벌에 참여했던 길드원 목록을 그대로 불러옵니다">
          <i class="fa-solid fa-clock-rotate-left"></i> 직전참여자
        </button>
        <button type="button" class="btn-grid-tool" onclick="selectAllMembers(true)">
          전체선택
        </button>
        <button type="button" class="btn-grid-tool" onclick="selectAllMembers(false)">
          초기화
        </button>
      </div>
    </div>

    <!-- 선택 인원수 카운터 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-1">
      <div class="small text-secondary" style="font-size: 0.72rem;">
        <i class="fa-solid fa-users me-1 text-primary"></i>
        <span>선택된 길드원: <strong id="regSelectedCountText" style="color: #0284c7; font-weight: 800;">0</strong>명</span>
      </div>
      <span class="small text-secondary" style="font-size: 0.65rem;" id="regFilterCountText">총 0명</span>
    </div>

    <!-- 5열 직사각형 버튼 그리드 (전체 닉네임 100% 온전 표기) -->
    <div class="member-grid-box-wrap">
      <div class="member-grid-5col" id="regMemberGridContainer">
        <div class="text-secondary small text-center py-3 w-100" style="grid-column: 1 / -1;">길드원 목록을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- ========================================================
       토벌 등록 및 대화방 공유 버튼
       ======================================================== -->
  <button type="button" class="btn btn-kakao-yellow w-100 py-2 fw-bold" id="btnSubmitRaidRegister" onclick="executeBossRaidRegistration()">
    <i class="fa-solid fa-paper-plane me-1"></i> 토벌 등록 및 대화방 공유
  </button>

  <!-- 카카오톡 스타일 커스텀 모달 알림/확인창 -->
  <div id="regCustomModal" class="reg-modal-backdrop" style="display: none;">
    <div class="reg-modal-card">
      <div class="reg-modal-icon" id="regModalIcon">💬</div>
      <div class="reg-modal-title" id="regModalTitle">알림</div>
      <div class="reg-modal-msg" id="regModalMsg">내용</div>
      <div class="d-flex gap-2 justify-content-center" id="regModalBtnGroup"></div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // [인앱 커스텀 모달 알림 및 확인창 (브라우저 기본창 대체)]
  // ==========================================
  function showRegAlert(msg, icon = "⚠️", title = "알림") {
    return new Promise(resolve => {
      const modal = document.getElementById("regCustomModal");
      const iconEl = document.getElementById("regModalIcon");
      const titleEl = document.getElementById("regModalTitle");
      const msgEl = document.getElementById("regModalMsg");
      const btnGroup = document.getElementById("regModalBtnGroup");

      if (!modal) {
        if (typeof showKakaoToast === "function") showKakaoToast(msg, icon);
        else console.warn(msg);
        resolve();
        return;
      }

      iconEl.innerText = icon;
      titleEl.innerText = title;
      msgEl.innerText = msg;
      btnGroup.innerHTML = `<button type="button" class="btn-modal-confirm w-100 py-2" id="btnRegAlertOk">확인</button>`;

      modal.style.display = "flex";
      document.getElementById("btnRegAlertOk").onclick = () => {
        modal.style.display = "none";
        resolve();
      };
    });
  }

  function showRegConfirm(msg, icon = "⚔️", title = "토벌 등록 확인") {
    return new Promise(resolve => {
      const modal = document.getElementById("regCustomModal");
      const iconEl = document.getElementById("regModalIcon");
      const titleEl = document.getElementById("regModalTitle");
      const msgEl = document.getElementById("regModalMsg");
      const btnGroup = document.getElementById("regModalBtnGroup");

      if (!modal) {
        resolve(true);
        return;
      }

      iconEl.innerText = icon;
      titleEl.innerText = title;
      msgEl.innerText = msg;
      btnGroup.innerHTML = `
        <button type="button" class="btn-modal-cancel py-2" id="btnRegConfirmCancel">취소</button>
        <button type="button" class="btn-modal-confirm py-2" id="btnRegConfirmOk">확인 및 공유</button>
      `;

      modal.style.display = "flex";
      document.getElementById("btnRegConfirmCancel").onclick = () => {
        modal.style.display = "none";
        resolve(false);
      };
      document.getElementById("btnRegConfirmOk").onclick = () => {
        modal.style.display = "none";
        resolve(true);
      };
    });
  }

  // 🔄 폼 전역 변수 초기화 (기존 잔여 선택값 완전 백지화)
  window.regCachedMembers = window.regCachedMembers || [];
  window.regCachedBosses = window.regCachedBosses || [];
  window.regSelectedMemberSet = new Set(); // 이전 선택 인원 즉시 초기화
  window.regCurrentWarType = '일반';
  window.regExtraScore = 0;
  window.regCurrentOcrBase64 = null;
  window.regGeminiApiKey = '';
  window.regScoreBase = 1;
  window.regScoreWarInternal = 1;
  window.regScoreWarInter = 2;
  window.regMemberSearchQuery = '';

  // 🧹 [핵심] 보스참여등록 입력창 및 선택 상태 완전 초기화 함수
  function resetRegisterForm() {
    // 1. 선택 길드원 및 검색어 초기화
    if (window.regSelectedMemberSet) {
      window.regSelectedMemberSet.clear();
    } else {
      window.regSelectedMemberSet = new Set();
    }
    window.regMemberSearchQuery = '';
    const searchInput = document.getElementById("regMemberSearchInput");
    if (searchInput) searchInput.value = '';
    const searchClear = document.getElementById("memberSearchClearBtn");
    if (searchClear) searchClear.style.display = 'none';

    // 2. 보스 선택 초기화
    const bossSelect = document.getElementById("regBossSelect");
    if (bossSelect) bossSelect.value = '';

    // 3. 토벌 일시 현재 KST로 재설정
    setDefaultKstDateTime();

    // 4. 전쟁 구분 및 추가점수 초기화
    window.regCurrentWarType = '일반';
    window.regExtraScore = 0;
    const extraSelect = document.getElementById("regExtraScoreSelect");
    if (extraSelect) extraSelect.value = '0';
    selectWarType('일반');

    // 5. 획득 드랍 아이템 입력창 비우기
    const dropInput = document.getElementById("regDropItemsInput");
    if (dropInput) dropInput.value = '';

    // 6. 스크린샷 AI 인식 영역 초기화
    window.regCurrentOcrBase64 = null;
    const regCard = document.getElementById("ocrRegisteredCard");
    const dropArea = document.getElementById("ocrDropArea");
    const thumb = document.getElementById("ocrThumbImg");
    const fileInput = document.getElementById("ocrFileInput");
    if (regCard) regCard.style.display = "none";
    if (dropArea) dropArea.style.display = "flex";
    if (thumb) thumb.src = "";
    if (fileInput) fileInput.value = "";
    showOcrStatus("", "");

    // 7. 길드원 선택 그리드 및 보스 칩 리렌더링
    renderMemberSelectionGrid();
    renderQuickBossChips();
  }

  // 1. 초기화 함수 (화면 진입 시 무조건 클린 리셋 실행)
  (async function initPageRegister() {
    resetRegisterForm();
    await loadSettingsAndPointRules();
    await loadRegisterBosses();
    await loadRegisterMembers();
    renderQuickBossChips();
    bindClipboardPasteEvent();
  })();

  // 2. KST 현재 시각 기본 세팅
  function setDefaultKstDateTime() {
    const input = document.getElementById("regRaidDateTime");
    if (!input) return;

    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    input.value = `${year}-${month}-${day}T${hours}:${minutes}`;
  }

  // 3. 설정 및 배점 규칙 불러오기
  async function loadSettingsAndPointRules() {
    try {
      if (typeof apiRequest === "function") {
        const res = await apiRequest("guild_settings?select=key,value");
        if (res && res.length > 0) {
          res.forEach(item => {
            if (item.key === 'gemini_api_key' && item.value) {
              window.regGeminiApiKey = item.value;
            }
            if (item.key === 'score_base') window.regScoreBase = parseInt(item.value, 10) || 1;
            if (item.key === 'score_war_internal') window.regScoreWarInternal = parseInt(item.value, 10) || 1;
            if (item.key === 'score_war_inter') window.regScoreWarInter = parseInt(item.value, 10) || 2;
          });
        }
      }

      const keyBadge = document.getElementById("regGeminiKeyBadge");
      if (keyBadge) {
        if (window.regGeminiApiKey) {
          keyBadge.className = "badge bg-success bg-opacity-25 text-success border border-success border-opacity-50";
          keyBadge.innerText = "API 키 준비완료";
        } else {
          keyBadge.className = "badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50";
          keyBadge.innerText = "API 키 미설정";
        }
      }

      // 배점 라벨 동적 업데이트
      const lblNorm = document.getElementById("labelWarScoreNormal");
      const lblInt = document.getElementById("labelWarScoreInternal");
      const lblInter = document.getElementById("labelWarScoreInter");
      if (lblNorm) lblNorm.innerText = `(${window.regScoreBase}점)`;
      if (lblInt) lblInt.innerText = `(+${window.regScoreWarInternal}점)`;
      if (lblInter) lblInter.innerText = `(+${window.regScoreWarInter}점)`;

      updateCalculatedScore();
    } catch (e) {}
  }

  // 4. 보스 목록 로드
  async function loadRegisterBosses() {
    const select = document.getElementById("regBossSelect");
    if (!select) return;

    if (window.cachedBossList && window.cachedBossList.length > 0) {
      window.regCachedBosses = [...window.cachedBossList];
      renderBossOptions();
      renderQuickBossChips();
      return;
    }

    try {
      if (typeof apiRequest === "function") {
        const bosses = await apiRequest("boss_timers?select=id,boss_name,cycle_min,is_fixed,next_spawn_time&order=boss_name.asc");
        if (bosses && bosses.length > 0) {
          window.regCachedBosses = bosses;
          renderBossOptions();
          renderQuickBossChips();
          return;
        }
      }
    } catch (e) {}

    // 기본 보스 폴백 리스트
    window.regCachedBosses = [
      { boss_name: "거대 드레이크" },
      { boss_name: "바포메트" },
      { boss_name: "카스파" },
      { boss_name: "세마" },
      { boss_name: "메르키오르" },
      { boss_name: "발터자르" },
      { boss_name: "네크로맨서" },
      { boss_name: "데스나이트" }
    ];
    renderBossOptions();
    renderQuickBossChips();
  }

  function renderBossOptions() {
    const select = document.getElementById("regBossSelect");
    if (!select) return;
    const currentVal = select.value;
    let html = '<option value="">보스를 선택하세요...</option>';
    window.regCachedBosses.forEach(b => {
      html += `<option value="${b.boss_name}" ${b.boss_name === currentVal ? 'selected' : ''}>${b.boss_name}</option>`;
    });
    select.innerHTML = html;
  }

  // ⚡ 4-1. 보스 원터치 빠른 선택 칩 렌더링
  function renderQuickBossChips() {
    const container = document.getElementById("quickBossChipsContainer");
    if (!container) return;

    const currentSelected = document.getElementById("regBossSelect")?.value || "";

    // 1) 보스타임 목록에서 현재 출현 중이거나 곧 젠되는 보스 우선 추출
    let list = [...(window.cachedBossList || window.regCachedBosses || [])];
    const now = Date.now();

    // 젠 시각 순 정렬
    list.sort((a, b) => {
      const tA = a.next_spawn_time ? new Date(a.next_spawn_time).getTime() : 9999999999999;
      const tB = b.next_spawn_time ? new Date(b.next_spawn_time).getTime() : 9999999999999;
      return tA - tB;
    });

    // 상위 5개 추출
    const topBosses = list.slice(0, 5);

    if (topBosses.length === 0) {
      container.innerHTML = `<span class="text-secondary" style="font-size:0.65rem;">보스 목록 없음</span>`;
      return;
    }

    container.innerHTML = topBosses.map(b => {
      const isSelected = (b.boss_name === currentSelected);
      let isSpawned = false;
      if (b.next_spawn_time) {
        const diff = Math.floor((new Date(b.next_spawn_time).getTime() - now) / 1000);
        if (diff <= 0) isSpawned = true;
      }

      return `
        <button type="button" 
                class="btn-quick-boss-chip ${isSelected ? 'active' : ''} ${isSpawned ? 'spawned' : ''}" 
                onclick="quickSelectBoss('${b.boss_name}')"
                title="${b.boss_name}">
          ${isSpawned ? '🚨' : '⚔️'} ${b.boss_name}
        </button>
      `;
    }).join('');
  }

  function quickSelectBoss(bossName) {
    const select = document.getElementById("regBossSelect");
    if (select) {
      select.value = bossName;
      onBossSelectChange(bossName);
    }
  }

  function onBossSelectChange(val) {
    renderQuickBossChips();
  }

  // 5. 길드원 목록 로드
  async function loadRegisterMembers() {
    if (window.cachedMemberList && window.cachedMemberList.length > 0) {
      window.regCachedMembers = [...window.cachedMemberList];
      sortAndRenderMembers();
    }

    try {
      if (typeof apiRequest === "function") {
        const members = await apiRequest("guild_members?select=id,name,role,job_class&order=name.asc");
        if (members && Array.isArray(members)) {
          window.regCachedMembers = members;
          if (window.cachedMemberList) {
            window.cachedMemberList = members;
          }
          sortAndRenderMembers();
          return;
        }
      }
    } catch (e) {
      console.warn("길드원 목록 실시간 로드 예외:", e);
    }

    if (!window.regCachedMembers || window.regCachedMembers.length === 0) {
      window.regCachedMembers = [];
      renderMemberSelectionGrid();
    }
  }

  function sortAndRenderMembers() {
    window.regCachedMembers.sort((a, b) => {
      const pA = getRolePriority(a.role);
      const pB = getRolePriority(b.role);
      if (pA !== pB) return pA - pB;
      return a.name.localeCompare(b.name, 'ko');
    });

    renderMemberSelectionGrid();
  }

  function getRolePriority(role) {
    const r = String(role || '').trim();
    if (r === '길드장' || r === '길마') return 1;
    if (r === '부길드장' || r === '부길마') return 2;
    if (r === '정예') return 3;
    return 4;
  }

  // 6. 길드원 5열 직사각형 선택 버튼 그리드 (실시간 검색 필터 적용)
  function renderMemberSelectionGrid() {
    const container = document.getElementById("regMemberGridContainer");
    const filterCountElem = document.getElementById("regFilterCountText");
    if (!container) return;

    if (!window.regCachedMembers || window.regCachedMembers.length === 0) {
      container.innerHTML = `
        <div class="text-secondary small text-center py-4 w-100" style="grid-column: 1 / -1; font-size: 0.74rem;">
          <i class="fa-solid fa-circle-exclamation text-warning me-1"></i>
          등록된 길드원이 없습니다. [길드원목록] 메뉴에서 길드원을 등록해주세요.
        </div>
      `;
      if (filterCountElem) filterCountElem.innerText = "총 0명";
      updateSelectedCountUI();
      return;
    }

    const q = (window.regMemberSearchQuery || '').trim().toLowerCase();
    const filteredMembers = q
      ? window.regCachedMembers.filter(m => (m.name || '').toLowerCase().includes(q) || (m.role || '').toLowerCase().includes(q))
      : window.regCachedMembers;

    if (filterCountElem) {
      filterCountElem.innerText = q ? `검색결과 ${filteredMembers.length}명 / 전체 ${window.regCachedMembers.length}명` : `총 ${window.regCachedMembers.length}명`;
    }

    if (filteredMembers.length === 0) {
      container.innerHTML = `
        <div class="text-secondary small text-center py-4 w-100" style="grid-column: 1 / -1; font-size: 0.74rem;">
          <i class="fa-solid fa-magnifying-glass me-1"></i>
          '${escapeHtml(q)}' 검색 결과와 일치하는 길드원이 없습니다.
        </div>
      `;
      updateSelectedCountUI();
      return;
    }

    container.innerHTML = filteredMembers.map(m => {
      const isSelected = window.regSelectedMemberSet.has(m.name);

      return `
        <div class="btn-member-cell ${isSelected ? 'selected' : ''}" 
             onclick="toggleMemberSelection('${m.name}')" 
             title="${m.name} (${m.role || '일반'})">
          ${m.name}
        </div>
      `;
    }).join('');

    updateSelectedCountUI();
  }

  function toggleMemberSelection(name) {
    if (window.regSelectedMemberSet.has(name)) {
      window.regSelectedMemberSet.delete(name);
    } else {
      window.regSelectedMemberSet.add(name);
    }
    renderMemberSelectionGrid();
  }

  function selectAllMembers(isSelectAll) {
    if (isSelectAll) {
      // 현재 필터링된 멤버가 있으면 검색된 멤버만 선택, 없으면 전체 선택
      const q = (window.regMemberSearchQuery || '').trim().toLowerCase();
      const targetList = q
        ? window.regCachedMembers.filter(m => (m.name || '').toLowerCase().includes(q))
        : window.regCachedMembers;

      targetList.forEach(m => window.regSelectedMemberSet.add(m.name));
    } else {
      window.regSelectedMemberSet.clear();
    }
    renderMemberSelectionGrid();
  }

  // 🔍 6-1. 길드원 실시간 검색 처리
  function onMemberSearchInput(val) {
    window.regMemberSearchQuery = val;
    const clearBtn = document.getElementById("memberSearchClearBtn");
    if (clearBtn) {
      clearBtn.style.display = val ? "block" : "none";
    }
    renderMemberSelectionGrid();
  }

  function clearMemberSearch() {
    const input = document.getElementById("regMemberSearchInput");
    if (input) input.value = "";
    onMemberSearchInput("");
    if (input) input.focus();
  }

  // 🕒 6-2. [직전참여자] 최근 토벌 참여자 그대로 불러오기
  async function loadLastRaidMembers() {
    try {
      if (typeof apiRequest !== "function") return;
      const raids = await apiRequest("boss_participations?select=boss_name,members,war_type&order=id.desc&limit=1");
      if (!raids || raids.length === 0) {
        return showKakaoToast("이전 토벌 기록이 존재하지 않습니다.", "⚠️");
      }

      const lastRaid = raids[0];
      const members = Array.isArray(lastRaid.members) ? lastRaid.members : [];
      if (members.length === 0) {
        return showKakaoToast("최근 토벌에 등록된 참여자가 없습니다.", "⚠️");
      }

      // 기존 선택 지우고 직전 참여자 명단으로 대체
      window.regSelectedMemberSet.clear();
      members.forEach(m => window.regSelectedMemberSet.add(m));

      // 보스도 직전 보스로 자동 세팅
      if (lastRaid.boss_name) {
        const select = document.getElementById("regBossSelect");
        if (select) {
          select.value = lastRaid.boss_name;
          onBossSelectChange(lastRaid.boss_name);
        }
      }

      renderMemberSelectionGrid();
      showKakaoToast(`[${lastRaid.boss_name || '보스'}] 직전 참여자 ${members.length}명을 불러왔습니다!`, "🎯");
    } catch (err) {
      showKakaoToast("직전 참여자 로드 실패: " + err.message, "❌");
    }
  }

  function updateSelectedCountUI() {
    const el = document.getElementById("regSelectedCountText");
    if (el) el.innerText = window.regSelectedMemberSet.size;
  }

  // 7. 전쟁 구분 & 추가점수 & 최종 점수 계산
  function selectWarType(type) {
    window.regCurrentWarType = type;

    document.getElementById("badgeWarNormal").classList.toggle("active", type === '일반');
    document.getElementById("badgeWarInternal").classList.toggle("active", type === '내전');
    document.getElementById("badgeWarInter").classList.toggle("active", type === '인터');

    updateCalculatedScore();
  }

  function onExtraScoreChange(val) {
    window.regExtraScore = parseInt(val, 10) || 0;
    updateCalculatedScore();
  }

  function updateCalculatedScore() {
    let score = window.regScoreBase || 1;

    if (window.regCurrentWarType === '내전') {
      const add = window.regScoreWarInternal || 1;
      score += add;
    } else if (window.regCurrentWarType === '인터') {
      const add = window.regScoreWarInter || 2;
      score += add;
    }

    score += (window.regExtraScore || 0);

    const scoreValElem = document.getElementById("regScoreValueText");
    if (scoreValElem) {
      scoreValElem.innerText = `${score}점`;
    }
  }

  // 8. 클립보드 붙여넣기 & 스크린샷 이미지 처리
  function bindClipboardPasteEvent() {
    window.__pasteHandler = function(e) {
      if (!e.clipboardData || !e.clipboardData.items) return;
      for (let i = 0; i < e.clipboardData.items.length; i++) {
        const item = e.clipboardData.items[i];
        if (item.type.indexOf("image") !== -1) {
          const file = item.getAsFile();
          handleImageFileSelected(file);
          break;
        }
      }
    };
    window.addEventListener("paste", window.__pasteHandler);

    const dropArea = document.getElementById("ocrDropArea");
    if (dropArea) {
      ['dragenter', 'dragover'].forEach(name => {
        dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = '#a855f7'; }, false);
      });
      ['dragleave', 'drop'].forEach(name => {
        dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = 'rgba(168, 85, 247, 0.4)'; }, false);
      });
      dropArea.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleImageFileSelected(e.dataTransfer.files[0]);
        }
      });
    }

    // 🧹 모듈 화면을 닫거나 나갈 때(뒤로가기 등) 호출되는 클린업 훅
    window.__currentModuleCleanup = function() {
      if (window.__pasteHandler) {
        window.removeEventListener("paste", window.__pasteHandler);
      }
      resetRegisterForm(); // 화면 나갈 때 깨끗이 리셋!
    };
  }

  function handleImageFileSelected(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      window.regCurrentOcrBase64 = e.target.result;
      
      const thumb = document.getElementById("ocrThumbImg");
      const nameElem = document.getElementById("ocrFileName");
      const regCard = document.getElementById("ocrRegisteredCard");
      const dropArea = document.getElementById("ocrDropArea");

      if (thumb) thumb.src = window.regCurrentOcrBase64;
      if (nameElem) nameElem.innerText = file.name || "스크린샷.png";
      
      if (regCard) regCard.style.display = "flex";
      if (dropArea) dropArea.style.display = "none";

      showOcrStatus("📷 이미지가 준비되었습니다. [분석 시작] 버튼을 눌러주세요.", "info");
    };
    reader.readAsDataURL(file);
  }

  function triggerReupload() {
    window.regCurrentOcrBase64 = null;
    const regCard = document.getElementById("ocrRegisteredCard");
    const dropArea = document.getElementById("ocrDropArea");
    const thumb = document.getElementById("ocrThumbImg");
    const fileInput = document.getElementById("ocrFileInput");

    if (regCard) regCard.style.display = "none";
    if (dropArea) dropArea.style.display = "flex";
    if (thumb) thumb.src = "";
    if (fileInput) fileInput.value = "";
    showOcrStatus("", "");
    document.getElementById('ocrFileInput').click();
  }

  function showOcrStatus(msg, type = "info") {
    const el = document.getElementById("ocrStatusMsg");
    if (!el) return;
    if (!msg) {
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    el.innerText = msg;
    if (type === "error") el.className = "mt-1 text-center small text-danger fw-bold";
    else if (type === "success") el.className = "mt-1 text-center small text-success fw-bold";
    else el.className = "mt-1 text-center small text-secondary";
  }

  // 9. Gemini Flash AI OCR 분석 실행
  async function executeGeminiOcrAnalysis() {
    if (!window.regCurrentOcrBase64) {
      await showRegAlert("먼저 스크린샷 이미지를 붙여넣기(Ctrl+V)하거나 업로드하세요!", "⚠️", "이미지 확인");
      return;
    }

    if (!window.regGeminiApiKey && typeof apiRequest === "function") {
      try {
        const res = await apiRequest("guild_settings?key=eq.gemini_api_key");
        if (res && res.length > 0 && res[0].value) {
          window.regGeminiApiKey = res[0].value;
        }
      } catch (e) {}
    }

    if (!window.regGeminiApiKey) {
      await showRegAlert("Gemini API 키가 등록되지 않았습니다!\n[설정] > [보안] 탭에서 Gemini AI OCR API 키를 먼저 등록해주세요.", "⚠️", "API 키 설정 필요");
      return;
    }

    const btn = document.getElementById("btnRunAiOcr");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 분석 중...`;
    }

    showOcrStatus("🔍 AI가 스크린샷 속 길드원 닉네임을 분석하고 있습니다...", "info");

    try {
      const commaIdx = window.regCurrentOcrBase64.indexOf(",");
      const rawBase64 = (commaIdx !== -1) ? window.regCurrentOcrBase64.slice(commaIdx + 1) : window.regCurrentOcrBase64;
      const mimeType = window.regCurrentOcrBase64.substring(5, commaIdx).split(';')[0] || "image/jpeg";

      const promptText = `이 이미지는 모바일/PC 게임의 파티/토벌/기여도 참여자 목록 스크린샷입니다. 
화면에 나타난 모든 플레이어/길드원 캐릭터 닉네임을 정확히 추출하세요. 
출력은 다른 설명 없이 오직 순수한 JSON 문자열 배열 형태만 출력하세요. 
예시: ["홍길동", "이순신", "강감찬"]`;

      const requestUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${window.regGeminiApiKey}`;
      
      const response = await fetch(requestUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: mimeType, data: rawBase64 } }
            ]
          }],
          generationConfig: {
            temperature: 0.1,
            response_mime_type: "application/json"
          }
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `API 요청 실패 (${response.status})`);
      }

      const resData = await response.json();
      const rawContent = resData.candidates?.[0]?.content?.parts?.[0]?.text || "[]";

      let extractedNames = [];
      try {
        extractedNames = JSON.parse(rawContent);
      } catch (e) {
        const match = rawContent.match(/\[[\s\S]*\]/);
        if (match) extractedNames = JSON.parse(match[0]);
      }

      if (!Array.isArray(extractedNames) || extractedNames.length === 0) {
        showOcrStatus("⚠️ 이미지에서 인식된 닉네임이 없습니다. 버튼을 직접 클릭해 선택해주세요.", "error");
        return;
      }

      let matchedCount = 0;
      extractedNames.forEach(name => {
        if (!name) return;
        const cleanName = String(name).trim();
        const matched = window.regCachedMembers.find(m => 
          m.name.toLowerCase() === cleanName.toLowerCase() ||
          cleanName.includes(m.name) ||
          m.name.includes(cleanName)
        );

        if (matched) {
          window.regSelectedMemberSet.add(matched.name);
          matchedCount++;
        }
      });

      renderMemberSelectionGrid();

      showOcrStatus(`🎉 인식 완료! 길드원 ${matchedCount}명이 자동 선택되었습니다.`, "success");
      if (typeof showKakaoToast === "function") {
        showKakaoToast(`[AI 인식] 길드원 ${matchedCount}명 자동 선택!`, "🎯");
      }
    } catch (err) {
      showOcrStatus(`❌ AI 분석 실패: ${err.message}`, "error");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> 분석 시작`;
      }
    }
  }

  // 10. 토벌 완료 등록 및 현재 대화방 공유
  async function executeBossRaidRegistration() {
    const bossSelect = document.getElementById("regBossSelect");
    const selectedBoss = bossSelect ? bossSelect.value.trim() : "";
    const raidTimeVal = document.getElementById("regRaidDateTime")?.value;
    const dropItemsVal = document.getElementById("regDropItemsInput")?.value.trim() || "";
    const btnSubmit = document.getElementById("btnSubmitRaidRegister");

    if (!selectedBoss) {
      await showRegAlert("토벌한 보스를 선택해주세요!", "⚠️", "보스 선택");
      bossSelect.focus();
      return;
    }

    if (window.regSelectedMemberSet.size === 0) {
      await showRegAlert("참여한 길드원을 최소 1명 이상 선택해주세요!", "⚠️", "참여자 선택");
      return;
    }

    const myNick = localStorage.getItem("guild_my_nickname") || "길드원";
    const selectedMembersArray = Array.from(window.regSelectedMemberSet);

    let calculatedScore = window.regScoreBase || 1;
    if (window.regCurrentWarType === '내전') calculatedScore += (window.regScoreWarInternal || 1);
    else if (window.regCurrentWarType === '인터') calculatedScore += (window.regScoreWarInter || 2);
    calculatedScore += (window.regExtraScore || 0);

    let raidTimeIso = new Date().toISOString();
    if (raidTimeVal) {
      const parsedTime = new Date(raidTimeVal);
      if (!isNaN(parsedTime.getTime())) raidTimeIso = parsedTime.toISOString();
    }

    const userConfirmed = await showRegConfirm(`[${selectedBoss}] 토벌 참여자 총 ${selectedMembersArray.length}명을 등록하고\n현재 대화방에 즉시 공유하시겠습니까?`, "⚔️", "토벌 등록 및 대화방 공유");
    if (!userConfirmed) {
      return;
    }

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> 등록 및 대화방 공유 중...`;
    }

    try {
      let insertedRaidId = Date.now();
      if (typeof apiRequest === "function") {
        const raidInsertData = {
          boss_name: selectedBoss,
          raid_time: raidTimeIso,
          war_type: window.regCurrentWarType,
          score: calculatedScore,
          members: selectedMembersArray,
          member_count: selectedMembersArray.length,
          drop_items: dropItemsVal,
          created_at: new Date().toISOString()
        };

        let insertRaidRes = null;
        try {
          insertRaidRes = await apiRequest("boss_participations", "POST", [{
            ...raidInsertData,
            created_by: myNick
          }]);
        } catch (postErr) {
          if (String(postErr?.message || '').includes('created_by')) {
            insertRaidRes = await apiRequest("boss_participations", "POST", [raidInsertData]);
          } else {
            throw postErr;
          }
        }

        if (insertRaidRes && insertRaidRes.length > 0 && insertRaidRes[0].id) {
          insertedRaidId = insertRaidRes[0].id;
        }

        const raidPayload = {
          raid_id: insertedRaidId,
          boss_name: selectedBoss,
          raid_time: formatTimeForChat(raidTimeIso),
          war_type: window.regCurrentWarType,
          score: calculatedScore,
          extra_score: window.regExtraScore || 0,
          drop_items: dropItemsVal,
          members: selectedMembersArray,
          member_count: selectedMembersArray.length,
          created_at: new Date().toISOString()
        };

        await apiRequest("guild_chats", "POST", [{
          sender_name: "토벌알리미",
          message: JSON.stringify(raidPayload),
          msg_type: "raid_report",
          mentions: []
        }]);
      }

      if (typeof showKakaoToast === "function") {
        showKakaoToast(`[${selectedBoss}] 토벌이 등록되어 대화방에 공유되었습니다!`, "🎉");
      } else {
        await showRegAlert(`[${selectedBoss}] 토벌이 등록되어 대화방에 공유되었습니다!`, "🎉", "토벌 등록 완료");
      }

      // 🧹 등록 완료 시 폼 데이터 깨끗이 리셋 후 대화방으로 복귀
      resetRegisterForm();

      if (typeof closeModuleOverlay === "function") {
        closeModuleOverlay();
      }
    } catch (err) {
      await showRegAlert("토벌 등록 실패: " + (err.message || "알 수 없는 오류"), "❌", "등록 실패");
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> 토벌 등록 및 대화방 공유`;
      }
    }
  }

  function formatTimeForChat(isoString) {
    try {
      const d = new Date(isoString);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${m}/${day} ${h}:${min}`;
    } catch (e) {
      return "";
    }
  }

  function escapeHtml(text) {
    return (text || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }
</script>
