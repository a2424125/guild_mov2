<script>
  // ==========================================
  // [완벽 방어] safeApiRequest: window.apiRequest 누락 방지 내장
  // ==========================================
  async function safeApiRequest(endpoint, method = "GET", body = null, extraHeaders = {}) {
    if (typeof window.apiRequest === "function") {
      return await window.apiRequest(endpoint, method, body, extraHeaders);
    }

    const config = window.SUPABASE_CONFIG || {
      url: "https://vwmfehfmtzyvronvdxvt.supabase.co",
      anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bWZlaGZtdHp5dnJvbnZkeHZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTgwODIsImV4cCI6MjEwNzE5NDA4Mn0.-C6FfESuRVsERAymSTJf7i8FPMYYE7eMKIhvJadyjkQ"
    };

    const url = `${config.url}/rest/v1/${endpoint}`;
    const headers = {
      "apikey": config.anonKey,
      "Authorization": `Bearer ${config.anonKey}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
      ...extraHeaders
    };

    const options = { method, headers };
    if (body) options.body = JSON.stringify(body);

    const res = await fetch(url, options);
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || `HTTP ${res.status}`);
    }
    if (res.status === 204) return null;
    return await res.json();
  }

  var rawMemberListData = [];
  var targetMemberPinObject = null;
  var kakaoToastTimer = null;

  function showKakaoToast(msg, icon = "💬") {
    const box = document.getElementById("kakaoToastBox");
    const m = document.getElementById("kakaoToastMsg");
    const ic = document.getElementById("kakaoToastIcon");
    if (!box) return;

    m.innerText = msg;
    ic.innerText = icon;
    box.classList.add("show");

    if (kakaoToastTimer) clearTimeout(kakaoToastTimer);
    kakaoToastTimer = setTimeout(() => box.classList.remove("show"), 2300);
  }

  function getRoleSortPriority(role) {
    const r = String(role || '').trim();
    if (r === '길드장' || r === '길마') return 1;
    if (r === '부길드장' || r === '부길마') return 2;
    if (r === '정예') return 3;
    return 4;
  }

  async function loadAllMembersList() {
    const container = document.getElementById("friendsScrollContainer");
    container.innerHTML = `<div class="text-secondary small text-center py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>친구 목록 동기화 중...</div>`;

    try {
      const members = await safeApiRequest("guild_members?select=*");
      rawMemberListData = members || [];

      rawMemberListData.sort((a, b) => {
        const pA = getRoleSortPriority(a.role);
        const pB = getRoleSortPriority(b.role);
        if (pA !== pB) return pA - pB;
        return a.name.localeCompare(b.name, 'ko', { numeric: true, sensitivity: 'base' });
      });

      document.getElementById("memHeaderCountText").innerText = rawMemberListData.length;
      renderMemberCards(rawMemberListData);

    } catch (err) {
      container.innerHTML = `<div class="text-danger small text-center py-5">조회 실패: ${err.message}</div>`;
    }
  }

  function renderMemberCards(list) {
    const container = document.getElementById("friendsScrollContainer");
    if (!list || list.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-5">등록된 길드원이 없습니다.</div>';
      return;
    }

    const currentMyNick = localStorage.getItem("guild_my_nickname") || "";

    container.innerHTML = list.map(m => {
      const roleStr = String(m.role || '일반').trim();
      let roleTagClass = "role-tag-normal";
      let avatarClass = "";

      if (roleStr === "길드장" || roleStr === "길마") {
        roleTagClass = "role-tag-master";
        avatarClass = "master";
      } else if (roleStr === "부길드장" || roleStr === "부길마") {
        roleTagClass = "role-tag-sub";
        avatarClass = "sub";
      } else if (roleStr === "정예") {
        roleTagClass = "role-tag-elite";
      }

      const initial = m.name.charAt(0);
      const isMe = (m.name === currentMyNick);

      return `
        <div class="friend-profile-row">
          <div class="friend-left-info" onclick="openPinChangePopup(${m.id})">
            <div class="friend-avatar-round ${avatarClass}">${initial}</div>
            <div class="friend-meta-text">
              <div class="friend-name-line">
                <span>${m.name}</span>
                <span class="badge-friend-role ${roleTagClass}">${roleStr}</span>
                ${isMe ? '<span class="badge bg-warning text-dark px-1" style="font-size:0.6rem;">나</span>' : ''}
              </div>
              <span class="text-secondary" style="font-size: 0.68rem;">클릭하여 비밀번호 변경</span>
            </div>
          </div>
          <div class="friend-action-tools">
            <button type="button" class="btn-mini-tool" onclick="openEditMemberPopup(${m.id}, '${m.name}', '${roleStr}')">수정</button>
            <button type="button" class="btn-mini-tool text-danger" onclick="deleteMemberRow(${m.id}, '${m.name}')">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterMemberRows() {
    const q = document.getElementById("inputSearchMember").value.trim().toLowerCase();
    const filtered = rawMemberListData.filter(m => m.name.toLowerCase().includes(q) || (m.role || "").toLowerCase().includes(q));
    renderMemberCards(filtered);
  }

  // 1. 길드원 등록 팝업 제어
  function openAddMemberPopup() {
    document.getElementById("newMemberNickInput").value = "";
    document.getElementById("newMemberRoleSelect").value = "일반";
    document.getElementById("modalKakaoAddMember").style.display = "flex";
    setTimeout(() => document.getElementById("newMemberNickInput").focus(), 100);
  }
  function closeAddMemberPopup() {
    document.getElementById("modalKakaoAddMember").style.display = "none";
  }

  async function submitAddMemberAction() {
    const name = document.getElementById("newMemberNickInput").value.trim();
    const role = document.getElementById("newMemberRoleSelect").value;

    if (!name) return showKakaoToast("길드원 닉네임을 입력해주세요!", "⚠️");
    if (rawMemberListData.some(m => m.name === name)) {
      return showKakaoToast("이미 존재하는 닉네임입니다!", "⚠️");
    }

    try {
      await safeApiRequest("guild_members", "POST", [{ name, role, pin: "0000" }]);
      showKakaoToast(`[${name}] 길드원 등록 완료!`, "🎉");
      closeAddMemberPopup();
      await loadAllMembersList();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      showKakaoToast("등록 실패: " + err.message, "❌");
    }
  }

  // 2. 정보 수정 팝업 제어
  function openEditMemberPopup(id, name, role) {
    document.getElementById("editTargetMemberId").value = id;
    document.getElementById("editTargetOldNick").value = name;
    document.getElementById("editTargetNewNickInput").value = name;
    document.getElementById("editTargetRoleSelect").value = role;
    document.getElementById("modalKakaoEditMember").style.display = "flex";
  }
  function closeEditMemberPopup() {
    document.getElementById("modalKakaoEditMember").style.display = "none";
  }

  async function submitEditMemberAction() {
    const id = document.getElementById("editTargetMemberId").value;
    const oldName = document.getElementById("editTargetOldNick").value.trim();
    const newName = document.getElementById("editTargetNewNickInput").value.trim();
    const role = document.getElementById("editTargetRoleSelect").value;

    if (!newName) return showKakaoToast("닉네임을 입력하세요!", "⚠️");

    try {
      if (oldName !== newName) {
        await safeApiRequest("rpc/update_member_nickname", "POST", { old_name: oldName, new_name: newName });
      }
      await safeApiRequest(`guild_members?id=eq.${id}`, "PATCH", { role, name: newName });

      showKakaoToast(`[${newName}] 정보가 수정되었습니다!`, "✅");
      closeEditMemberPopup();
      await loadAllMembersList();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      showKakaoToast("수정 실패: " + err.message, "❌");
    }
  }

  // 3. 삭제
  async function deleteMemberRow(id, name) {
    if (!confirm(`[${name}] 길드원을 정말 삭제하시겠습니까?`)) return;

    try {
      await safeApiRequest(`guild_members?id=eq.${id}`, "DELETE");
      showKakaoToast(`[${name}] 길드원이 삭제되었습니다.`, "🗑️");
      await loadAllMembersList();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      showKakaoToast("삭제 실패: " + err.message, "❌");
    }
  }

  // 4. 개인 비밀번호(PIN) 변경
  function openPinChangePopup(memberId) {
    const target = rawMemberListData.find(m => m.id === memberId);
    if (!target) return;

    targetMemberPinObject = target;
    document.getElementById("pinTargetNickText").innerText = `[${target.name}] 비밀번호 변경`;
    
    const existingPin = (target.pin || "").trim();
    const hint = document.getElementById("oldPinHintMessage");
    if (!existingPin || existingPin === "0000") {
      hint.innerText = "초기 상태입니다. 기존 비밀번호에 0000을 입력하세요.";
    } else {
      hint.innerText = "현재 사용 중인 비밀번호를 입력해주세요.";
    }

    document.getElementById("inputOldPinValue").value = "";
    document.getElementById("inputNewPinValue").value = "";
    document.getElementById("modalKakaoPinChange").style.display = "flex";
  }
  function closePinChangePopup() {
    document.getElementById("modalKakaoPinChange").style.display = "none";
    targetMemberPinObject = null;
  }

  async function submitPinChangeAction() {
    if (!targetMemberPinObject) return;

    const oldPin = document.getElementById("inputOldPinValue").value.trim();
    const newPin = document.getElementById("inputNewPinValue").value.trim();
    const currentPin = (targetMemberPinObject.pin || "0000").trim();

    if (oldPin !== currentPin) {
      return showKakaoToast("기존 비밀번호가 일치하지 않습니다! (초기값: 0000)", "❌");
    }

    if (!/^\d+$/.test(newPin) || newPin.length < 6) {
      return showKakaoToast("새 비밀번호는 숫자 6자리 이상이어야 합니다.", "⚠️");
    }

    if (/(\d)\1\1/.test(newPin)) {
      return showKakaoToast("동일한 숫자를 3회 이상 연속 사용할 수 없습니다 (예: 000)", "⚠️");
    }

    try {
      await safeApiRequest(`guild_members?id=eq.${targetMemberPinObject.id}`, "PATCH", { pin: newPin });
      showKakaoToast(`[${targetMemberPinObject.name}] 비밀번호 변경 완료!`, "🎉");
      closePinChangePopup();
      await loadAllMembersList();
    } catch (err) {
      showKakaoToast("변경 실패: " + err.message, "❌");
    }
  }

  (function initMembersPage() {
    loadAllMembersList();
  })();
</script>
