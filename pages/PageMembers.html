<!-- ==========================================
     [길드 메신저] 길드원 관리 모듈
     경로: pages/PageMembers.html
     ========================================== -->
<style>
  .members-drawer-container {
    background: #ffffff;
    height: 100%;
    display: flex;
    flex-direction: column;
    color: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  /* 서랍 상단 헤더 바 */
  .members-top-bar {
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
    background: #f7f7f7;
    flex-shrink: 0;
  }
  .members-title-area {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.98rem;
    font-weight: 800;
    color: #191919;
  }
  .members-top-tools {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-member-tool-icon {
    background: none;
    border: none;
    color: #475569;
    font-size: 0.95rem;
    padding: 6px;
    cursor: pointer;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .btn-member-tool-icon:hover {
    background: #e2e8f0;
    color: #0f172a;
  }

  /* 검색 입력창 */
  .members-search-box {
    padding: 8px 14px;
    background: #ffffff;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
    position: relative;
  }
  .members-search-input {
    width: 100%;
    background: #f4f5f7;
    border: none;
    border-radius: 16px;
    padding: 7px 12px 7px 32px;
    font-size: 0.8rem;
    color: #191919;
    outline: none;
  }
  .members-search-input::placeholder {
    color: #94a3b8;
  }

  /* 친구 리스트 스크롤 영역 */
  .members-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    background: #ffffff;
    max-height: 540px;
  }
  .members-scroll-area::-webkit-scrollbar { width: 4px; }
  .members-scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* 카카오톡 프로필 행 아이템 */
  .member-profile-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .member-profile-row:hover {
    background: #f8fafc;
  }

  .member-left-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .member-avatar-round {
    width: 38px;
    height: 38px;
    border-radius: 14px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.05rem;
    color: #3b82f6;
    flex-shrink: 0;
    position: relative;
  }
  .member-avatar-round.master {
    background: #fef08a;
    border-color: #eab308;
    color: #854d0e;
  }
  .member-avatar-round.sub {
    background: #f3e8ff;
    border-color: #c084fc;
    color: #6b21a8;
  }

  .member-meta-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .member-name-line {
    font-size: 0.86rem;
    font-weight: 700;
    color: #191919;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge-member-role {
    font-size: 0.62rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .role-tag-master { background: #fef08a; color: #854d0e; }
  .role-tag-sub { background: #f3e8ff; color: #6b21a8; }
  .role-tag-elite { background: #e0f2fe; color: #0369a1; }
  .role-tag-normal { background: #f1f5f9; color: #64748b; }

  .member-class-desc {
    font-size: 0.68rem;
    font-weight: 600;
    color: #0284c7;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .member-action-tools {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .btn-mini-member-tool {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #475569;
    font-size: 0.68rem;
    padding: 3px 7px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.12s ease;
  }
  .btn-mini-member-tool:hover {
    background: #f1f5f9;
    color: #0f172a;
    border-color: #94a3b8;
  }

  /* 카카오톡 스타일 커스텀 모달 다이얼로그 */
  .member-custom-modal-backdrop {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.45);
    z-index: 9999999;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .member-custom-modal-card {
    background: #ffffff;
    border-radius: 14px;
    width: 100%; max-width: 310px;
    padding: 20px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    color: #191919;
    text-align: center;
  }
  .member-modal-title {
    font-weight: 800;
    font-size: 0.96rem;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .member-modal-sub {
    font-size: 0.73rem;
    color: #64748b;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .member-input-text {
    width: 100%;
    background: #f7f7f7;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.84rem;
    color: #191919;
    outline: none;
    margin-bottom: 8px;
  }
  .member-input-text:focus {
    border-color: #fee500;
    background: #ffffff;
  }
</style>

<div class="members-drawer-container">
  <!-- 1. 서랍 상단 헤더 바 -->
  <div class="members-top-bar">
    <div class="members-title-area">
      <i class="fa-solid fa-users text-primary"></i>
      <span>길드원 목록 (<span id="membersCountText">0</span>)</span>
    </div>
    <div class="members-top-tools">
      <button type="button" class="btn-member-tool-icon" title="길드원 등록" onclick="openAddMemberModalView()">
        <i class="fa-solid fa-user-plus text-primary"></i>
      </button>
      <button type="button" class="btn-member-tool-icon" title="새로고침" onclick="loadGuildMembersPageView()">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
    </div>
  </div>

  <!-- 2. 실시간 닉네임 / 직급 검색창 -->
  <div class="members-search-box">
    <i class="fa-solid fa-magnifying-glass position-absolute" style="left: 24px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.78rem;"></i>
    <input type="text" id="inputSearchMemberPage" class="members-search-input" placeholder="길드원 닉네임 검색..." onkeyup="filterMemberPageView()">
  </div>

  <!-- 3. 길드원 목록 스크롤 영역 -->
  <div class="members-scroll-area" id="membersListScrollContainer">
    <div class="text-secondary small text-center py-5">길드원 목록을 동기화하는 중...</div>
  </div>
</div>

<!-- 모달 1: 신규 길드원 등록 -->
<div id="modalPageAddMember" class="member-custom-modal-backdrop" style="display: none;">
  <div class="member-custom-modal-card">
    <div class="member-modal-title">
      <i class="fa-solid fa-user-plus text-primary"></i>
      <span>신규 길드원 등록</span>
    </div>
    <div class="member-modal-sub">등록 즉시 로그인 및 채팅 명단에 반영됩니다.</div>

    <input type="text" id="newMemberNickInputPage" class="member-input-text" placeholder="길드원 닉네임 입력" autocomplete="off">
    
    <select id="newMemberRoleSelectPage" class="member-input-text mb-3">
      <option value="일반" selected>일반</option>
      <option value="정예">정예</option>
      <option value="부길드장">부길드장</option>
      <option value="길드장">길드장</option>
    </select>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-light btn-sm flex-fill py-2" style="border: 1px solid #cbd5e1; font-weight: 700;" onclick="closeAddMemberModalView()">취소</button>
      <button type="button" class="btn btn-warning btn-sm flex-fill py-2" style="background:#fee500; border:none; font-weight: 800; color:#191919;" onclick="submitAddMemberModalView()">등록하기</button>
    </div>
  </div>
</div>

<!-- 모달 2: 정보 수정 (직급/닉네임) -->
<div id="modalPageEditMember" class="member-custom-modal-backdrop" style="display: none;">
  <div class="member-custom-modal-card">
    <div class="member-modal-title">
      <i class="fa-solid fa-user-pen text-info"></i>
      <span>길드원 정보 수정</span>
    </div>
    <div class="member-modal-sub">닉네임 변경 시 기존 모든 토벌 참여 이력도 함께 동기화됩니다.</div>

    <input type="hidden" id="editPageMemberId">
    <input type="hidden" id="editPageMemberOldNick">

    <label class="small text-secondary mb-1 w-100 text-start" style="font-size: 0.72rem;">닉네임</label>
    <input type="text" id="editPageMemberNewNick" class="member-input-text">

    <label class="small text-secondary mb-1 w-100 text-start" style="font-size: 0.72rem;">직급</label>
    <select id="editPageMemberRole" class="member-input-text mb-3">
      <option value="일반">일반</option>
      <option value="정예">정예</option>
      <option value="부길드장">부길드장</option>
      <option value="길드장">길드장</option>
    </select>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-light btn-sm flex-fill py-2" style="border: 1px solid #cbd5e1; font-weight: 700;" onclick="closeEditMemberModalView()">취소</button>
      <button type="button" class="btn btn-warning btn-sm flex-fill py-2" style="background:#fee500; border:none; font-weight: 800; color:#191919;" onclick="submitEditMemberModalView()">저장</button>
    </div>
  </div>
</div>

<!-- 모달 3: 개인 비밀번호(PIN) 변경 -->
<div id="modalPagePinChange" class="member-custom-modal-backdrop" style="display: none;">
  <div class="member-custom-modal-card">
    <div class="member-modal-title">
      <i class="fa-solid fa-key text-warning"></i>
      <span id="pinTargetNickTextPage">비밀번호 변경</span>
    </div>
    <div class="member-modal-sub" id="oldPinHintMessagePage">기존 비밀번호와 새 비밀번호를 입력하세요.</div>

    <input type="password" id="inputOldPinPage" class="member-input-text text-center" placeholder="기존 비밀번호 (초기값 0000)" maxlength="16" inputmode="numeric">
    <input type="password" id="inputNewPinPage" class="member-input-text text-center mb-3" placeholder="새 비밀번호 (숫자 6자리 이상)" maxlength="16" inputmode="numeric">

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-light btn-sm flex-fill py-2" style="border: 1px solid #cbd5e1; font-weight: 700;" onclick="closePinChangeModalView()">취소</button>
      <button type="button" class="btn btn-warning btn-sm flex-fill py-2" style="background:#fee500; border:none; font-weight: 800; color:#191919;" onclick="submitPinChangeModalView()">변경 완료</button>
    </div>
  </div>
</div>

<script>
  var pageMembersDataList = [];
  var pagePinTargetMember = null;

  function getMemberSortPriority(role) {
    const r = String(role || '').trim();
    if (r === '길드장' || r === '길마') return 1;
    if (r === '부길드장' || r === '부길마') return 2;
    if (r === '정예') return 3;
    return 4;
  }

  async function loadGuildMembersPageView() {
    const container = document.getElementById("membersListScrollContainer");
    if (!container) return;

    container.innerHTML = `<div class="text-secondary small text-center py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>목록 불러오는 중...</div>`;

    try {
      const members = await apiRequest("guild_members?select=*");
      pageMembersDataList = members || [];

      pageMembersDataList.sort((a, b) => {
        const pA = getMemberSortPriority(a.role);
        const pB = getMemberSortPriority(b.role);
        if (pA !== pB) return pA - pB;
        return a.name.localeCompare(b.name, 'ko', { numeric: true, sensitivity: 'base' });
      });

      document.getElementById("membersCountText").innerText = pageMembersDataList.length;
      renderMemberCardsPageView(pageMembersDataList);

    } catch (err) {
      container.innerHTML = `<div class="text-danger small text-center py-5">조회 실패: ${err.message}</div>`;
    }
  }

  function renderMemberCardsPageView(list) {
    const container = document.getElementById("membersListScrollContainer");
    if (!container) return;

    if (!list || list.length === 0) {
      container.innerHTML = '<div class="text-secondary small text-center py-5">등록된 길드원이 없습니다.</div>';
      return;
    }

    const myNick = localStorage.getItem("guild_my_nickname") || "";
    const myAvatar = localStorage.getItem("guild_my_avatar") || "👤";
    const myClass = localStorage.getItem("guild_my_class") || "직업 미설정";

    container.innerHTML = list.map(m => {
      const roleStr = String(m.role || '일반').trim();
      let roleTagClass = "role-tag-normal";
      let avatarClass = "";

      if (roleStr === "길드장" || roleStr === "길마") {
        roleTagClass = "role-tag-master";
        avatarClass = "master";
      } else if (roleStr === "부길드장" || roleStr === "부길마") {
        roleTagClass = "role-tag-sub";
        avatarClass = "sub";
      } else if (roleStr === "정예") {
        roleTagClass = "role-tag-elite";
      }

      const isMe = (m.name === myNick);
      const displayAvatar = isMe ? myAvatar : (m.avatar || m.name.charAt(0));
      const displayClass = isMe ? myClass : (m.job_class || '직업 미설정');

      return `
        <div class="member-profile-row">
          <div class="member-left-info" onclick="openPinChangeModalView(${m.id})">
            <div class="member-avatar-round ${avatarClass}">
              ${displayAvatar}
              ${isMe ? '<div style="position:absolute; top:-3px; left:-4px; background:#f59e0b; color:#ffffff; font-size:0.55rem; font-weight:900; padding:1px 3px; border-radius:7px; border:1px solid #ffffff; line-height:1;">나</div>' : ''}
            </div>
            <div class="member-meta-text">
              <div class="member-name-line">
                <span>${m.name}</span>
                <span class="badge-member-role ${roleTagClass}">${roleStr}</span>
              </div>
              <div class="member-class-desc">
                <span>${displayClass}</span>
              </div>
            </div>
          </div>
          <div class="member-action-tools">
            <button type="button" class="btn-mini-member-tool" onclick="openEditMemberModalView(${m.id}, '${m.name}', '${roleStr}')">수정</button>
            <button type="button" class="btn-mini-member-tool text-danger" onclick="deleteMemberActionView(${m.id}, '${m.name}')">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterMemberPageView() {
    const q = document.getElementById("inputSearchMemberPage").value.trim().toLowerCase();
    const filtered = pageMembersDataList.filter(m => m.name.toLowerCase().includes(q) || (m.role || "").toLowerCase().includes(q));
    renderMemberCardsPageView(filtered);
  }

  function openAddMemberModalView() {
    document.getElementById("newMemberNickInputPage").value = "";
    document.getElementById("newMemberRoleSelectPage").value = "일반";
    document.getElementById("modalPageAddMember").style.display = "flex";
    setTimeout(() => document.getElementById("newMemberNickInputPage").focus(), 100);
  }

  function closeAddMemberModalView() {
    document.getElementById("modalPageAddMember").style.display = "none";
  }

  async function submitAddMemberModalView() {
    const name = document.getElementById("newMemberNickInputPage").value.trim();
    const role = document.getElementById("newMemberRoleSelectPage").value;

    if (!name) return (typeof showKakaoToast === 'function') ? showKakaoToast("길드원 닉네임을 입력해주세요!", "⚠️") : alert("닉네임을 입력해주세요.");
    if (pageMembersDataList.some(m => m.name === name)) {
      return (typeof showKakaoToast === 'function') ? showKakaoToast("이미 존재하는 닉네임입니다!", "⚠️") : alert("이미 존재하는 닉네임입니다.");
    }

    try {
      await apiRequest("guild_members", "POST", [{ name, role, pin: "0000" }]);
      if (typeof showKakaoToast === 'function') showKakaoToast(`[${name}] 길드원 등록 완료!`, "🎉");
      closeAddMemberModalView();
      await loadGuildMembersPageView();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      alert("등록 실패: " + err.message);
    }
  }

  function openEditMemberModalView(id, name, role) {
    document.getElementById("editPageMemberId").value = id;
    document.getElementById("editPageMemberOldNick").value = name;
    document.getElementById("editPageMemberNewNick").value = name;
    document.getElementById("editPageMemberRole").value = role;
    document.getElementById("modalPageEditMember").style.display = "flex";
  }

  function closeEditMemberModalView() {
    document.getElementById("modalPageEditMember").style.display = "none";
  }

  async function submitEditMemberModalView() {
    const id = document.getElementById("editPageMemberId").value;
    const oldName = document.getElementById("editPageMemberOldNick").value.trim();
    const newName = document.getElementById("editPageMemberNewNick").value.trim();
    const role = document.getElementById("editPageMemberRole").value;

    if (!newName) return alert("닉네임을 입력하세요!");

    try {
      if (oldName !== newName) {
        await apiRequest("rpc/update_member_nickname", "POST", { old_name: oldName, new_name: newName });
      }
      await apiRequest(`guild_members?id=eq.${id}`, "PATCH", { role, name: newName });

      if (typeof showKakaoToast === 'function') showKakaoToast(`[${newName}] 정보가 수정되었습니다!`, "✅");
      closeEditMemberModalView();
      await loadGuildMembersPageView();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      alert("수정 실패: " + err.message);
    }
  }

  async function deleteMemberActionView(id, name) {
    if (!confirm(`[${name}] 길드원을 정말 삭제하시겠습니까?`)) return;

    try {
      await apiRequest(`guild_members?id=eq.${id}`, "DELETE");
      if (typeof showKakaoToast === 'function') showKakaoToast(`[${name}] 길드원이 삭제되었습니다.`, "🗑️");
      await loadGuildMembersPageView();

      if (typeof window.loadGuildMembersData === "function") {
        await window.loadGuildMembersData();
      }
    } catch (err) {
      alert("삭제 실패: " + err.message);
    }
  }

  function openPinChangeModalView(memberId) {
    const target = pageMembersDataList.find(m => m.id === memberId);
    if (!target) return;

    pagePinTargetMember = target;
    document.getElementById("pinTargetNickTextPage").innerText = `[${target.name}] 비밀번호 변경`;

    const existingPin = (target.pin || "").trim();
    const hint = document.getElementById("oldPinHintMessagePage");
    if (!existingPin || existingPin === "0000") {
      hint.innerText = "초기 상태입니다. 기존 비밀번호에 0000을 입력하세요.";
    } else {
      hint.innerText = "현재 사용 중인 비밀번호를 입력해주세요.";
    }

    document.getElementById("inputOldPinPage").value = "";
    document.getElementById("inputNewPinPage").value = "";
    document.getElementById("modalPagePinChange").style.display = "flex";
  }

  function closePinChangeModalView() {
    document.getElementById("modalPagePinChange").style.display = "none";
    pagePinTargetMember = null;
  }

  async function submitPinChangeModalView() {
    if (!pagePinTargetMember) return;

    const oldPin = document.getElementById("inputOldPinPage").value.trim();
    const newPin = document.getElementById("inputNewPinPage").value.trim();
    const currentPin = (pagePinTargetMember.pin || "0000").trim();

    if (oldPin !== currentPin) {
      return (typeof showKakaoToast === 'function') ? showKakaoToast("기존 비밀번호가 일치하지 않습니다! (기본값: 0000)", "❌") : alert("기존 비밀번호 불일치");
    }
    if (!/^\d+$/.test(newPin) || newPin.length < 6) {
      return (typeof showKakaoToast === 'function') ? showKakaoToast("새 비밀번호는 숫자 6자리 이상이어야 합니다.", "⚠️") : alert("숫자 6자리 이상 입력");
    }
    if (/(\d)\1\1/.test(newPin)) {
      return (typeof showKakaoToast === 'function') ? showKakaoToast("동일한 숫자를 3회 이상 연속 사용할 수 없습니다.", "⚠️") : alert("동일 숫자 3연속 금지");
    }

    try {
      await apiRequest(`guild_members?id=eq.${pagePinTargetMember.id}`, "PATCH", { pin: newPin });
      if (typeof showKakaoToast === 'function') showKakaoToast(`[${pagePinTargetMember.name}] 비밀번호 변경 완료!`, "🎉");
      closePinChangeModalView();
      await loadGuildMembersPageView();
    } catch (err) {
      alert("변경 실패: " + err.message);
    }
  }

  (function initMembersPageModule() {
    loadGuildMembersPageView();
  })();
</script>
