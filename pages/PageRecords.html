  <!-- 1. 기간 필터 박스 -->

  <!-- 2. TOP 5 랭킹 박스 -->

    </div>
    <div id="top5RankingList" class="top5-list">
      <div class="text-secondary text-center py-2" style="font-size: 0.72rem;">순위 집계 중...</div>

      <i class="fa-solid fa-list-check"></i> 토벌기록

  <!-- 1) 전체길드원통계 뷰 -->
  <div id="viewMembers">
    <div class="search-wrapper-stat">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="statMemberSearch" class="search-input-stat" 
             placeholder="길드원 닉네임 검색..." 
             autocomplete="off" 
             value="" 
             oninput="filterMemberStats()">
      <i class="fa-solid fa-circle-xmark search-clear-btn" id="statMemberSearchClear" onclick="clearMemberSearch()" title="검색 초기화"></i>

      <div class="text-secondary small text-center py-3">데이터를 불러오는 중...</div>
    </div>

  <!-- 3) 토벌기록 뷰 -->
  <div id="viewHistory" style="display: none;">
    <div id="historyList" style="max-height: 460px; overflow-y: auto;">
      <div class="text-secondary small text-center py-3">데이터를 불러오는 중...</div>

<div id="modalMemberBossManager" class="rec-modal-backdrop" style="display: none;">
  <div class="rec-modal-card" style="max-height: 85vh; display: flex; flex-direction: column;">
    <div class="rec-modal-header">
      <div>
        <div class="rec-modal-title" id="mgrMemberNameTitle">참여 보스 목록 수정</div>
        <div class="text-secondary small mt-1" style="font-size: 0.68rem;">기간 내 잡은 보스 중 참여한 항목을 체크/해제하세요.</div>
      </div>

        <i class="fa-solid fa-xmark"></i>
      </button>

    <div class="rec-modal-body" style="flex: 1; overflow-y: auto; max-height: 380px;">
      <div id="memberBossCheckListArea"></div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary btn-sm px-3" onclick="closeMemberBossManagerModal()" style="font-size: 0.78rem; border-radius: 6px;">취소</button>
        <button type="button" class="btn btn-primary btn-sm px-3 fw-bold" onclick="saveMemberBossSelection()" style="font-size: 0.78rem; border-radius: 6px;">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
  var rawStatsData = { records: [], warRecords: [], memberStats: {}, bossList: [] };
  var currentBestTab = 'total';
  var managingMemberName = "";
  var allGuildMembersList = [];
  var recordsToastTimer = null;
  var currentEditingOriginalMembers = [];

  var liveSettings = {
    guildName: "길드",
    scoreBase: 1,
    scoreInternal: 1,
    scoreInter: 2
  };

  async function verifyAdminPermission() {
    const isAuth = (typeof isAdminLoggedIn === "function") ? isAdminLoggedIn() : (sessionStorage.getItem("admin_auth") === "true");
    if (!isAuth) {
      alert("⚠️ 관리자 권한이 필요합니다.\n우측 상단의 [관리자 로그인]을 먼저 진행해주세요.");
      if (typeof handleAdminAuthToggle === "function") handleAdminAuthToggle();
      return false;
    }

    const isSuper = (sessionStorage.getItem("admin_role") === "super");
    if (!isSuper) {
      try {
        const permRow = await apiRequest("guild_settings?key=eq.perm_boss_records_edit");
        if (permRow && permRow.length > 0 && permRow[0].value === 'false') {
          alert("⚠️ 일반 관리자에게는 [토벌기록 및 닉네임 수정/제거 권한]이 비활성화되어 있습니다.\n슈퍼관리자에게 문의하세요.");
          return false;
        }
      } catch (e) {}
    }

    return true;
  }

  function showRecordsToast(msg, icon = "✅") {
    const box = document.getElementById("recordsToastBox");
    const m = document.getElementById("recordsToastMsg");
    const ic = document.getElementById("recordsToastIcon");
    if (!box) {
      if (typeof showKakaoToast === "function") showKakaoToast(msg, icon);
      return;
    }

    m.innerText = msg;
    ic.innerText = icon;
    box.classList.add("show");

    if (recordsToastTimer) clearTimeout(recordsToastTimer);
    recordsToastTimer = setTimeout(() => box.classList.remove("show"), 2200);
  }

  function openCustomConfirm(title, msg, emoji = "⚠️") {
    return new Promise(resolve => {
      const modal = document.getElementById("customConfirmModal");
      const titleElem = document.getElementById("confirmModalTitle");
      const msgElem = document.getElementById("confirmModalMsg");
      const emojiElem = document.getElementById("confirmModalIconEmoji");
      const btnCancel = document.getElementById("btnConfirmCancel");
      const btnOk = document.getElementById("btnConfirmOk");

      if (!modal) {
        resolve(confirm(msg));
        return;
      }

      titleElem.innerText = title;
      msgElem.innerText = msg;
      if (emojiElem) emojiElem.innerText = emoji;

      modal.style.display = "flex";

      btnCancel.onclick = () => {
        modal.style.display = "none";
        resolve(false);
      };
      btnOk.onclick = () => {
        modal.style.display = "none";
        resolve(true);
      };
    });
  }

  // 초기화 함수
  (async function initRecordsPage() {
    setStatPeriod('thisWeek');
  })();

  function setStatPeriod(type) {
    document.querySelectorAll('#btnFilterWeek, #btnFilterLastWeek, #btnFilterMonth, #btnFilterAll').forEach(b => b.classList.remove('active'));

    const today = new Date();
    const currentDay = (today.getDay() + 6) % 7; // 월=0, 일=6

    let start = null;
    let end = null;
    let statusLabel = "이번 주 통계";

    if (type === 'thisWeek') {
      document.getElementById('btnFilterWeek').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - currentDay);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
      statusLabel = "이번 주 통계";
    } else if (type === 'lastWeek') {
      document.getElementById('btnFilterLastWeek').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - currentDay - 7);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
      statusLabel = "지난 주 통계";
    } else if (type === 'thisMonth') {
      document.getElementById('btnFilterMonth').classList.add('active');
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      statusLabel = "이번 달 통계";
    } else if (type === 'all') {
      document.getElementById('btnFilterAll').classList.add('active');
      statusLabel = "전체 기간 통계";
    }

    const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    document.getElementById('filterStartDate').value = start ? fmt(start) : '';
    document.getElementById('filterEndDate').value = end ? fmt(end) : '';
    
    const statusElem = document.getElementById('filterStatusText');
    if (statusElem) statusElem.innerText = statusLabel;

    fetchStatsData();
  }

  async function fetchStatsData() {
    const start = document.getElementById('filterStartDate').value;
    const end = document.getElementById('filterEndDate').value;

    const top5Area = document.getElementById('top5RankingList');
    const listArea = document.getElementById('memberStatsList');
    const warArea = document.getElementById('warLogList');
    const histArea = document.getElementById('historyList');

    if (top5Area) top5Area.innerHTML = '<div class="text-secondary text-center py-2" style="font-size: 0.72rem;"><i class="fa-solid fa-spinner fa-spin me-1"></i>집계 중...</div>';
    if (listArea) listArea.innerHTML = '<div class="text-secondary small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>전체 통계 집계 중...</div>';
    if (warArea) warArea.innerHTML = '<div class="text-secondary small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>전쟁 기록 불러오는 중...</div>';
    if (histArea) histArea.innerHTML = '<div class="text-secondary small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>토벌 기록 불러오는 중...</div>';

    try {
      const [members, raids, settings] = await Promise.all([
        apiRequest("guild_members?select=name,role&order=name.asc"),
        apiRequest("boss_participations?select=*&order=raid_time.desc"),
        apiRequest("guild_settings?select=*")
      ]);

      allGuildMembersList = members || [];
      const allRaids = raids || [];

      if (settings && settings.length > 0) {
        settings.forEach(s => {
          if (s.key === 'guild_name') liveSettings.guildName = s.value || "길드";
          if (s.key === 'score_base') liveSettings.scoreBase = parseInt(s.value, 10) || 1;
          if (s.key === 'score_war_internal') liveSettings.scoreInternal = parseInt(s.value, 10) || 1;
          if (s.key === 'score_war_inter') liveSettings.scoreInter = parseInt(s.value, 10) || 2;
        });
      }

      const filtered = allRaids.filter(r => {
        if (!r.raid_time) return false;
        const d = r.raid_time.slice(0, 10);
        if (start && d < start) return false;
        if (end && d > end) return false;
        return true;
      });

      const records = [];
      const warRecords = [];
      const memberStats = {};

      allGuildMembersList.forEach(m => {
        memberStats[m.name] = {
          role: m.role || '일반',
          totalScore: 0,
          bossScore: 0,
          internalScore: 0,
          interScore: 0,
          extraBonus: 0,
          warExtraBonus: 0,
          generalExtraBonus: 0,
          bossCount: 0,
          warCount: 0,
          byBoss: {}
        };
      });

      filtered.forEach(r => {
        const warType = r.war_type || '일반';
        const isInternal = warType.includes('내전');
        const isInter = warType.includes('인터');
        const isWar = isInternal || isInter;
        const extra = parseInt(r.extra_score, 10) || 0;
        const membersArr = Array.isArray(r.members) ? r.members : [];

        // 배점 계산 (기본 + 전쟁가산 + 추가)
        let calcScore = liveSettings.scoreBase || 1;
        if (isInternal) calcScore += (liveSettings.scoreInternal || 1);
        else if (isInter) calcScore += (liveSettings.scoreInter || 2);
        calcScore += extra;

        const recordObj = {
          id: r.id,
          bossName: r.boss_name,
          warType: warType,
          isInternal: isInternal,
          isInter: isInter,
          dropItem: r.drop_items || '없음',
          dateTime: r.raid_time ? r.raid_time.replace('T', ' ').slice(0, 16) : '',
          count: membersArr.length,
          totalScore: calcScore,
          extraBonus: extra,
          members: membersArr
        };

        records.push(recordObj);

        if (isWar) {
          warRecords.push(recordObj);
        }

        membersArr.forEach(name => {
          if (!memberStats[name]) {
            memberStats[name] = {
              role: '일반',
              totalScore: 0, bossScore: 0, internalScore: 0, interScore: 0,
              extraBonus: 0, warExtraBonus: 0, generalExtraBonus: 0,
              bossCount: 0, warCount: 0, byBoss: {}
            };
          }

          const st = memberStats[name];
          st.totalScore += calcScore;
          st.bossScore += 1;
          st.bossCount += 1;
          st.extraBonus += extra;

          if (isInternal) st.internalScore += (liveSettings.scoreInternal || 1);
          if (isInter) st.interScore += (liveSettings.scoreInter || 2);

          if (isWar) {
            st.warCount += 1;
            st.warExtraBonus += extra;
          } else {
            st.generalExtraBonus += extra;
          }

          st.byBoss[r.boss_name] = (st.byBoss[r.boss_name] || 0) + 1;
        });
      });

      rawStatsData = { records, warRecords, memberStats };

      renderTop5Ranking();
      renderMemberStats(rawStatsData.memberStats);
      renderWarLogList(rawStatsData.warRecords);
      renderHistoryList(rawStatsData.records);

      filterMemberStats();
    } catch (err) {
      showRecordsToast("통계 조회 실패: " + err.message, "❌");
    }
  }

  function switchBestTab(tabKey) {
    currentBestTab = tabKey;
    document.getElementById('bestTabTotal').classList.toggle('active', tabKey === 'total');
    document.getElementById('bestTabBoss').classList.toggle('active', tabKey === 'boss');
    document.getElementById('bestTabWar').classList.toggle('active', tabKey === 'war');

    if (tabKey === 'total') {
      document.getElementById('top5TitleText').innerText = "👑 총참여 베스트 TOP 5";
      document.getElementById('top5SubText').innerText = "보스 점수 + 전쟁/추가 점수 누적 합산";
    } else if (tabKey === 'boss') {
      document.getElementById('top5TitleText').innerText = "🎯 보스참여 베스트 TOP 5";
      document.getElementById('top5SubText').innerText = "순수 보스 토벌 참여 횟수 기준";
    } else {
      document.getElementById('top5TitleText').innerText = "⚔️ 전쟁참여 베스트 TOP 5";
      document.getElementById('top5SubText').innerText = "내전 및 인터쟁 참여 횟수 기준";
    }
    renderTop5Ranking();
  }

  function renderTop5Ranking() {
    const container = document.getElementById('top5RankingList');
    if (!container) return;

    const statsObj = rawStatsData.memberStats || {};
    const allMembers = Object.keys(statsObj);

    let sortedMembers = allMembers.filter(m => (statsObj[m].totalScore || 0) > 0);

    if (currentBestTab === 'total') {
      sortedMembers.sort((a, b) => (statsObj[b].totalScore || 0) - (statsObj[a].totalScore || 0));
    } else if (currentBestTab === 'boss') {
      sortedMembers.sort((a, b) => (statsObj[b].bossCount || 0) - (statsObj[a].bossCount || 0));
    } else if (currentBestTab === 'war') {
      sortedMembers.sort((a, b) => (statsObj[b].warCount || 0) - (statsObj[a].warCount || 0));
    }

    const top5 = sortedMembers.slice(0, 5);

    if (top5.length === 0) {
      container.innerHTML = '<div class="text-secondary text-center py-2" style="font-size: 0.72rem;">참여 기록이 없습니다.</div>';
      return;
    }

    container.innerHTML = top5.map((name, i) => {
      const d = statsObj[name];
      const rankNum = i + 1;
      const rankClass = rankNum === 1 ? 'rank-1' : (rankNum === 2 ? 'rank-2' : (rankNum === 3 ? 'rank-3' : 'rank-normal'));
      
      let scoreText = `${d.totalScore}점`;
      if (currentBestTab === 'boss') scoreText = `토벌 ${d.bossCount}회`;
      else if (currentBestTab === 'war') scoreText = `전쟁 ${d.warCount}회`;

      const roleBadge = getRoleBadgeHtml(d.role);

      return `
        <div class="top5-item">
          <div class="d-flex align-items-center gap-2" style="min-width: 0; flex: 1;">
            <span class="top-rank-badge ${rankClass}">${rankNum}</span>
            <span class="top5-name">${escapeHtml(name)}</span>
            ${roleBadge}
          </div>
          <span class="top5-score">${scoreText}</span>
        </div>
      `;
    }).join('');
  }

  function renderMemberStats(statsObj) {
    const container = document.getElementById('memberStatsList');
    if (!container) return;

    const allMembers = Object.keys(statsObj || {});

      const safeName = encodeURIComponent(name);

      const memberRecords = (rawStatsData.records || []).filter(r => r.members && r.members.includes(name));
      let historyRows = '<div class="text-secondary small text-center py-2">참여 토벌 기록이 없습니다.</div>';

        historyRows = memberRecords.map(r => {
          let badgeHtml = "";
          if (r.isInter) badgeHtml += `<span class="badge-score-custom badge-score-inter">인터</span> `;
          if (r.isInternal) badgeHtml += `<span class="badge-score-custom badge-score-internal">내전</span> `;

                <div class="d-flex align-items-center gap-1 flex-wrap">
                  <strong class="text-primary" style="font-size: 0.78rem;">${escapeHtml(r.bossName)}</strong>

                <button type="button" class="btn-record-action btn-record-del" onclick="event.stopPropagation(); removeSingleMember('${safeName}', ${r.id}, '${escapeHtml(r.bossName)}')">제외</button>
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        <div class="member-stat-card" id="card_m_${idx}">
          <div class="member-card-header" onclick="toggleMemberDetailCard('card_m_${idx}')">
            <div class="d-flex justify-content-between align-items-center mb-1 gap-2 flex-wrap">
              <div class="d-flex align-items-center gap-2" style="min-width: 0;">
                <span class="badge rounded-pill" style="background: rgba(2, 132, 199, 0.15); color: #0284c7; font-size: 0.68rem; font-weight: 800; padding: 2px 7px;">${idx + 1}위</span>
                <strong style="font-size: 0.88rem; color: var(--rec-text-main);">${escapeHtml(name)}</strong>
                ${roleBadge}
                <i class="fa-solid fa-chevron-down text-secondary ms-1" style="font-size: 0.68rem;"></i>
              </div>
              <span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.35); font-size: 0.72rem; font-weight: 800; white-space: nowrap;">
                ${fullScoreDisplay}
              </span>
            </div>
            <div class="mt-1">${bossTags}</div>
          </div>

          <div class="member-detail-accordion">
            <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary border-opacity-10 gap-2 flex-wrap">

                <i class="fa-solid fa-list-check me-1 text-primary"></i>개별 토벌 참여 내역
              </span>

  function getRoleBadgeHtml(role) {
    const r = String(role || '').trim();
    if (r === '길드장' || r === '길마') return `<span class="badge-role-pill role-master">길드장</span>`;
    if (r === '부길드장' || r === '부길마') return `<span class="badge-role-pill role-submaster">부길드장</span>`;
    if (r === '정예') return `<span class="badge-role-pill role-elite">정예</span>`;
    return `<span class="badge-role-pill role-normal">일반</span>`;
  }

    card.classList.toggle('active');

    if (icon) {

  async function promptSaveRecordMembers() {
    if (!(await verifyAdminPermission())) return;

    const raidId = document.getElementById('editRecordId').value;
    const bossName = document.getElementById('editRecordBossName').value || "보스";
    const selected = Array.from(document.querySelectorAll('.edit-chk:checked')).map(c => c.value);

    const addedMembers = selected.filter(name => !currentEditingOriginalMembers.includes(name));
    const removedMembers = currentEditingOriginalMembers.filter(name => !selected.includes(name));

    let confirmMessage = "";
    if (selected.length === 0) {
      confirmMessage = `선택된 인원이 없습니다.\n[${bossName}] 토벌 참여자를 0명으로 저장하시겠습니까?`;
    } else if (addedMembers.length > 0 && removedMembers.length === 0) {
      confirmMessage = `[${bossName}] 토벌에\n[${addedMembers.join(', ')}] 님을 추가하시겠습니까?`;
    } else if (addedMembers.length === 0 && removedMembers.length > 0) {
      confirmMessage = `[${bossName}] 토벌에서\n[${removedMembers.join(', ')}] 님을 제외하시겠습니까?`;
    } else if (addedMembers.length > 0 && removedMembers.length > 0) {
      confirmMessage = `[${bossName}] 토벌 명단 변경\n• 추가: ${addedMembers.join(', ')}\n• 제외: ${removedMembers.join(', ')}\n\n반영하시겠습니까?`;
    } else {
      confirmMessage = `[${bossName}] 토벌 참여 명단에 변동이 없습니다.\n현재 명단(${selected.length}명) 그대로 유지하시겠습니까?`;
    }

    const confirmed = await openCustomConfirm(
      "참여 인원 수정 확인",
      confirmMessage,
      "📝"
    );
    if (!confirmed) return;

    closeEditModal();

    try {
      await apiRequest(`boss_participations?id=eq.${raidId}`, "PATCH", {
        members: selected,
        member_count: selected.length
      });

      showRecordsToast('참여 명단이 정상적으로 수정되었습니다.', '✅');
      await fetchStatsData();
    } catch (err) {
      showRecordsToast("수정 실패: " + err.message, "❌");
    }
  }

  async function saveMemberBossSelection() {
    if (!(await verifyAdminPermission())) return;

    const checkboxes = Array.from(document.querySelectorAll('.mgr-boss-chk'));
    const name = managingMemberName;
    if (!name) return;

    let updatedCount = 0;

    try {
      for (const chk of checkboxes) {
        const raidId = parseInt(chk.value, 10);
        const shouldBeIn = chk.checked;
        const targetRecord = rawStatsData.records.find(r => r.id === raidId);
        if (!targetRecord) continue;

        const isCurrentlyIn = targetRecord.members && targetRecord.members.includes(name);

        if (shouldBeIn && !isCurrentlyIn) {
          const updated = [...targetRecord.members, name];
          await apiRequest(`boss_participations?id=eq.${raidId}`, "PATCH", {
            members: updated,
            member_count: updated.length
          });
          targetRecord.members = updated;
          updatedCount++;
        } else if (!shouldBeIn && isCurrentlyIn) {
          const updated = targetRecord.members.filter(m => m !== name);
          await apiRequest(`boss_participations?id=eq.${raidId}`, "PATCH", {
            members: updated,
            member_count: updated.length
          });
          targetRecord.members = updated;
          updatedCount++;
        }
      }

      closeMemberBossManagerModal();
      showRecordsToast(`[${name}] 님의 참여 현황 (${updatedCount}건 변동) 저장 완료!`, "🎉");
      await fetchStatsData();
    } catch (err) {
      showRecordsToast("저장 실패: " + err.message, "❌");
    }
  }

  async function removeMemberAll(encodedName) {
    if (!(await verifyAdminPermission())) return;

    const name = decodeURIComponent(encodedName);
    const confirmed = await openCustomConfirm(
      "참여 기록 일괄 제외",
      `[${name}] 님이 참여한 모든 토벌 기록에서 일괄 제외하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`,
      "⚠️"

    try {
      const recordsToUpdate = rawStatsData.records.filter(r => r.members && r.members.includes(name));

          members: updated,

      showRecordsToast(`[${name}] 님의 전체 참여 기록 일괄 제외 완료!`, "🗑️");

  }

  window.shareRecordsReportToChat = async function() {
    const btn = document.getElementById('btnShareRecordsReport');
    const statsObj = rawStatsData.memberStats || {};
    const allMembers = Object.keys(statsObj);
    const members = allMembers.filter(m => (statsObj[m].totalScore || 0) > 0);

    if (members.length === 0) {
      return showRecordsToast('공유할 참여 내역 데이터가 없습니다.', '⚠️');
    }

    const sDate = document.getElementById('filterStartDate').value || '';
    const eDate = document.getElementById('filterEndDate').value || '';
    const gName = liveSettings.guildName || "길드";

    members.sort((a, b) => statsObj[b].totalScore - statsObj[a].totalScore);

    const totalRaidsCount = rawStatsData.records.length;
    const totalWarCount = rawStatsData.warRecords.length;
    let totalScoreSum = 0;
    members.forEach(m => { totalScoreSum += (statsObj[m].totalScore || 0); });

    const top5 = members.slice(0, 5);

    function formatCleanDate(dStr) {
      if (!dStr) return '';
      try {
        const parts = dStr.split('-');
        if (parts.length === 3) return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
      } catch (e) {}
      return dStr;
    }

    const sClean = sDate ? formatCleanDate(sDate) : '시작';
    const eClean = eDate ? formatCleanDate(eDate) : '현재';
    const periodLabel = `${sClean} ~ ${eClean}`;

    const rankListHtml = top5.map((name, i) => {
      const d = statsObj[name];
      const rankNum = i + 1;
      const rankClass = rankNum === 1 ? 'rec-rank-1' : (rankNum === 2 ? 'rec-rank-2' : (rankNum === 3 ? 'rec-rank-3' : 'rec-rank-other'));
      return `
        <div class="rec-rank-row">
          <div style="display: flex; align-items: center; min-width: 0;">
            <span class="rec-rank-badge ${rankClass}">${rankNum}</span>
            <span style="font-weight: 700; color: var(--kakao-notice-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">${escapeHtml(name)}</span>
          </div>
          <span style="font-weight: 800; color: #d97706; flex-shrink: 0;">${d.totalScore}점 <small style="font-size: 10px; color: var(--kakao-time-gray); font-weight: normal;">(${d.bossCount}회)</small></span>
        </div>
      `;
    }).join('');

    const reportCardHtml = `
      <div class="records-report-card">
        <div class="rec-card-header">
          <div class="rec-card-title">
            <i class="fa-solid fa-scroll text-warning"></i>
            <span>[${escapeHtml(gName)}] 보스&전쟁 통계</span>
          </div>
          <span class="rec-date-badge">
            <i class="fa-regular fa-clock me-1"></i>${periodLabel}
          </span>
        </div>

        <div class="rec-hero-box">
          <div>
            <div class="rec-hero-label">
              <i class="fa-solid fa-trophy text-warning me-1"></i>종합 참여 1위 MVP
            </div>
            <div class="rec-hero-val">
              🥇 ${escapeHtml(top5[0] || '없음')} <span style="font-size: 11px; font-weight: 700; color: var(--kakao-notice-text);">(${statsObj[top5[0]]?.totalScore || 0}점)</span>
            </div>
          </div>
          <div style="font-size: 1.55rem; line-height: 1;">👑</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px;">
          <div style="background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 5px 8px; color: #0284c7;">
            <div style="font-size: 10px; font-weight: 600;">총 토벌 횟수</div>
            <div style="font-size: 11.5px; font-weight: 800; margin-top: 1px;">⚔️ ${totalRaidsCount}회 <small style="font-size: 10px; opacity: 0.8;">(전쟁 ${totalWarCount}회)</small></div>
          </div>
          <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 6px; padding: 5px 8px; color: #d97706;">
            <div style="font-size: 10px; font-weight: 600;">참여 인원 / 총점</div>
            <div style="font-size: 11.5px; font-weight: 800; margin-top: 1px;">👥 ${members.length}명 / ${totalScoreSum}점</div>
          </div>
        </div>

        <div style="margin-top: 6px;">
          <div style="font-size: 11px; font-weight: 700; color: var(--kakao-notice-text); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;">
            <span><i class="fa-solid fa-ranking-star me-1 text-primary"></i>TOP 5 랭킹</span>
            <span style="font-size: 10px; color: var(--kakao-time-gray); font-weight: normal;">총 ${members.length}명 참여</span>
          </div>
          ${rankListHtml}
        </div>
      </div>
    `;

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 공유 중`;
    }

    try {
      await apiRequest("guild_chats", "POST", [{
        sender_name: "통계알리미",
        message: reportCardHtml,
        msg_type: "records_report",
        mentions: []
      }]);

      showRecordsToast("보스&전쟁 통계가 대화방에 공유되었습니다!", "📜");
    } catch (err) {
      showRecordsToast("공유 실패: " + err.message, "❌");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-comment-dots"></i><span>대화방 공유</span>`;
      }
    }
  };

  function escapeHtml(t) {
    return (t || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }
</script>
