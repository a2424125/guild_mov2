<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>길드 메신저 & 통합 관리 시스템</title>

  <!-- PWA 앱 설치 설정 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="길드메신저">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">

  <!-- 부트스트랩 & 폰트어썸 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Supabase JS 공식 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #060a14;
      --card-bg: #0d1527;
      --card-border: #1a2742;
      --accent-blue: #38bdf8;
      --chat-bubble-me: #0284c7;
      --chat-bubble-other: #111e38;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    /* ========================================================
       1. 햄버거 메뉴를 눌렀을 때만 나타나는 슬라이드 서랍 (PC/모바일 공통)
       ======================================================== */
    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99998;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.show {
      display: block;
      opacity: 1;
    }

    .app-sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: #090e1c;
      border-right: 1px solid var(--card-border);
      z-index: 99999;
      transform: translateX(-100%); /* 기본 상태: 숨김 */
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.85);
    }
    .app-sidebar-drawer.open {
      transform: translateX(0); /* 열림 상태 */
    }

    .sidebar-header {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: #060a14;
      flex-shrink: 0;
    }

    .sidebar-brand {
      font-weight: 800;
      font-size: 0.95rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .sidebar-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-close-btn:hover {
      color: #ffffff;
    }

    .sidebar-menu-list {
      list-style: none;
      padding: 10px 8px;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }
    .sidebar-menu-list::-webkit-scrollbar { width: 4px; }
    .sidebar-menu-list::-webkit-scrollbar-thumb { background: #1e2c47; border-radius: 4px; }

    .sidebar-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 4px;
      user-select: none;
    }
    .sidebar-menu-item:hover {
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
    }
    .sidebar-menu-item i {
      width: 22px;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--card-border);
      background: #060a14;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========================================================
       2. 메인 대화방 레이아웃 (기본 전체 화면)
       ======================================================== */
    .app-main-layout {
      flex: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-dark);
    }

    /* 상단 헤더: 햄버거 버튼 + 제목 + 툴바 */
    .main-top-header {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #080d1a;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .btn-hamburger-menu {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.35rem;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-hamburger-menu:hover {
      color: #38bdf8;
    }
    .header-chat-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-header-action {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px;
    }
    .btn-header-action:hover {
      color: #ffffff;
    }
    .badge-member-count {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* 채팅 메시지 영역 */
    .chat-messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-dark);
    }
    .chat-messages-container::-webkit-scrollbar { width: 5px; }
    .chat-messages-container::-webkit-scrollbar-thumb { background: #1e2c47; border-radius: 6px; }

    .chat-msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .chat-msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }
    .chat-msg-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }
    .chat-sender-nick {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 3px;
      padding-left: 2px;
    }
    .chat-msg-bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.45;
      word-break: break-all;
      position: relative;
    }
    .chat-msg-row.me .chat-msg-bubble {
      background: var(--chat-bubble-me);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .chat-msg-row.other .chat-msg-bubble {
      background: var(--chat-bubble-other);
      color: #f1f5f9;
      border: 1px solid #1e293b;
      border-bottom-left-radius: 2px;
    }
    .chat-msg-time {
      font-size: 0.65rem;
      color: #64748b;
      margin-top: 2px;
    }
    .chat-msg-bubble.is-mentioned {
      border: 1.5px solid #facc15 !important;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.35);
    }

    .system-alert-card {
      align-self: center;
      width: 100%;
      max-width: 480px;
      margin: 4px 0;
    }
    .system-alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.2);
    }

    /* 하단 입력 폼 */
    .chat-input-wrapper {
      padding: 10px 14px;
      background: #080d1a;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      flex-shrink: 0;
    }
    .chat-input-field {
      flex: 1;
      background: #0d1527;
      border: 1px solid #233554;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.85rem;
      color: #ffffff;
      outline: none;
      height: 40px;
    }
    .chat-input-field:focus { border-color: #38bdf8; }
    .btn-chat-send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .btn-chat-send:active { transform: scale(0.92); }

    /* @ 멘션 자동완성 팝업 */
    .mention-popup-container {
      position: absolute;
      bottom: 58px;
      left: 14px;
      right: 14px;
      max-width: 280px;
      background: #0d1527;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.85);
      display: none;
      z-index: 100;
    }
    .mention-item-row {
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mention-item-row:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

    /* 3. 모듈 오버레이 뷰 (기존 10개 모듈 표시) */
    .module-display-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .module-nav-header {
      height: 56px;
      padding: 0 16px;
      background: #080d1a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .module-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* 닉네임 설정 모달 */
    .profile-modal-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(6, 10, 20, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .profile-modal-card {
      background: #0d1527;
      border: 1.5px solid #38bdf8;
      border-radius: 18px;
      width: 100%; max-width: 320px;
      padding: 22px 18px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. 메뉴 열릴 때 뒤쪽 배경 어둡게 처리하는 백드롭 -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleSidebarMenu(false)"></div>

  <!-- 2. 좌측 햄버거 메뉴 서랍 (기본 상태는 숨겨져 있고, 버튼 누르면 열림) -->
  <aside id="appSidebarDrawer" class="app-sidebar-drawer">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span style="font-size: 1.25rem;">🛡️</span>
        <span id="sidebarGuildName">길드 메뉴</span>
      </div>
      <button type="button" class="sidebar-close-btn" onclick="toggleSidebarMenu(false)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 스케치에 작성해주신 10대 메뉴 리스트 -->
    <ul class="sidebar-menu-list">
      <li class="sidebar-menu-item" onclick="openModulePage('PageNotice')">
        <i class="fa-solid fa-bullhorn text-info"></i><span>공지사항</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageMembers')">
        <i class="fa-solid fa-users text-primary"></i><span>길드원목록</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageRegister')">
        <i class="fa-solid fa-crosshairs text-danger"></i><span>보스참여등록</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageRecords')">
        <i class="fa-solid fa-scroll text-warning"></i><span>보스참여자</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageWish')">
        <i class="fa-solid fa-gift" style="color: #f472b6;"></i><span>분배희망신청</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageSettle')">
        <i class="fa-solid fa-coins text-success"></i><span>정산내역</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageFinance')">
        <i class="fa-solid fa-landmark" style="color: #c084fc;"></i><span>길드비용현황</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageTimer')">
        <i class="fa-solid fa-hourglass-half text-warning"></i><span>보스타임</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageEnemies')">
        <i class="fa-solid fa-skull text-danger"></i><span>원수목록</span>
      </li>
      <li class="sidebar-menu-item" onclick="openModulePage('PageSettings')">
        <i class="fa-solid fa-gear text-info"></i><span>설정</span>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="user-profile-badge" onclick="openProfileModal()" style="cursor: pointer;">
        <div class="user-avatar" id="sidebarAvatarInitial">?</div>
        <div class="user-name-text" id="sidebarUserNickName">닉네임 설정</div>
      </div>
      <button type="button" class="btn btn-outline-info btn-xs py-1 px-2" style="font-size: 0.72rem;" onclick="openProfileModal()">
        변경
      </button>
    </div>
  </aside>

  <!-- 3. 메인 전체 대화방 레이아웃 -->
  <div class="app-main-layout">
    <header class="main-top-header">
      <div class="header-left-tools">
        <!-- 🎯 햄버거 메뉴 버튼: 누르면 좌측 메뉴가 슬라이드로 나옴 -->
        <button type="button" class="btn-hamburger-menu" title="메뉴 열기" onclick="toggleSidebarMenu(true)">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="header-chat-title" id="chatHeaderTitle">전체 길드 대화방</span>
      </div>

      <div class="header-right-tools">
        <!-- PWA PC/모바일 설치 버튼 -->
        <button type="button" class="btn-header-action" id="btnPwaInstall" style="display: none;" title="앱 설치">
          <i class="fa-solid fa-download text-warning"></i>
        </button>
        <button type="button" class="btn-header-action" title="채팅창 포커스" onclick="focusChatInput()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <div class="badge-member-count" title="등록 길드원 수">
          <i class="fa-solid fa-users"></i>
          <span id="headerMemberCountText">0명</span>
        </div>
      </div>
    </header>

    <!-- 중앙 대화창 스크롤 뷰 -->
    <div class="chat-messages-container" id="chatMessagesView">
      <div class="system-alert-card">
        <div class="system-alert-box" style="background: rgba(56, 189, 248, 0.1); border-color: #38bdf8;">
          <i class="fa-solid fa-circle-info text-info fs-5"></i>
          <div style="font-size: 0.8rem; line-height: 1.4;">
            <strong>길드 메신저 & 통합 관리 시스템</strong>에 연결되었습니다.<br>
            상단 좌측 <strong>햄버거 버튼(☰)</strong>을 누르면 보스/정산/공지 등 관리 메뉴가 열립니다.
          </div>
        </div>
      </div>
    </div>

    <!-- @ 멘션 자동완성 팝업 -->
    <div id="mentionPopupBox" class="mention-popup-container"></div>

    <!-- 하단 메시지 입력 바 -->
    <footer class="chat-input-wrapper">
      <input type="text" id="inputChatMessage" class="chat-input-field" placeholder="메시지 입력... (@로 길드원 멘션)" autocomplete="off" onkeypress="if(event.keyCode===13){ handleSendMessage(); }">
      <button type="button" class="btn-chat-send" onclick="handleSendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </footer>

    <!-- 기존 10대 관리 모듈 오버레이 창 -->
    <div id="moduleOverlay" class="module-display-overlay">
      <div class="module-nav-header">
        <button type="button" class="btn btn-outline-info btn-xs py-1 px-2" onclick="closeModuleOverlay()">
          <i class="fa-solid fa-arrow-left me-1"></i>채팅방으로 복귀
        </button>
        <span class="fw-bold text-white small" id="overlayNavTitle">기능 화면</span>
        <div style="width: 50px;"></div>
      </div>
      <div class="module-scroll-body" id="overlayBodyContent"></div>
    </div>
  </div>

  <!-- 본인 닉네임 설정 모달 -->
  <div id="profileModal" class="profile-modal-bg" style="display: none;">
    <div class="profile-modal-card">
      <div style="font-size: 2.2rem; margin-bottom: 8px;">👤</div>
      <h6 class="fw-bold text-white mb-2">본인 닉네임 확인</h6>
      <p class="text-secondary small mb-3" style="font-size: 0.74rem;">채팅 및 알림 수신에 사용할 본인 닉네임을 선택하세요.</p>
      
      <select id="selectMemberNickDropdown" class="form-select form-select-sm mb-3" style="background:#080d1a; border-color:#233554; color:#fff;">
        <option value="">본인 닉네임 선택...</option>
      </select>

      <button type="button" class="btn btn-primary btn-sm w-100 fw-bold py-2" onclick="confirmMyNickname()">
        확인 완료
      </button>
    </div>
  </div>

  <!-- 공통 통신 모듈 -->
  <script src="supabase.js"></script>

  <script>
    var supabaseClient = null;
    var cachedMemberList = [];
    var myCurrentNick = localStorage.getItem("guild_my_nickname") || "";
    var bossWatcherInterval = null;
    var notifiedBossSpawnMap = new Set();
    var deferredPrompt = null;

    async function initApp() {
      // 1. Supabase Realtime SDK 초기화
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      }

      await loadGuildMetadata();
      await loadGuildMembersData();
      await loadPastChatMessages();
      listenRealtimeChatMessages();
      startBossWatchTimer();

      if (!myCurrentNick) {
        openProfileModal();
      } else {
        updateProfileUI(myCurrentNick);
      }

      bindMentionInputEvents();
      setupPwaInstallation();
    }

    // 길드 메타데이터 로드
    async function loadGuildMetadata() {
      try {
        const res = await apiRequest("guild_settings?key=eq.guild_name");
        if (res && res.length > 0 && res[0].value) {
          const gName = res[0].value;
          document.getElementById("sidebarGuildName").innerText = `${gName} 관리`;
          document.getElementById("chatHeaderTitle").innerText = `${gName} 전체 대화방`;
          document.title = `${gName} 길드 메신저`;
        }
      } catch (e) {}
    }

    // 길드원 명단 로드
    async function loadGuildMembersData() {
      try {
        const members = await apiRequest("guild_members?select=name&order=name.asc");
        cachedMemberList = (members || []).map(m => m.name);
        document.getElementById("headerMemberCountText").innerText = `${cachedMemberList.length}명`;

        const select = document.getElementById("selectMemberNickDropdown");
        select.innerHTML = '<option value="">본인 닉네임 선택...</option>' + 
          cachedMemberList.map(name => `<option value="${name}" ${name === myCurrentNick ? 'selected' : ''}>${name}</option>`).join('');
      } catch (e) {}
    }

    // 과거 대화 목록 로드
    async function loadPastChatMessages() {
      try {
        const list = await apiRequest("guild_chats?select=*&order=id.desc&limit=50");
        if (list && list.length > 0) {
          list.reverse().forEach(c => renderChatBubble(c, false));
          scrollChatBottom();
        }
      } catch (e) {}
    }

    // Supabase Realtime 수신 리스너
    function listenRealtimeChatMessages() {
      if (!supabaseClient) return;

      supabaseClient
        .channel("public:guild_chats")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "guild_chats" }, (payload) => {
          renderChatBubble(payload.new, true);
        })
        .subscribe();
    }

    // 말풍선 렌더링
    function renderChatBubble(msg, isRealtime = true) {
      const container = document.getElementById("chatMessagesView");
      const isSystem = (msg.msg_type === "boss_alert" || msg.msg_type === "system");
      const isMe = (msg.sender_name === myCurrentNick);
      const isMentioned = Array.isArray(msg.mentions) && msg.mentions.includes(myCurrentNick);
      const timeStr = (msg.created_at || '').slice(11, 16);

      let html = "";
      if (isSystem) {
        html = `
          <div class="system-alert-card">
            <div class="system-alert-box">
              <i class="fa-solid fa-bullhorn text-danger fs-5"></i>
              <div style="font-size: 0.82rem;">
                <strong class="text-danger">[${msg.sender_name}]</strong><br>
                ${msg.message}
              </div>
            </div>
          </div>
        `;
      } else {
        const rowClass = isMe ? "chat-msg-row me" : "chat-msg-row other";
        const bubbleExtra = isMentioned ? "is-mentioned" : "";

        html = `
          <div class="${rowClass}">
            ${!isMe ? `<div class="chat-sender-nick">${msg.sender_name}</div>` : ''}
            <div class="chat-msg-bubble ${bubbleExtra}">
              ${escapeHtmlText(msg.message)}
            </div>
            <div class="chat-msg-time">${timeStr}</div>
          </div>
        `;
      }

      container.insertAdjacentHTML('beforeend', html);
      scrollChatBottom();

      if (isRealtime && !isMe) {
        triggerBeepSound(isMentioned || isSystem);
      }
    }

    // 메시지 전송
    async function handleSendMessage() {
      const input = document.getElementById("inputChatMessage");
      const text = input.value.trim();
      if (!text) return;

      if (!myCurrentNick) {
        alert("본인 닉네임을 먼저 설정해주세요.");
        openProfileModal();
        return;
      }

      const detectedMentions = [];
      cachedMemberList.forEach(name => {
        if (text.includes(`@${name}`)) detectedMentions.push(name);
      });

      input.value = "";
      closeMentionPopup();

      try {
        await apiRequest("guild_chats", "POST", [{
          sender_name: myCurrentNick,
          message: text,
          msg_type: "chat",
          mentions: detectedMentions
        }]);
      } catch (err) {
        alert("전송 실패: " + err.message);
      }
    }

    // @ 멘션 자동완성 리스너
    function bindMentionInputEvents() {
      const input = document.getElementById("inputChatMessage");
      const popup = document.getElementById("mentionPopupBox");

      input.addEventListener("input", () => {
        const val = input.value;
        const lastAt = val.lastIndexOf("@");
        if (lastAt !== -1) {
          const q = val.slice(lastAt + 1).toLowerCase();
          const matched = cachedMemberList.filter(m => m.toLowerCase().includes(q));
          if (matched.length > 0) {
            popup.innerHTML = matched.slice(0, 5).map(name => `
              <div class="mention-item-row" onclick="applyMentionNick('${name}')">
                <i class="fa-solid fa-at text-info"></i> ${name}
              </div>
            `).join('');
            popup.style.display = "block";
            return;
          }
        }
        popup.style.display = "none";
      });
    }

    function applyMentionNick(name) {
      const input = document.getElementById("inputChatMessage");
      const val = input.value;
      const lastAt = val.lastIndexOf("@");
      input.value = val.slice(0, lastAt) + `@${name} `;
      closeMentionPopup();
      input.focus();
    }

    function closeMentionPopup() {
      document.getElementById("mentionPopupBox").style.display = "none";
    }

    // 🎯 햄버거 메뉴 열기/닫기 제어 함수 (PC/모바일 공통 동작)
    function toggleSidebarMenu(isOpen) {
      const drawer = document.getElementById("appSidebarDrawer");
      const backdrop = document.getElementById("drawerBackdrop");
      if (isOpen) {
        backdrop.classList.add("show");
        drawer.classList.add("open");
      } else {
        backdrop.classList.remove("show");
        drawer.classList.remove("open");
      }
    }

    // 기존 10대 관리 모듈 열기
    async function openModulePage(pageName) {
      toggleSidebarMenu(false); // 메뉴 서랍 닫기

      const overlay = document.getElementById("moduleOverlay");
      const body = document.getElementById("overlayBodyContent");
      const navTitle = document.getElementById("overlayNavTitle");

      const titleMap = {
        "PageNotice": "공지사항",
        "PageMembers": "길드원목록",
        "PageRegister": "보스참여등록",
        "PageRecords": "보스참여자",
        "PageWish": "분배희망신청",
        "PageSettle": "정산내역",
        "PageFinance": "길드비용현황",
        "PageTimer": "보스타임",
        "PageEnemies": "원수목록",
        "PageSettings": "설정"
      };

      navTitle.innerText = titleMap[pageName] || "기능 화면";
      overlay.style.display = "flex";
      body.innerHTML = `<div class="text-secondary small text-center py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>화면을 불러오는 중...</div>`;

      try {
        const res = await fetch(`pages/${pageName}.html?_t=${Date.now()}`);
        if (!res.ok) throw new Error("로드 실패");
        const html = await res.text();
        body.innerHTML = html;

        document.querySelectorAll(".module-dynamic-script").forEach(s => s.remove());
        body.querySelectorAll("script").forEach(s => {
          const sc = document.createElement("script");
          sc.className = "module-dynamic-script";
          if (s.src) sc.src = s.src;
          else sc.textContent = s.textContent;
          document.body.appendChild(sc);
        });
      } catch (e) {
        body.innerHTML = `<div class="text-danger small text-center py-5">화면 로드 실패: ${e.message}</div>`;
      }
    }

    function closeModuleOverlay() {
      document.getElementById("moduleOverlay").style.display = "none";
      document.getElementById("overlayBodyContent").innerHTML = "";
      document.querySelectorAll(".module-dynamic-script").forEach(s => s.remove());
    }

    // 보스 젠 백그라운드 워처
    function startBossWatchTimer() {
      if (bossWatcherInterval) clearInterval(bossWatcherInterval);

      bossWatcherInterval = setInterval(async () => {
        try {
          const now = Date.now();
          const timers = await apiRequest("boss_timers?select=*");
          
          (timers || []).forEach(b => {
            if (!b.next_spawn_time) return;
            const diffSec = Math.floor((new Date(b.next_spawn_time).getTime() - now) / 1000);

            const key5Min = `${b.id}_5min_${b.next_spawn_time}`;
            if (diffSec <= 300 && diffSec > 240 && !notifiedBossSpawnMap.has(key5Min)) {
              notifiedBossSpawnMap.add(key5Min);
              sendBossAlertBroadcast(`⏳ [보스 임박] **${b.boss_name}** 젠 5분 전입니다! 집결 준비하세요!`);
            }

            const keySpawned = `${b.id}_spawn_${b.next_spawn_time}`;
            if (diffSec <= 0 && diffSec > -60 && !notifiedBossSpawnMap.has(keySpawned)) {
              notifiedBossSpawnMap.add(keySpawned);
              sendBossAlertBroadcast(`🚨 [보스 젠 완료] **${b.boss_name}** 출현! 즉시 처치 바랍니다!`);
            }
          });
        } catch (e) {}
      }, 5000);
    }

    async function sendBossAlertBroadcast(msgText) {
      try {
        await apiRequest("guild_chats", "POST", [{
          sender_name: "보스 알림 봇",
          message: msgText,
          msg_type: "boss_alert",
          mentions: []
        }]);
      } catch (e) {}
    }

    // 프로필 모달 제어
    function openProfileModal() {
      document.getElementById("profileModal").style.display = "flex";
    }
    function confirmMyNickname() {
      const val = document.getElementById("selectMemberNickDropdown").value;
      if (!val) return alert("본인 닉네임을 선택해주세요!");
      myCurrentNick = val;
      localStorage.setItem("guild_my_nickname", val);
      updateProfileUI(val);
      document.getElementById("profileModal").style.display = "none";
    }
    function updateProfileUI(nick) {
      document.getElementById("sidebarUserNickName").innerText = nick;
      document.getElementById("sidebarAvatarInitial").innerText = nick.charAt(0);
    }

    // PWA 설치 버튼 핸들러
    function setupPwaInstallation() {
      const installBtn = document.getElementById("btnPwaInstall");
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = "inline-flex";
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            installBtn.style.display = "none";
          }
          deferredPrompt = null;
        });
      }
    }

    function scrollChatBottom() {
      const box = document.getElementById("chatMessagesView");
      box.scrollTop = box.scrollHeight;
    }
    function escapeHtmlText(t) {
      return t.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }
    function focusChatInput() {
      document.getElementById("inputChatMessage").focus();
    }
    function triggerBeepSound(isImportant = false) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = isImportant ? 880 : 587;
        gain.gain.value = 0.1;
        osc.start();
        setTimeout(() => osc.stop(), 180);
      } catch (e) {}
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA ServiceWorker 등록 완료:', reg.scope))
          .catch(err => console.warn('PWA 등록 실패:', err));
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
