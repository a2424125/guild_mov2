<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>길드 대화방</title>

  <!-- PWA 앱 설치 설정 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#bacee0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="길드톡">
  <link rel="apple-touch-icon" href="[https://cdn-icons-png.flaticon.com/512/3670/3670157.png](https://cdn-icons-png.flaticon.com/512/3670/3670157.png)">

  <!-- 부트스트랩 & 폰트어썸 아이콘 -->
  <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">
  <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">

  <!-- Supabase 공식 SDK 및 설정 파일 로드 -->
  <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
  <script src="supabase.js"></script>

  <style>
    :root {
      --kakao-bg: #bacee0;
      --kakao-yellow: #fee500;
      --kakao-unread-yellow: #ffeb3b;
      --kakao-bubble-me: #fee500;
      --kakao-bubble-other: #ffffff;
      --kakao-text-black: #191919;
      --kakao-time-gray: #556677;
      --kakao-header-bg: #bacee0;
      --drawer-width: 260px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--kakao-bg);
      color: var(--kakao-text-black);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      position: relative;
      min-width: 0;
      width: 100%;
    }

    /* 서랍 공통 백드롭 */
    .drawer-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 99998;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .drawer-backdrop.show {
      display: block;
      opacity: 1;
    }

    /* 1. 햄버거 메뉴 서랍 (260px) */
    .app-sidebar-drawer {
      position: fixed;
      top: 0; left: 0;
      width: var(--drawer-width);
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #dcdcdc;
      z-index: 99999;
      transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      visibility: hidden;
    }
    .app-sidebar-drawer.open {
      transform: translateX(0);
      visibility: visible;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
    }

    .sidebar-header {
      height: 50px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ececec;
      background: #f7f7f7;
      flex-shrink: 0;
    }
    .sidebar-brand {
      font-weight: 800;
      font-size: 0.92rem;
      color: #191919;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .sidebar-close-btn {
      background: none; border: none;
      color: #707070; font-size: 1.15rem;
      cursor: pointer;
    }

    .sidebar-menu-list {
      list-style: none;
      padding: 8px 6px;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }
    .sidebar-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: #333333;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s ease;
      margin-bottom: 2px;
    }
    .sidebar-menu-item:hover { background: #f0f0f0; color: #111111; }
    .sidebar-menu-item i { width: 20px; text-align: center; font-size: 0.95rem; }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid #ececec;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }
    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 11px;
      background: #fee500;
      border: 1px solid #e5cf00;
      display: flex;
      align-items: center; justify-content: center;
      color: #191919; font-size: 1rem; font-weight: 800;
      flex-shrink: 0;
      position: relative;
    }
    .user-name-text {
      font-size: 0.82rem; font-weight: 700; color: #191919;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-sub-class {
      font-size: 0.68rem; color: #0284c7; font-weight: 600;
    }

    /* 2. 길드원 목록 서랍 (260px) */
    .app-members-drawer {
      position: fixed;
      top: 0; left: 0;
      width: var(--drawer-width);
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #dcdcdc;
      z-index: 99999;
      transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      visibility: hidden;
    }
    .app-members-drawer.open {
      transform: translateX(0);
      visibility: visible;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
    }

    .members-drawer-header {
      height: 50px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ececec;
      background: #f7f7f7;
      flex-shrink: 0;
    }
    .members-drawer-title {
      font-weight: 800;
      font-size: 0.92rem;
      color: #191919;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .members-header-tools {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-tool-icon {
      background: none; border: none;
      color: #475569; font-size: 0.95rem;
      padding: 5px; cursor: pointer;
      border-radius: 5px;
    }
    .btn-tool-icon:hover { background: #e2e8f0; color: #1e293b; }

    .members-search-wrap {
      padding: 6px 10px;
      background: #ffffff;
      border-bottom: 1px solid #f0f0f0;
      position: relative;
    }
    .members-search-input {
      width: 100%;
      background: #f4f5f7;
      border: none;
      border-radius: 14px;
      padding: 5px 10px 5px 28px;
      font-size: 0.78rem;
      outline: none;
    }

    .members-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 2px 0;
    }
    .members-list-scroll::-webkit-scrollbar { width: 4px; }
    .members-list-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

    .kakao-member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .kakao-member-row:hover { background: #f8fafc; }

    .member-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .avatar-wrapper-relative {
      position: relative;
      flex-shrink: 0;
    }
    .member-avatar-round {
      width: 34px; height: 34px;
      border-radius: 12px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #3b82f6;
    }
    .member-avatar-round.master { background: #fef08a; border-color: #eab308; color: #854d0e; }
    .member-avatar-round.sub { background: #f3e8ff; border-color: #c084fc; color: #6b21a8; }

    .mini-badge-me-tag {
      position: absolute;
      top: -3px;
      left: -4px;
      background: #f59e0b;
      color: #ffffff;
      font-size: 0.55rem;
      font-weight: 900;
      padding: 1px 3px;
      border-radius: 7px;
      border: 1px solid #ffffff;
      line-height: 1;
      pointer-events: none;
    }

    .member-info-col {
      display: flex; flex-direction: column; min-width: 0;
    }
    .member-name-text {
      font-size: 0.82rem; font-weight: 700; color: #191919;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .member-class-desc {
      font-size: 0.65rem;
      font-weight: 600;
      color: #0284c7;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-badge-tag {
      font-size: 0.62rem; font-weight: 700; padding: 1px 3px;
      border-radius: 3px; white-space: nowrap;
    }
    .role-tag-master { background: #fef08a; color: #854d0e; }
    .role-tag-sub { background: #f3e8ff; color: #6b21a8; }
    .role-tag-elite { background: #e0f2fe; color: #0369a1; }
    .role-tag-normal { background: #f1f5f9; color: #64748b; }

    .member-row-actions {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .btn-action-pill {
      background: none; border: 1px solid #e2e8f0;
      color: #64748b; font-size: 0.65rem; padding: 1px 5px;
      border-radius: 5px; cursor: pointer;
    }
    .btn-action-pill:hover { background: #f1f5f9; color: #111; }

    /* ========================================================
       3. 메인 대화창 레이아웃
       ======================================================== */
    .app-main-layout {
      flex: 1;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      position: relative;
      background: var(--kakao-bg);
      min-width: 0;
    }

    .kakao-chat-header {
      height: 48px;
      padding: 0 10px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--kakao-header-bg);
      flex-shrink: 0;
      z-index: 10;
      min-width: 0;
    }
    .header-left-area {
      display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;
    }
    .room-avatar-circle {
      width: 32px; height: 32px;
      border-radius: 12px; background: #5b8296;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.95rem; flex-shrink: 0;
    }
    .room-info-box {
      display: flex; flex-direction: column; min-width: 0; flex: 1;
    }
    .room-title-text {
      font-size: 0.88rem; font-weight: 700; color: #191919;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .room-count-text {
      font-size: 0.72rem; color: #556677; font-weight: 600; cursor: pointer;
    }
    .header-right-tools {
      display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    }
    .btn-kakao-head {
      background: none; border: none; color: #3b4b59;
      font-size: 0.95rem; cursor: pointer
